name: pcn874-spec-watch

# Why this exists.
#
# products/pcn874 validates against a layout rendered from three open-source
# implementations, NOT from the Israel Tax Authority's own PCN874 specification —
# gov.il and both commercial mirrors of the document are egress-blocked from the
# container the product was built in (verified 2026-09-07: the proxy answers the
# CONNECT with 403).
#
# GitHub Actions has egress. This job downloads the specification from the URLs
# products/pcn874/src/sources.ts records — every one of which came from a source
# (the accounter repo's own README, or the colony sweep's audit), none invented —
# stores the SHA-256 of what came back, and fails when a stored hash changes.
#
# What it buys: a later session with an unblocked path can pull the artefact this
# job proves is reachable and diff the real document against
# products/pcn874/docs/SPEC-FROM-SOURCES.md, instead of re-deriving the layout.
# What it does NOT do: read the PDF, or turn "three implementations agree" into
# "the Tax Authority says". Only a human or an agent that reads the document does
# that.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pcn874-spec-watch.yml"
      - "products/pcn874/docs/SPEC-SOURCES.lock.json"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/pcn874
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the specification and compare hashes
        run: node scripts/spec-watch.mjs
      - name: Keep the downloaded specification for a future session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcn874-spec
          path: products/pcn874/.spec-downloads/
          if-no-files-found: ignore
          retention-days: 90
