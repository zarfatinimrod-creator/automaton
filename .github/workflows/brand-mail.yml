name: brand-mail

# Owner step 8, the brand mailbox (research/breadth/BOARD.md Q2): the agent reads it and the
# owner never answers anyone. Three commands, all scripts/brand_mail.py (Python standard
# library only, so there is nothing to install):
#
#   probe  IMAP, read-only (EXAMINE and BODY.PEEK only), NUMBERS ONLY: unread, possible
#          replies per venue question, accessibility mail unanswered 7+ days. Written to
#          state/colony/brand-mail.json and committed; the colony tick reads that file into the
#          report and makes overdue accessibility mail, and a reading 2+ days old, a blocker
#          (src/revenue/brand-mail.ts).
#   send   One of the venue questions in research/owner-asks/questions.json. A DRY RUN
#          unless really_send is ticked; the dry run prints the message and its messageSha256,
#          and a real send needs that digest in message_sha256, so what leaves is what was read.
#          The record goes into research/owner-asks/sent.json and is committed here; the script
#          refuses a second message to the same venue (checking the Sent folder too) except the
#          one follow-up the note allows (research/owner-asks/brand-mailbox-questions.md,
#          "How it is sent").
#   respond-refunds  The il-biz-tools Pro refund responder (research/channel-loop/
#          RULING-2026-09-29-lines.md (h)). Reads unanswered inbox mail; for a refund request
#          whose sender the receiving server authenticated (DKIM or SPF pass for the From
#          domain) it runs products/il-biz-tools/scripts/gumroad-pro-product.js refund, which
#          refunds only that buyer's sale of that product inside the window Gumroad applies,
#          once; then it answers with one fixed sentence and marks the mail answered. A DRY
#          RUN unless scheduled or really_refund is ticked; a real run only from main. A
#          refund Gumroad refuses for balance gets one holding reply and waits in
#          state/colony/refund-retries.json (sale ids and times, never an address), retried by
#          sale id every run (RULING-2026-09-30-documents (d)); that file is the one thing it
#          commits. The probe reports it in state/colony/brand-mail.json
#          ("responders": ["gumroad-refund"]) only because this file schedules it, and
#          il-biz-tools' enable refuses to open the sale without that.
#
# THE SECRETS LIVE IN THE ENVIRONMENT brand-mailbox, whose deployment branches the owner limits
# to main (step 8), NOT in repository secrets: every branch and every workflow could read those.
# Both jobs name the environment, so GitHub hands the secrets only to a run on main; the guard
# step and the script check the ref again. Dispatch from main, dry runs included.
#
# Before step 8 the two secrets do not exist and every command prints {"configured": false}
# and exits 0: nothing is read, nothing is sent or refunded, the run is green. respond-refunds
# does the same while products/il-biz-tools/src/config/site.json has no gumroad.productId:
# before the Pro product exists nothing can have been sold, so no mail is read.
#
# The probe reports the responder only while the respond-refunds job below is word for word
# what scripts/brand_mail.py pins (REFUND_JOB_IF, REFUND_STEP_ENV, REFUND_STEP_RUN): change
# that job and the same change goes there, or enable refuses to open the sale.
#
# THE SCHEDULE (twice a day) runs the probe and the refund responder, and stays
# inert until step 8 exists: before it, a scheduled probe commits nothing (a dispatched one still records
# "not configured") and the responder prints {"configured": false}. Twice a day keeps the
# probe well inside the two days il-biz-tools' enable and the colony report accept, and
# answers a refund request within the day; the send job never runs on the schedule. A
# refund request that arrives just before the window closes is still honoured: the window
# is measured at the mail's arrival, not at the run.
#
# Secrets are read only through `env:` on the one step that needs them, never interpolated
# into a script, and never printed: the script prints error class names, not server text.

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "probe (read-only counts), send (one venue question) or respond-refunds (the Pro refund responder)"
        type: choice
        options: [probe, send, respond-refunds]
        default: probe
      venue:
        description: "send only: a venue id from research/owner-asks/questions.json (crazygames, wix, spreadshirt, n8n, indiebook, displate, teachsimple)"
        type: string
        required: false
      really_send:
        description: "send only: really send. Off = dry run that prints the message and its messageSha256. Honoured only on main."
        type: boolean
        default: false
      message_sha256:
        description: "send with really_send only: the messageSha256 the dry run of this message printed"
        type: string
        required: false
      really_refund:
        description: "respond-refunds only: refund and answer for real. Off = dry run (reads, says what it would do, changes nothing). Honoured only on main."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send:
    if: inputs.command == 'send'
    runs-on: ubuntu-latest
    environment: brand-mailbox
    # One send at a time, repository-wide: two runs reading the same sent.json could both pass
    # the one-message-per-venue check. A running send is never cancelled by a newer one. GitHub
    # keeps at most ONE pending run per group, so a third dispatch replaces a second that is
    # still waiting: that one is cancelled before it starts, nothing of it is sent, and it
    # must be dispatched again. Dispatch sends one at a time and wait for each.
    concurrency:
      group: brand-mail-send
      cancel-in-progress: false
    steps:
      - name: Refuse a real send from any ref but main
        if: inputs.really_send
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A real send runs only from refs/heads/main. Dispatch without really_send for a dry run."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Committing the record needs real history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # sent.json must be the latest record, or a send queued behind another could repeat it.
      - name: Move to the branch tip
        run: |
          git config user.name "colony-bot"
          git config user.email "colony-bot@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Unit tests (fake SMTP/IMAP, no network) before anything leaves
        run: python -m unittest -v

      - name: Send (a dry run unless really_send)
        id: send
        env:
          BRAND_MAIL_ADDRESS: ${{ secrets.BRAND_MAIL_ADDRESS }}
          BRAND_MAIL_APP_PASSWORD: ${{ secrets.BRAND_MAIL_APP_PASSWORD }}
          VENUE: ${{ inputs.venue }}
          REALLY_SEND: ${{ inputs.really_send }}
          MESSAGE_SHA256: ${{ inputs.message_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${VENUE}" ]; then
            echo "::error::send needs a venue id from research/owner-asks/questions.json"
            exit 2
          fi
          ARGS=(send --venue "$VENUE")
          # The script refuses a real send whose digest is missing or is not the dry run's.
          if [ "$REALLY_SEND" = "true" ]; then ARGS+=(--really-send --message-sha256 "${MESSAGE_SHA256:-}"); fi
          python scripts/brand_mail.py "${ARGS[@]}"

      # Runs after a failed or cancelled send too: the record is written "uncertain" before the
      # message is handed to the server, so a venue cannot be mailed twice, and that record must
      # reach the repository. If it never does, the next send's Sent-folder check refuses anyway.
      - name: Commit the send record
        if: always() && inputs.really_send && steps.send.outcome != 'skipped'
        env:
          VENUE: ${{ inputs.venue }}
        run: |
          set -euo pipefail
          git add research/owner-asks/sent.json
          if git diff --cached --quiet; then
            echo "No record to commit."
            exit 0
          fi
          # On the run page first, so the record survives even if every push below fails.
          { echo '### research/owner-asks/sent.json after this send'; echo '```json'; cat research/owner-asks/sent.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # [skip ci]: a record is data, not code.
          git commit -m "brand-mail: ${VENUE} message recorded in sent.json [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected; rebasing and retrying (attempt ${attempt})."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::Could not push research/owner-asks/sent.json. The record is in this run's summary; add it by hand. Until then every send to ${VENUE} is refused by the Sent-folder check."
          exit 1

  probe:
    if: github.event_name == 'schedule' || inputs.command == 'probe'
    runs-on: ubuntu-latest
    environment: brand-mailbox
    # Its own group, not colony.yml's colony-state: GitHub keeps one pending run per group, so a
    # dispatched probe there could replace a waiting hourly tick. The probe commits only
    # state/colony/brand-mail.json, which the tick never writes, and both jobs rebase and retry
    # on a rejected push, so they need no shared lock.
    concurrency:
      group: brand-mail-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Move to the branch tip
        run: |
          git config user.name "colony-bot"
          git config user.email "colony-bot@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Unit tests (fake SMTP/IMAP, no network)
        run: python -m unittest -v

      # The file is written only when the probe succeeds; a failed login or a server error
      # leaves the last good reading in place and fails this step.
      - name: Probe the brand mailbox (read-only, numbers only)
        env:
          BRAND_MAIL_ADDRESS: ${{ secrets.BRAND_MAIL_ADDRESS }}
          BRAND_MAIL_APP_PASSWORD: ${{ secrets.BRAND_MAIL_APP_PASSWORD }}
        run: python scripts/brand_mail.py probe --out state/colony/brand-mail.json

      - name: Commit the numbers
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Before step 8 the schedule stays silent: no "not configured" commit twice a day.
          if [ "${EVENT:-}" = "schedule" ] && ! python -c 'import json, sys; sys.exit(0 if json.load(open("state/colony/brand-mail.json")).get("configured") else 1)'; then
            echo "Step 8 is not done: a scheduled probe commits nothing."
            exit 0
          fi
          git add state/colony/brand-mail.json
          if git diff --cached --quiet; then
            echo "No change since the last probe."
            exit 0
          fi
          SUMMARY=$(python - <<'PY'
          import json
          d = json.load(open("state/colony/brand-mail.json"))
          if not d.get("configured"):
              print("not configured")
          else:
              print("%d unread, %d accessibility overdue" % (d["unread"], d["accessibility"]["unansweredOver7Days"]))
          PY
          )
          # [skip ci]: numbers, not code.
          git commit -m "brand-mail probe: ${SUMMARY} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected; rebasing and retrying (attempt ${attempt})."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "Could not push the probe's numbers after 3 attempts." >&2
          exit 1

      - name: Surface the numbers in the run summary
        if: always()
        run: |
          if [ -f state/colony/brand-mail.json ]; then
            { echo '```json'; cat state/colony/brand-mail.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  respond-refunds:
    if: github.event_name == 'schedule' || inputs.command == 'respond-refunds'
    runs-on: ubuntu-latest
    environment: brand-mailbox
    # It changes mail flags and Gumroad sales, and in the repository only
    # state/colony/refund-retries.json (the balance retries), which the last step commits.
    permissions:
      contents: write
    # One responder at a time: two runs reading the same unanswered mail could answer twice
    # (a second refund of the same sale is refused by the refund command and by Gumroad).
    concurrency:
      group: brand-mail-respond-refunds
      cancel-in-progress: false
    steps:
      - name: Refuse a real refund run from any ref but main
        if: github.event_name == 'workflow_dispatch' && inputs.really_refund
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A real refund run goes only from refs/heads/main. Dispatch without really_refund for a dry run."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Committing the balance retries needs real history, not a shallow clone.
          fetch-depth: 0
          # No token left in .git/config: the respond step holds the mailbox password and the
          # Gumroad token and reads untrusted mail. The two steps that talk to the remote -
          # "Move to the branch tip" and "Commit the balance retries" - get github.token by env
          # and hand it to git per command (remote(), below), as the header actions/checkout
          # would have stored; no other step of this job ever holds it.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The refund itself is products/il-biz-tools/scripts/gumroad-pro-product.js refund:
      # Node's built-in fetch, no install step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The balance retries must be the last ones committed, or a run queued behind another
      # would retry from a stale list (a schedule run checks out the commit it was queued on).
      - name: Move to the branch tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "colony-bot"
          git config user.email "colony-bot@users.noreply.github.com"
          remote() {
            local auth
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::${auth}"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" git "$@"
          }
          remote pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Unit tests (fake IMAP, SMTP and refund command, no network) before any refund
        run: python -m unittest -v

      # The script checks the ref again for --apply, prints counts, UIDs and sale ids only,
      # and hands the Gumroad token to the refund command alone.
      - name: Respond to refund requests (a dry run unless scheduled or really_refund)
        id: respond
        env:
          BRAND_MAIL_ADDRESS: ${{ secrets.BRAND_MAIL_ADDRESS }}
          BRAND_MAIL_APP_PASSWORD: ${{ secrets.BRAND_MAIL_APP_PASSWORD }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          EVENT: ${{ github.event_name }}
          REALLY_REFUND: ${{ inputs.really_refund }}
        run: |
          set -euo pipefail
          ARGS=(respond-refunds)
          if [ "${EVENT:-}" = "schedule" ] || [ "${REALLY_REFUND:-}" = "true" ]; then ARGS+=(--apply); fi
          python scripts/brand_mail.py "${ARGS[@]}"

      # Runs after a failed respond step too: a holding reply may already have gone out, and its
      # retry must reach the repository or the refund is never retried. Sale ids and times only.
      # A dry run writes nothing, so there is nothing to commit. The one condition besides the
      # guard's that scripts/brand_mail.py pins (REFUND_COMMIT_IF).
      - name: Commit the balance retries
        if: always() && steps.respond.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=state/colony/refund-retries.json
          if [ ! -f "$FILE" ]; then
            echo "No balance retries recorded."
            exit 0
          fi
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No change to the balance retries."
            exit 0
          fi
          # On the run page first, so the retries survive even if every push below fails.
          { echo '### state/colony/refund-retries.json after this run'; echo '```json'; cat "$FILE"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "colony-bot"
          git config user.email "colony-bot@users.noreply.github.com"
          # [skip ci]: a record is data, not code.
          git commit -m "brand-mail: refund balance retries [skip ci]"
          remote() {
            local auth
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::${auth}"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" git "$@"
          }
          for attempt in 1 2 3; do
            if remote push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected; rebasing and retrying (attempt ${attempt})."
            # A pull that fails too (the outage that failed the push) or stops on a conflict must not end
            # the step under set -e before the error below: abort the rebase and try again.
            if ! remote pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
            fi
          done
          echo "::error::Could not push state/colony/refund-retries.json. It is in this run's summary; add it by hand, or the refunds in it are not retried."
          exit 1
