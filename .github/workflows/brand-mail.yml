name: brand-mail

# Owner step 8, the brand mailbox (research/breadth/BOARD.md Q2): the agent reads it and the
# owner never answers anyone. Two commands, both scripts/brand_mail.py (Python standard
# library only, so there is nothing to install):
#
#   probe  IMAP, read-only (EXAMINE and BODY.PEEK only), NUMBERS ONLY: unread, replies per
#          venue question, accessibility mail unanswered 7+ days. Written to
#          state/colony/brand-mail.json and committed; the colony tick reads that file into the
#          report and makes overdue accessibility mail a blocker (src/revenue/brand-mail.ts).
#   send   One of the four venue questions in research/owner-asks/questions.json. A DRY RUN
#          unless really_send is ticked, and a real send happens only on main. After a real
#          send the record goes into research/owner-asks/sent.json and is committed here; the
#          script refuses a second message to the same venue except the one follow-up the note
#          allows (research/owner-asks/brand-mailbox-questions.md, "How it is sent").
#
# Before step 8 the two secrets do not exist and both commands print {"configured": false}
# and exit 0: nothing is read, nothing is sent, the run is green.
#
# NO SCHEDULE YET, on purpose. Once step 8 is done, add the probe to colony.yml as a step
# before the tick (`python3 scripts/brand_mail.py probe --out state/colony/brand-mail.json`,
# with BRAND_MAIL_ADDRESS and BRAND_MAIL_APP_PASSWORD in that step's env), so every hourly
# report carries the numbers. Until then this workflow is dispatch-only.
#
# Secrets are read only through `env:` on the one step that needs them, never interpolated
# into a script, and never printed: the script prints error class names, not server text.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "probe (read-only counts) or send (one venue question)"
        type: choice
        options: [probe, send]
        default: probe
      venue:
        description: "send only: a venue id from research/owner-asks/questions.json (crazygames, wix, spreadshirt, n8n)"
        type: string
        required: false
      really_send:
        description: "send only: really send. Off = dry run that prints the message. Honoured only on main."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send:
    if: inputs.command == 'send'
    runs-on: ubuntu-latest
    # One send at a time, repository-wide: two runs reading the same sent.json could both pass
    # the one-message-per-venue check. A queued send waits; it is never cancelled half-way.
    concurrency:
      group: brand-mail-send
      cancel-in-progress: false
    steps:
      - name: Refuse a real send from any ref but main
        if: inputs.really_send
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A real send runs only from refs/heads/main. Dispatch without really_send for a dry run."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Committing the record needs real history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # sent.json must be the latest record, or a send queued behind another could repeat it.
      - name: Move to the branch tip
        run: |
          git config user.name "colony-bot"
          git config user.email "colony-bot@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Unit tests (fake SMTP/IMAP, no network) before anything leaves
        run: python -m unittest -v

      - name: Send (a dry run unless really_send)
        id: send
        env:
          BRAND_MAIL_ADDRESS: ${{ secrets.BRAND_MAIL_ADDRESS }}
          BRAND_MAIL_APP_PASSWORD: ${{ secrets.BRAND_MAIL_APP_PASSWORD }}
          VENUE: ${{ inputs.venue }}
          REALLY_SEND: ${{ inputs.really_send }}
        run: |
          set -euo pipefail
          if [ -z "${VENUE}" ]; then
            echo "::error::send needs a venue id from research/owner-asks/questions.json"
            exit 2
          fi
          ARGS=(send --venue "$VENUE")
          if [ "$REALLY_SEND" = "true" ]; then ARGS+=(--really-send); fi
          python scripts/brand_mail.py "${ARGS[@]}"

      # Runs after a failed send too: a connection lost mid-send is recorded "uncertain" so the
      # venue cannot be mailed twice, and that record must reach the repository.
      - name: Commit the send record
        if: always() && inputs.really_send && steps.send.outcome != 'skipped'
        env:
          VENUE: ${{ inputs.venue }}
        run: |
          set -euo pipefail
          git add research/owner-asks/sent.json
          if git diff --cached --quiet; then
            echo "No record to commit."
            exit 0
          fi
          # [skip ci]: a record is data, not code.
          git commit -m "brand-mail: ${VENUE} message recorded in sent.json [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected; rebasing and retrying (attempt ${attempt})."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::Could not push research/owner-asks/sent.json. The record is printed above; add it by hand before any further send to ${VENUE}."
          exit 1

  probe:
    if: inputs.command == 'probe'
    runs-on: ubuntu-latest
    # Serialised with the colony tick (colony.yml's group): both commit under state/colony.
    concurrency:
      group: colony-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Move to the branch tip
        run: |
          git config user.name "colony-bot"
          git config user.email "colony-bot@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Unit tests (fake SMTP/IMAP, no network)
        run: python -m unittest -v

      # The file is written only when the probe succeeds; a failed login or a server error
      # leaves the last good reading in place and fails this step.
      - name: Probe the brand mailbox (read-only, numbers only)
        env:
          BRAND_MAIL_ADDRESS: ${{ secrets.BRAND_MAIL_ADDRESS }}
          BRAND_MAIL_APP_PASSWORD: ${{ secrets.BRAND_MAIL_APP_PASSWORD }}
        run: python scripts/brand_mail.py probe --out state/colony/brand-mail.json

      - name: Commit the numbers
        run: |
          set -euo pipefail
          git add state/colony/brand-mail.json
          if git diff --cached --quiet; then
            echo "No change since the last probe."
            exit 0
          fi
          SUMMARY=$(python - <<'PY'
          import json
          d = json.load(open("state/colony/brand-mail.json"))
          if not d.get("configured"):
              print("not configured")
          else:
              print("%d unread, %d accessibility overdue" % (d["unread"], d["accessibility"]["unansweredOver7Days"]))
          PY
          )
          # [skip ci]: numbers, not code.
          git commit -m "brand-mail probe: ${SUMMARY} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected; rebasing and retrying (attempt ${attempt})."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "Could not push the probe's numbers after 3 attempts." >&2
          exit 1

      - name: Surface the numbers in the run summary
        if: always()
        run: |
          if [ -f state/colony/brand-mail.json ]; then
            { echo '```json'; cat state/colony/brand-mail.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
