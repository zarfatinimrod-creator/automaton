name: render-watch

# Why this exists.
#
# Three measurements in research/measurements/ end in a verdict of UNKNOWN and a
# sentence naming ONE page that would change it:
#
#   - freemius-rail.md §10.1 — the Freemius supported-countries page. "That single
#     page converts this whole report from UNKNOWN to a verdict." docs/REJECTED.md
#     spells out the mechanism it wants: "fetched from a host with egress (a CI job,
#     as pcn874-spec-watch.yml does)". This is that CI job.
#   - eaa-occupancy.md §8.1-8.2 — one JSON call to the Apify store, and two cheap
#     scanners' pricing pages.
#   - tenders-occupancy.md §8.2-8.3 — a rendered Govi pricing page, and whether
#     mr.gov.il offers free per-interest alerts.
#
# Every one of those URLs is egress-blocked from the container the research ran in,
# and so is web.archive.org, which is the usual rescue — freemius-rail.md records
# the proxy's 403 on both, one attempt each, no routing around it. GitHub's runners
# have egress. So the pages get fetched here and committed into the repository, and
# a later session reads them out of git instead of re-running six blocked fetches.
#
# What this buys: a claim can move from [SNIPPET] to [RENDERED] with the bytes in
# the repo to back it. What it does NOT do: read the pages, or grade anything.
# Storing a page is not evidence of a fact — research/rendered/README.md says how
# the hand-off from stored bytes to a graded claim actually works, and it needs a
# session that reads the text.
#
# Same shape as pcn874-spec-watch.yml, widened from one document to a list, plus the
# commit-back pattern from apify-publish.yml's count-runs job.
#
# The JavaScript-capable render mode (the loop board, research/channel-loop/
# RULING-2026-09-29-loop.md (b), "Tick 17-18, tooling"). A line in urls.txt may end in
# a third field, `js`: that URL is loaded in headless Chromium instead of fetched,
# because some pages reach a plain GET as an empty JavaScript shell. The browser is
# installed ONLY when the list (or the dispatch override) has such a line — a plain
# week installs nothing, exactly as before. Plain navigation only: one page load per
# URL, a fresh browser context each time, no clicks, no logins, no stored cookies, no
# stealth settings, the same User-Agent and 30 s / 5 MB caps as a plain GET. A js line
# is queued with scripts/queue-zero-test.mjs --js --terms <slug>, which refuses unless
# <slug> is a successful capture of the target site's own terms (and the person queueing
# it has read them and found no bar on automated access). A js line added to urls.txt by
# hand, or typed into the dispatch box below, is checked by no code: the reviewed commit,
# or whoever dispatches, is the only gate there.
# render-watch never fetches tiktok.com in either mode: the parser refuses it, a plain
# fetch refuses a redirect to it before following, and the browser cannot resolve its
# names at all (logs/CHANNEL_LOOP.md §9; logs/FABLE_QUEUE.md row 16(d)).
# A js line whose browser is unavailable (not installed, not started, or stopped during
# the run) is skipped, not recorded as the site's answer; the run then fails in its last
# step, after the plain captures are committed.
#
# The write token. actions/checkout does NOT persist it (persist-credentials: false), and
# it is handed to git only in the two steps that need it — the pull before the fetch and
# the push after it — as an environment-scoped http.extraheader, the same header checkout
# itself would have written. So the fetch step, where Chromium runs the target page's own
# JavaScript (without its OS sandbox, Playwright's default), has no write credential in
# .git/config or its environment. Stated, not hidden: that narrows the exposure, it does
# not remove it — a page that escaped Chromium would still be on the runner the job runs
# on. A read-only render job with a separate commit job would go further; not built here.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: >-
          Optional. Override the list for this one run: one URL per line, an optional
          slug after whitespace, then optionally `js` for the JavaScript-capable render,
          `#` for a comment — the same syntax as research/rendered/urls.txt (tiktok.com
          is refused here too). Leave empty to fetch that file. Nothing typed
          here is written back to urls.txt; a URL worth keeping goes in the file with
          the research sentence that names it.
        required: false
        type: string
  schedule:
    # Weekly, Tuesday. Deliberately not on the hour and not at :00 — GitHub's own
    # docs warn the top of the hour is the busiest slot and scheduled runs get
    # delayed there. Note GitHub only runs `schedule` from the default branch; on a
    # feature branch this workflow is dispatch-only until it merges.
    - cron: "23 5 * * 2"
  # No `push` trigger, on purpose: a push of urls.txt plus a manual dispatch made two
  # runs race for the same files on 7.9.2026, and the loser's rebase conflicted on the
  # regenerated captures. Adding a URL is: push urls.txt, then dispatch once.

# The job commits the fetched pages back to the branch it ran on.
permissions:
  contents: write

# Two runs fetching the same six pages would fight over the same files and produce
# two commits racing for the same ref. Serialise them. `cancel-in-progress: false`
# because a half-written capture is worse than a capture that waits — same reasoning
# as apify-publish.yml, and a separate group from it because these write different
# paths and must not silently cancel each other.
concurrency:
  group: render-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # The whole list took 6 minutes in the fetch step at 158 URLs (run 28, 28.9.2026), so about 8
    # at today's 211. Every URL is bounded (30 s, the rendered DOM included), so 30 minutes is
    # room, not a target: it is here so a hang nothing foresaw costs half an hour and not
    # GitHub's default six hours. A cancelled run commits nothing, so keep it above the list's
    # real duration as the list grows.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Committing needs real history, not a shallow clone. The default ref is
          # the one the workflow ran on, which is where the commit belongs: a
          # dispatch from a feature branch stores its pages on that branch.
          fetch-depth: 0
          # No write token left in .git/config for the steps that follow: the fetch step runs
          # third-party JavaScript. The pull and push steps get it for themselves (header comment).
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pdftotext, so a fetched PDF is stored with a readable text beside it. The
      # container the research runs in has no PDF extractor at all: on 28.9.2026 the
      # CrazyGames developer terms were captured as a PDF and could not be read.
      # Nothing in this repository documents what the runner image ships, so this
      # checks at run time and installs only when pdftotext is absent. It is
      # continue-on-error on purpose: without pdftotext every page is still fetched,
      # and each PDF's .meta.json records `textError` instead of a text — a failed
      # apt-get must not cost the week's captures.
      - name: Install pdftotext (poppler-utils) for PDF text extraction
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends poppler-utils >/dev/null \
              || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends poppler-utils >/dev/null; }
          fi
          # The version line goes in the run log; some poppler builds exit non-zero on -v.
          pdftotext -v 2>&1 | head -n 1 || true

      # No npm install step for a plain list: scripts/render-watch.mjs is stdlib plus
      # the built-in fetch, on purpose. A weekly fetch that depends on a package tree is
      # a weekly fetch somebody else's release can break. (pdftotext above is a system
      # program the script runs if it is there, not a dependency it needs.) The one
      # package, playwright-core, is installed below only for a list with a js line.
      #
      # The script never throws on a bad page. A 403, a timeout, a 404 — each is
      # recorded in that page's .meta.json and the run still exits 0, because a site
      # refusing us is data about the site, not a broken build. It exits non-zero
      # only when the script itself is broken: a malformed urls.txt, a duplicate
      # slug, an unwritable output directory. Bodies are capped at 5 MB.
      # A queued run checks out the sha it was queued on. By the time it starts, the run
      # before it may have committed fresh captures to the branch. Fetch from the tip
      # so this run's "changed since last time" compares against those, not against
      # a stale tree — that stale comparison is what produced two commits fighting
      # over the same meta files on 7.9.2026.
      - name: Move to the branch tip before fetching
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The write token, for this step's git only (checkout persisted none). The same header
          # actions/checkout writes, set through git's environment rather than .git/config.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::${AUTH}"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}"
          git config user.name "colony-bot"
          git config user.email "colony-bot@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      # The list is parsed here with the script's own parser, from the same source the
      # fetch step reads (the dispatch override, else urls.txt). A malformed list — or a
      # tiktok.com line — fails the run here, before anything is installed or fetched.
      - name: Does the list need a browser (a js line)?
        id: mode
        env:
          RENDER_WATCH_URLS: ${{ inputs.urls }}
        run: node scripts/render-watch.mjs --needs-browser >> "$GITHUB_OUTPUT"

      # Only for a list with a js line. playwright-core at the exact version package.json
      # pins, installed OUTSIDE the checkout (so nothing under the repo changes and the
      # commit step cannot pick it up), without running any package script; then the
      # Chromium headless shell that version was built for, with its system libraries.
      # Keep the pin current: this browser runs third-party JavaScript, and the pin is what
      # decides how old that Chromium is (1.63.0 → Chrome Headless Shell 153).
      # continue-on-error for the same reason as pdftotext above: a failed install must not
      # cost the week's plain captures. The script then skips the js lines, writes nothing
      # for them, and the last step fails the run.
      - name: Install the browser for js lines (playwright-core + Chromium)
        if: steps.mode.outputs.js == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          PW_VERSION=$(node -p 'require("./package.json").devDependencies["playwright-core"]')
          if ! [[ "$PW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must pin playwright-core to an exact version, got '${PW_VERSION}'." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/render-watch-js"
          npm install --prefix "$RUNNER_TEMP/render-watch-js" --no-save --no-package-lock --no-audit --no-fund --ignore-scripts "playwright-core@${PW_VERSION}"
          node "$RUNNER_TEMP/render-watch-js/node_modules/playwright-core/cli.js" install --with-deps --only-shell chromium

      - name: Fetch the pages the research says would settle a question
        id: fetch
        env:
          RENDER_WATCH_URLS: ${{ inputs.urls }}
          # Where the install step above put playwright-core. The script resolves it through
          # NODE_PATH only when a js line asks for a browser; a plain list never looks.
          NODE_PATH: ${{ runner.temp }}/render-watch-js/node_modules
        run: node scripts/render-watch.mjs

      - name: Commit the fetched pages back to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The write token, for this step's git only (checkout persisted none). The same header
          # actions/checkout writes, set through git's environment rather than .git/config.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::${AUTH}"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}"

          git config user.name "colony-bot"
          git config user.email "colony-bot@users.noreply.github.com"

          # Stage first, then compare the index: on the very first run every file
          # under research/rendered/ is untracked and `git diff` alone would report
          # no change and skip the commit forever. (The same trap apify-publish.yml
          # and colony.yml both document.)
          git add research/rendered/
          if git diff --cached --quiet; then
            echo "No page changed since the last run. Nothing to commit."
            echo "No page changed since the last run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CHANGED=$(git diff --cached --name-only -- 'research/rendered/*.meta.json' | wc -l | tr -d ' ')
          # [skip ci] keeps a capture commit from retriggering the test workflows —
          # nothing under research/rendered/ is code.
          git commit -m "render: ${CHANGED} page(s) changed [skip ci]"

          # Another job can legitimately land on this branch between our checkout and
          # our push. Rebase and retry rather than throwing away a capture.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Committed ${CHANGED} changed page(s) to ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected; rebasing and retrying (attempt ${attempt})."
            # `-X theirs` during a rebase keeps the commit being replayed — this run's
            # fresh capture — when both sides rewrote the same regenerated file.
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "Could not push the fetched pages after 3 attempts." >&2
          exit 1

      # Last, after the commit, so the plain captures are already on the branch: a js line
      # that could not be rendered because the browser was unavailable must not pass as a quiet week.
      - name: Fail the run if js lines could not be rendered
        if: steps.fetch.outputs.js_skipped != '' && steps.fetch.outputs.js_skipped != '0'
        env:
          JS_SKIPPED: ${{ steps.fetch.outputs.js_skipped }}
        run: |
          echo "::error title=render-watch js mode::${JS_SKIPPED} js line(s) could not be rendered: the browser was unavailable (not installed, not started, or stopped during the run). Their earlier captures are unchanged; the fetch step's SKIPPED lines say why." >&2
          exit 1
