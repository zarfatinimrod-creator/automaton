name: mcp-il-tools-publish

# Publish the free MCP server in products/mcp-il-tools: first the npm package @mehudak/mcp-il-tools,
# then its listing in the official MCP Registry as io.github.mehudak/il-tools.
#
# WHO CAN START IT. The only trigger is workflow_dispatch, but that does not mean only a person can start it.
# Anything holding a token with actions:write on this repository can dispatch it, with any inputs, from any
# branch that carries this file. That includes an agent's GitHub tool. So a real run (dry_run unticked) is held
# by locks that do not depend on who started it:
#   - Main only. The check job fails a real run started from any other ref, and both publishing jobs
#     carry the same condition.
#   - The npm token is an environment secret. It lives only in the GitHub environment "npm-publish" (owner
#     step 9), which the owner limits to the main branch and to a required reviewer. The publish job waits for
#     that approval before it receives the token, and a run from another branch cannot read it.
#   - No NPM_TOKEN outside the environment. If NPM_TOKEN is also a repository or organisation secret, every
#     run fails: every workflow on every branch could read a secret stored there.
#   - The registry login comes last. It is reachable only after that approved npm job has succeeded.
#
# ONE DISPATCH, AFTER TWO OWNER STEPS. A real run needs
#   - owner step 7: the GitHub organisation "mehudak" owns this repository. The registry's GitHub OIDC login
#     grants publish rights on io.github.<repository_owner>/* and on nothing else
#     (modelcontextprotocol/registry@bf4e88c, internal/api/handlers/v0/auth/github_oidc.go, buildPermissions).
#     From any other owner the login would not cover io.github.mehudak/il-tools, and the only name it would
#     cover carries that owner's account name.
#   - owner step 9 (proposed): the npm user "mehudak" (it owns the @mehudak scope), a granular access token of
#     that user, and the "npm-publish" environment holding it as NPM_TOKEN. The exact settings are in
#     products/mcp-il-tools/MAINTAINING.md.
#
# DRY RUN FIRST. dry_run defaults to true. A dry run runs from any branch and needs no owner step. It installs
# the dependencies, runs the tests, builds and packs the package, and asks npm whether this version exists and
# who published it. It also downloads and verifies the pinned mcp-publisher and validates server.json against
# the live registry (the /v0/validate endpoint, which stores nothing). It never enters the npm-publish
# environment, so it holds no npm token and cannot check one. It skips the npm-publish and registry-publish
# jobs entirely.
#
# JOBS
#   check              Every run. Guards, `npm ci` without lifecycle scripts, tests, build, the consistency,
#                      README and tarball checks, packs the tarball once, and asks npm about this version.
#                      No secret, no id-token.
#   registry-validate  Every run. Downloads the pinned mcp-publisher and validates server.json. No id-token.
#   npm-publish        Real runs from main only, in the environment npm-publish. The only job that reads
#                      NPM_TOKEN. It checks the token is the npm user mehudak's, then publishes the exact tarball
#                      the check job packed (no checkout, no node_modules, no lifecycle scripts). It then waits
#                      until npm serves that version at the URL the registry will read.
#   registry-publish   Real runs from main only, after both of the above. The only job with id-token: write:
#                      `login github-oidc` and `publish`, nothing else.
#
# NO PROVENANCE, ON PURPOSE. `npm publish --provenance` would attach a signed statement naming this
# repository, its workflow and its commit, and the npm page would link to them. Until the history is under
# the brand, that link leads to a personal account. So the flag is never passed, NPM_CONFIG_PROVENANCE is set
# to "false", and the npm publish runs in a job with no id-token permission: without an OIDC token npm could
# not produce provenance even if something asked for it.
#
# ACTION PINS. The jobs that hold nothing use GitHub's actions by major tag (@v4), like every other workflow
# in this repository. The two jobs that hold something pin every action by commit SHA: npm-publish holds the
# npm token and registry-publish holds the id-token. Any action running in a job can read that job's secrets
# from the runner's memory; the tj-actions/changed-files compromise of March 2025 did exactly that. The one
# third-party binary, mcp-publisher, is pinned by release and sha256 (workflow env below).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check, test, build and pack; publish nothing. Untick only on main, after owner steps 7 and 9."
        type: boolean
        default: true

permissions:
  contents: read

# Two publishes of the same version racing each other would both try npm and the registry. Serialise them;
# a half-finished publish is worse than one that waits.
concurrency:
  group: mcp-il-tools-publish
  cancel-in-progress: false

env:
  # https://github.com/modelcontextprotocol/registry/releases/tag/v1.8.1 (the release marked Latest when
  # this was written, 28.9.2026; the tag is commit f52dc85). The digest is the one GitHub lists for the
  # asset mcp-publisher_linux_amd64.tar.gz on that release page. The release's own checksums file
  # (registry_1.8.1_checksums.txt) must agree as well. To move the pin: change both lines together, from
  # the new release page, and run a dry run.
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  # ---------------------------------------------------------------------------------------------------------
  # Guards and checks, on every run. Holds no secret and no id-token.
  # ---------------------------------------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: products/mcp-il-tools
    outputs:
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      server: ${{ steps.meta.outputs.server }}
      tarball: ${{ steps.pack.outputs.tarball }}
      integrity: ${{ steps.pack.outputs.integrity }}
      already: ${{ steps.npmview.outputs.already }}
    steps:
      # The guards run before anything else, so a real run stops before it has built or downloaded anything.
      # They run in the (still empty) workspace because the product directory does not exist before checkout.
      #
      # The owner is read from the runner's default variable GITHUB_REPOSITORY_OWNER, not mapped under env:,
      # because GitHub prints a step's env: block at the top of its log. That keeps the owner out of this
      # step's log text. It is still in the run's URL until step 7 moves the repository; nothing here can
      # change that. The comparison is case-sensitive, like the registry's permission check.
      - name: Guard - the mehudak organisation owns this repository (owner step 7)
        working-directory: .
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY_OWNER}" = "mehudak" ]; then
            echo "The GitHub organisation mehudak owns this repository: io.github.mehudak/il-tools is ours to publish."
            exit 0
          fi
          MSG="Owner step 7 is not done yet: this repository is not owned by the GitHub organisation mehudak. The MCP Registry's GitHub login grants only io.github.<repository owner>/*, so io.github.mehudak/il-tools can be published only from a repository that organisation owns. Transfer the repository (docs/OWNER_STEPS.he.md, step 7), then dispatch again."
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run, continuing. A real run stops here. ${MSG}"
            echo "- Dry run: a real run would stop here. ${MSG}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::${MSG}"
          exit 1

      - name: Guard - a real run starts from main
        working-directory: .
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "This run started from main."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run from ${GITHUB_REF}: allowed. A real run publishes only from main."
            exit 0
          fi
          echo "::error::A real run publishes only from main, and this one started from ${GITHUB_REF}. Merge the change into main and dispatch the workflow on main."
          exit 1

      - name: Guard - NPM_TOKEN is not a repository or organisation secret (owner step 9)
        working-directory: .
        env:
          # A boolean, not the secret: this job never holds the token.
          NPM_TOKEN_OUTSIDE_ENVIRONMENT: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$NPM_TOKEN_OUTSIDE_ENVIRONMENT" = "false" ]; then
            echo "NPM_TOKEN is not readable outside the npm-publish environment."
            exit 0
          fi
          echo "::error::NPM_TOKEN is stored as a repository or organisation secret, which every workflow on every branch of this repository can read. Delete it there and store it only as a secret of the environment npm-publish (owner step 9, products/mcp-il-tools/MAINTAINING.md), then dispatch again."
          exit 1

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/mcp-il-tools/package-lock.json

      # The committed lockfile is required: plain `npm install` cannot resolve vitest's peers from scratch on
      # npm 10.9.7 (products/mcp-il-tools/MAINTAINING.md, Development). --ignore-scripts: no dependency's
      # install script runs; nothing here needs one (tests and the build pass without them).
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build

      # The registry refuses a server whose npm package does not carry "mcpName" equal to the server name
      # (modelcontextprotocol/registry, internal/validators/registries/npm.go, validateNPMPackage), and a
      # version triple out of step would list one version and install another. Checked here, before
      # anything is published, not discovered by the registry afterwards.
      - name: Check - versions, mcpName and the npm identifier agree
        id: meta
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const server = JSON.parse(readFileSync("server.json", "utf8"));
            const first = (server.packages ?? [])[0] ?? {};
            const problems = [];
            const check = (ok, msg) => { if (!ok) problems.push(msg); };
            check(pkg.version === server.version, `package.json version ${pkg.version} != server.json version ${server.version}`);
            check(pkg.version === first.version, `package.json version ${pkg.version} != server.json packages[0].version ${first.version}`);
            check(pkg.mcpName === server.name, `package.json mcpName ${pkg.mcpName} != server.json name ${server.name}`);
            check(first.identifier === pkg.name, `server.json packages[0].identifier ${first.identifier} != package.json name ${pkg.name}`);
            check(String(server.name).startsWith("io.github.mehudak/"), `server.json name ${server.name} is outside io.github.mehudak/, the only namespace this repository can log in to`);
            for (const field of ["repository", "homepage", "author", "bugs", "contributors"]) {
              check(!(field in pkg), `package.json has "${field}", which npm would print on the package page`);
            }
            if (problems.length) {
              for (const p of problems) console.log(`::error file=products/mcp-il-tools/package.json::${p}`);
              process.exit(1);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `name=${pkg.name}\nversion=${pkg.version}\nserver=${server.name}\n`);
            console.log(`${pkg.name}@${pkg.version} and ${server.name} ${server.version} agree.`);
          '

      # npm freezes README.md into every version it publishes: it is the package page. So it must stay true
      # once the package is live and carry nothing internal: no dated status, no "not published yet", no
      # runbook, no path into this repository. Those belong in MAINTAINING.md, which does not ship.
      - name: Check - README.md reads true on the npm page
        run: |
          set -euo pipefail
          if grep -nEi 'not on npm|not (yet )?(published|listed)|has not happened|status on [0-9]|owner step|NPM_TOKEN|KILLED_LINES|src/revenue|\]\(\.\.?/' README.md; then
            echo "::error file=products/mcp-il-tools/README.md::README.md ships in the npm tarball, and npm keeps it with the version for good. The lines above stop being true once the package is published, or are internal. Put status and publishing notes in MAINTAINING.md, which does not ship."
            exit 1
          fi
          echo "README.md has no status line, runbook or repository path."

      # The tarball npm will receive, packed once, here, without lifecycle scripts; the npm-publish job
      # uploads exactly this file. Anything outside the five allowed paths fails the run, and tests/,
      # node_modules/ and .env files are named explicitly so the failure says why.
      - name: Pack - the tarball holds only dist/, src/, README.md, package.json and LICENSE
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/pack" > "$RUNNER_TEMP/pack.json"
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const [pack] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/pack.json`, "utf8"));
            const files = pack.files.map((f) => f.path).sort();
            const FORBIDDEN = ["tests/", "node_modules/", ".env"];
            const ALLOWED_FILES = ["README.md", "package.json", "LICENSE"];
            const ALLOWED_DIRS = ["dist/", "src/"];
            const segments = (p) => p.split("/");
            const forbidden = files.filter((p) => FORBIDDEN.some((bad) =>
              bad.endsWith("/") ? segments(p).slice(0, -1).includes(bad.slice(0, -1)) : segments(p).some((s) => s.startsWith(bad))));
            const outside = files.filter((p) => !ALLOWED_FILES.includes(p) && !ALLOWED_DIRS.some((d) => p.startsWith(d)));
            console.log(`${pack.name}@${pack.version}: ${files.length} files, ${pack.size} bytes packed, ${pack.integrity}`);
            for (const f of files) console.log(`  ${f}`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Tarball ${pack.filename}\n\n${files.map((f) => `- ${f}`).join("\n")}\n\n`);
            if (forbidden.length) console.log(`::error::the tarball contains ${forbidden.join(", ")} (tests/, node_modules/ and .env files never ship)`);
            if (outside.length) console.log(`::error::the tarball contains ${outside.join(", ")}, outside dist/, src/, README.md, package.json and LICENSE`);
            if (!/^sha512-/.test(pack.integrity ?? "")) console.log(`::error::npm pack reported no sha512 integrity for ${pack.filename}`);
            if (forbidden.length || outside.length || !/^sha512-/.test(pack.integrity ?? "")) process.exit(1);
            appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${pack.filename}\nintegrity=${pack.integrity}\n`);
          '

      # npm refuses to publish over an existing version, so a second dispatch of the same version skips the
      # npm publish and goes on to the registry: that makes a failed registry step retryable. A version that
      # already exists is trusted only if it is ours, meaning two things. It was published by the npm user
      # mehudak, and it is byte-identical to the tarball this commit packs. The registry's ownership check
      # compares mcpName only, so otherwise anyone who got a package with our mcpName onto npm under this name
      # would be listed as io.github.mehudak/il-tools. The check fails without printing who published it.
      - name: Check - is this version already on npm, and is it ours?
        id: npmview
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          set -euo pipefail
          STATUS=0
          npm view "${NAME}@${VERSION}" --json > "$RUNNER_TEMP/view.json" 2> /dev/null || STATUS=$?
          VIEW_STATUS="$STATUS" node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const { NAME, VERSION, INTEGRITY, VIEW_STATUS, RUNNER_TEMP, GITHUB_OUTPUT } = process.env;
            const text = readFileSync(`${RUNNER_TEMP}/view.json`, "utf8").trim();
            let doc = null;
            try { doc = text ? JSON.parse(text) : null; } catch { doc = null; }
            const fail = (msg) => { console.log(`::error::${msg}`); process.exit(1); };
            const absent = () => {
              console.log(`${NAME}@${VERSION} is not on npm yet.`);
              appendFileSync(GITHUB_OUTPUT, "already=false\n");
              process.exit(0);
            };
            if (VIEW_STATUS !== "0") {
              if (doc?.error?.code === "E404") absent();
              fail(`Could not tell whether ${NAME}@${VERSION} is on npm (npm view: ${doc?.error?.code ?? `exit ${VIEW_STATUS}`}). Nothing was published; dispatch again later.`);
            }
            if (!text) absent();
            const m = Array.isArray(doc) ? doc.at(-1) : doc;
            if (!m || m.version !== VERSION) fail(`npm view ${NAME}@${VERSION} answered something that is not that version. Nothing was published; dispatch again later.`);
            if (m._npmUser?.name !== "mehudak") fail(`${NAME}@${VERSION} is on npm, but it was not published by the npm user mehudak, so it is not ours to list in the MCP Registry. Stop and look at the package on npmjs.com before anything else is published.`);
            if (m.dist?.integrity !== INTEGRITY) fail(`${NAME}@${VERSION} is on npm, but it is not the tarball this commit packs (its integrity differs). Change the version in package.json, in both version fields of server.json and in src/server.ts, then dispatch again.`);
            console.log(`${NAME}@${VERSION} is already on npm, published by mehudak and byte-identical to this tarball: the npm publish is skipped.`);
            appendFileSync(GITHUB_OUTPUT, "already=true\n");
          '

      - name: Hand the tarball to the npm-publish job
        if: ${{ !inputs.dry_run && steps.npmview.outputs.already != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mcp-il-tools-tarball
          path: ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

      - name: Dry run - what a real run would publish to npm
        if: ${{ inputs.dry_run }}
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          ALREADY: ${{ steps.npmview.outputs.already }}
        run: |
          set -euo pipefail
          {
            echo "### Dry run: nothing was published"
            echo ""
            if [ "$ALREADY" = "true" ]; then
              echo "- npm: ${NAME}@${VERSION} is already there, published by mehudak, same bytes; a real run would skip the npm publish."
            else
              echo "- npm: a real run would upload ${NAME}@${VERSION} (the tarball above) as public, without provenance, once the npm-publish environment's reviewer approves it."
            fi
            echo "- Not checked by a dry run: the npm token (owner step 9). It lives in the npm-publish environment, which only a real run enters; the real run checks that it is the npm user mehudak's before it publishes."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------
  # server.json against the live registry, on every run. No id-token.
  # ---------------------------------------------------------------------------------------------------------
  registry-validate:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: products/mcp-il-tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install mcp-publisher (pinned release, sha256-checked)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test "$(uname -s)-$(uname -m)" = "Linux-x86_64" || { echo "::error::this step downloads the linux amd64 build"; exit 1; }
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          ASSET="mcp-publisher_linux_amd64.tar.gz"
          SUMS="registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          curl -fsSL --retry 3 -o "$ASSET" "${BASE}/${ASSET}"
          curl -fsSL --retry 3 -o "$SUMS" "${BASE}/${SUMS}"
          echo "${MCP_PUBLISHER_SHA256}  ${ASSET}" | sha256sum -c -
          if ! grep -qx "${MCP_PUBLISHER_SHA256}  ${ASSET}" "$SUMS"; then
            echo "::error::${SUMS} from the release does not list ${MCP_PUBLISHER_SHA256} for ${ASSET}."
            exit 1
          fi
          tar -xzf "$ASSET" mcp-publisher
          ./mcp-publisher --version

      # POSTs server.json to the registry's /v0/validate endpoint: schema and semantic checks, nothing stored,
      # no login. It does not check npm ownership; the publish does that, against the mcpName checked above.
      - name: Validate server.json against the live registry (publishes nothing)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" validate

      - name: Dry run - what a real run would publish to the registry
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "- MCP Registry: a real run would log in with this workflow's GitHub OIDC token and publish this server.json:"
            echo ""
            echo '```json'
            cat server.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------
  # The npm publish. Real runs from main only, after approval in the npm-publish environment. The only job
  # that reads NPM_TOKEN; no id-token (see NO PROVENANCE above); no checkout, so no repository or dependency
  # code runs here; every action pinned by commit SHA.
  # ---------------------------------------------------------------------------------------------------------
  npm-publish:
    needs: [check, registry-validate]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions: {}
    env:
      NAME: ${{ needs.check.outputs.name }}
      VERSION: ${{ needs.check.outputs.version }}
      MCP_NAME: ${{ needs.check.outputs.server }}
      TARBALL: ${{ needs.check.outputs.tarball }}
      INTEGRITY: ${{ needs.check.outputs.integrity }}
    steps:
      - name: Guard - the npm-publish environment holds NPM_TOKEN (owner step 9)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN is set in the npm-publish environment."
            exit 0
          fi
          echo "::error::Owner step 9 is not done yet: the environment npm-publish has no secret NPM_TOKEN. Create the npm user mehudak and a granular access token of that user (Read and write (publish and stage), All Packages, Bypass two-factor authentication ticked), and store it as the secret NPM_TOKEN of the environment npm-publish, limited to the main branch with a required reviewer (products/mcp-il-tools/MAINTAINING.md); then dispatch again."
          exit 1

      # npm reads the token from NODE_AUTH_TOKEN, which only the whoami and publish steps set. No setup-node
      # here: the runner's own npm can check a token and upload a finished tarball, and one action fewer runs
      # in the job that holds the token.
      - name: Point npm at the registry, reading the token from NODE_AUTH_TOKEN
        run: |
          set -euo pipefail
          printf '%s\n' 'registry=https://registry.npmjs.org/' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$HOME/.npmrc"
          echo "npm $(npm --version)"

      # npm writes the publishing user's name and email into every version's public metadata (_npmUser,
      # maintainers), for good. A token of any other account would put that account there. The answer is
      # compared, never printed: if it is a personal account, this log is public.
      - name: Check - NPM_TOKEN is the npm user mehudak's (owner step 9)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(npm whoami 2>/dev/null || true)" = "mehudak" ]; then
            echo "NPM_TOKEN authenticates as the npm user mehudak."
            exit 0
          fi
          echo "::error::NPM_TOKEN does not authenticate as the npm user mehudak: it belongs to another account, or it has expired or been revoked. npm prints the publishing user's name and email on the package for good, so only a token of the user mehudak may publish. Create one as owner step 9 describes (products/mcp-il-tools/MAINTAINING.md) and replace the secret in the environment npm-publish."
          exit 1

      - name: Fetch the tarball the check job packed
        if: ${{ needs.check.outputs.already != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0, what v4 pointed at on 28.9.2026
        with:
          name: mcp-il-tools-tarball
          path: ${{ runner.temp }}/tarball

      - name: Publish to npm (public, without provenance or lifecycle scripts)
        if: ${{ needs.check.outputs.already != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/tarball/$TARBALL"
          GOT="sha512-$(openssl dgst -sha512 -binary "$FILE" | base64 -w0)"
          if [ "$GOT" != "$INTEGRITY" ]; then
            echo "::error::The tarball this job received is not the one the check job packed and checked (sha512 differs). Nothing was published."
            exit 1
          fi
          npm publish "$FILE" --access public --ignore-scripts
          echo "- npm: published ${NAME}@${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      # The registry's ownership check fetches exactly this URL: registryBaseUrl + "/" +
      # url.PathEscape(identifier) + "/" + url.PathEscape(version), and Go's PathEscape turns only the scope's
      # "/" into %2F (modelcontextprotocol/registry, internal/validators/registries/npm.go,
      # validateNPMPackage). It reads mcpName from the answer. A version published seconds ago may not be
      # served there yet, so wait for that URL itself rather than fail the listing.
      - name: Wait until npm serves this version with its mcpName, at the URL the registry reads
        run: |
          set -euo pipefail
          URL="https://registry.npmjs.org/${NAME//\//%2F}/${VERSION}"
          for attempt in $(seq 1 30); do
            GOT=$(curl -fsS --max-time 20 -H 'Accept: application/json' "$URL" 2>/dev/null | jq -r '.mcpName // empty' 2>/dev/null || true)
            if [ "$GOT" = "$MCP_NAME" ]; then
              echo "${URL} serves mcpName ${GOT}."
              exit 0
            fi
            sleep 10
          done
          echo "::error::${URL} does not serve mcpName ${MCP_NAME} after 5 minutes. Dispatch again later: a version already on npm is not published again."
          exit 1

  # ---------------------------------------------------------------------------------------------------------
  # The MCP Registry listing. Real runs from main only, after the approved npm job. The only job with
  # id-token: write. Any step in this job could mint a GitHub OIDC token, which the registry exchanges for
  # publish rights on io.github.<repository_owner>/*; so it runs a checkout pinned by SHA, the pinned
  # mcp-publisher, and nothing else. No setup-node: nothing here runs Node.
  # ---------------------------------------------------------------------------------------------------------
  registry-publish:
    needs: [npm-publish, registry-validate]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: products/mcp-il-tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, what v4 pointed at on 28.9.2026
        with:
          persist-credentials: false

      - name: Install mcp-publisher (pinned release, sha256-checked)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test "$(uname -s)-$(uname -m)" = "Linux-x86_64" || { echo "::error::this step downloads the linux amd64 build"; exit 1; }
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          ASSET="mcp-publisher_linux_amd64.tar.gz"
          SUMS="registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          curl -fsSL --retry 3 -o "$ASSET" "${BASE}/${ASSET}"
          curl -fsSL --retry 3 -o "$SUMS" "${BASE}/${SUMS}"
          echo "${MCP_PUBLISHER_SHA256}  ${ASSET}" | sha256sum -c -
          if ! grep -qx "${MCP_PUBLISHER_SHA256}  ${ASSET}" "$SUMS"; then
            echo "::error::${SUMS} from the release does not list ${MCP_PUBLISHER_SHA256} for ${ASSET}."
            exit 1
          fi
          tar -xzf "$ASSET" mcp-publisher
          ./mcp-publisher --version

      - name: Log in to the MCP Registry with this workflow's GitHub OIDC token
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login github-oidc

      - name: Publish io.github.mehudak/il-tools to the MCP Registry
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" publish
          echo "- MCP Registry: published $(jq -r .name server.json) $(jq -r .version server.json)" >> "$GITHUB_STEP_SUMMARY"
