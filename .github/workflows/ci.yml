name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # The two steps below treat a timeout (exit 124) as success, and on 2026-09-07 both ran
      # to exactly their limit on every commit — a failing test in src/__tests__/revenue passed
      # CI that way. The revenue colony suite takes ~6 s, so it runs here on its own, with its
      # real exit code. Nothing about money, the ledger, the portfolio or the fold-in rule may
      # go green by timing out.
      - name: Run revenue colony tests (real exit code)
        timeout-minutes: 5
        run: npx vitest run src/__tests__/revenue
      - name: Run tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 300 pnpm test
          RC=$?
          set -e
          # Exit code 124 means timeout killed the process (vitest hung after tests completed)
          if [ $RC -eq 124 ]; then echo "::warning::vitest process hung after tests, killed by timeout"; exit 0; fi
          exit $RC
      - name: Run security tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 180 pnpm test -- --grep "security|injection|policy|financial"
          RC=$?
          set -e
          if [ $RC -eq 124 ]; then echo "::warning::vitest process hung after tests, killed by timeout"; exit 0; fi
          exit $RC

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high || true
