    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;MkN6WCT4hebINiyD/ioLl2Op7KgeCuTSHAM9ESeXEa8=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;QEjL-ZRJAxL9ZJaDO05VZw04UQEluED3IyEor-dPMnPtklrOlJlL69rm99dmz6RoDP_l0wLfaO9lzpUkrd09Zg&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Get to know your Gumroad receipt - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Get to know your Gumroad receipt&quot;,&quot;slug&quot;:&quot;204-get-to-know-your-gumroad-receipt&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003e\u003cspan\u003eIn this article:\u003c/span\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Access-your-purchased-content-iWEPo\&quot; target=\&quot;_self\&quot;\u003eAccess your purchase content\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Generate-an-invoice-TSJNg\&quot; target=\&quot;_self\&quot;\u003eGenerate an invoice\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Unsubscribe-from-emails-Hqq3f\&quot; target=\&quot;_self\&quot;\u003eUnsubscribe from emails\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Cancel-memberships-ZWaRM\&quot; target=\&quot;_self\&quot;\u003eCancel memberships\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Contact-the-creator-vTVO9\&quot; target=\&quot;_self\&quot;\u003eContact the creator\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;Access-your-purchased-content-iWEPo\&quot;\u003eAccess your purchased content\u003c/h3\u003e\n  \u003cp\u003eAfter checkout, you will receive your receipt with a link that takes you to your purchased content. Simply click “View Content” and enter your purchase email when prompted to access your purchase.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://lh7-us.googleusercontent.com/FHb86lW9MQbbGuZgOKzmkPZxVBDVLcx0gg19VUotuOfD8PIYXDuvE4-KcEyolt7DCPcvoi6PHGaXGxD0sVWB96RxzC7fnu4df5eDqdZEu-BRzw0gXkpcooQvKdvQaOdGWHPP23JQidJZqfdrRxW3H_4\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3 id=\&quot;Generate-an-invoice-TSJNg\&quot;\u003eGenerate an invoice\u003c/h3\u003e\n  \u003cp\u003eYou can \u003ca href=\&quot;194-i-need-an-invoice\&quot;\u003eprint your own invoice\u003c/a\u003e by clicking the Generate link at the bottom of your receipt. If you need to customize your invoice, you can use the &#39;Additional Notes&#39; field to add any relevant information. We are not able to customize invoices beyond that for you. \u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/65f8b3d254e485464f3dce9a/file-PEyzfH7eK6.png\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3 id=\&quot;Unsubscribe-from-emails-Hqq3f\&quot;\u003eUnsubscribe from emails\u003c/h3\u003e\n  \u003cp\u003eIf you no longer would like to receive email updates from a seller, you can unsubscribe from future emails by clicking “Unsubscribe” at the bottom of your receipt. That also stops the \u003ca href=\&quot;344-rate-and-review-your-purchase\&quot;\u003ereview reminder\u003c/a\u003e we would otherwise send for that purchase.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/65f8b3af909e484dba21070d/file-qx9PGuwNcF.png\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3 id=\&quot;Cancel-memberships-ZWaRM\&quot;\u003eCancel memberships\u003c/h3\u003e\n  \u003cp\u003eYou can cancel a subscription to your latest membership charge by going to the receipt and click \&quot;Subscription settings\&quot; or \&quot;Manage membership\&quot;:\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/65abf141f1393916b8ea1a82/file-ZS8K5JJi6x.png\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3 id=\&quot;Contact-the-creator-vTVO9\&quot;\u003eContact the creator\u003c/h3\u003e\n  \u003cp\u003eIf you have problems with your purchase, you can find the seller&#39;s contact information on your receipt for issues such as refunds or general questions about the product.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://lh7-us.googleusercontent.com/exdm8jeuisUXyAWl2V3WKnVu1hHWBeeVhQRt-0WAXDrPu1bHcMs6mVv-iP-zZ1LvEcStCEyQTBYtk0Poh7An6JMbCg5gXg0nmpKm8vw-r2cj5AtUlteSySm5pyu22HBQwjQ85GXq8_Pesu8AVvF7zOE\&quot; /\u003e\u003c/figure\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;190-how-do-i-get-a-refund\&quot;\u003e\u003cspan\u003eHow do I get a refund?\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;193-my-purchase-isnt-downloading\&quot;\u003e\u003cspan\u003eMy purchase isn&#39;t downloading\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;194-i-need-an-invoice\&quot;\u003e\u003cspan\u003eI need an invoice\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;200-i-need-a-vat-refund\&quot;\u0
