03e\u003cb\u003eThe Scoring\u003c/b\u003e: 12 fat-burning scores plus one overall score per pair.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2 id=\"whats-new-vs-crunch-1-and-2\"\u003eWhat's new vs Crunch 1 and 2\u003c/h2\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eScale\u003c/b\u003e: Crunch 1 tested single genes. Crunch 2 tested ~170 pairs from an 18-gene shortlist. Crunch 3 covers 4.47M pairs across 2,991 genes.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eOutput\u003c/b\u003e: Crunch 1 and 2 wanted detailed cell-by-cell predictions. Crunch 3 wants one ranking score per pair.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eFeedback\u003c/b\u003e: Crunch 1 and 2 had a weekly public leaderboard. Crunch 3 \u003cb\u003ehas no scoring\u003c/b\u003e during the competition. The final leaderboard arrives after the lab experiment.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n3c:T1415,"])</script><script>self.__next_f.push([1,"\n\u003ch2 id=\"the-biology-storing-energy-vs.-burning-energy\"\u003eThe Biology: Storing Energy vs. Burning Energy\u003c/h2\u003e\n\n\u003cp\u003eNot all body fat is created equal. Our bodies primarily rely on two types of fat cells (adipocytes) to manage energy:\u003c/p\u003e\n\n\u003col\u003e\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eWhite Fat\u003c/b\u003e: The \u0026quot;storage\u0026quot; cells. They hold onto excess energy from food. When we store too much, it leads to obesity and metabolic diseases like Type 2 Diabetes.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eBrown Fat\u003c/b\u003e: The \u0026quot;furnace\u0026quot; cells. Instead of storing energy, they burn sugar and fat to generate heat (thermogenesis).\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ol\u003e\n\n\u003cp\u003eMost current obesity drugs work by making people feel less hungry. However, scientists are exploring a different approach: \u003cb\u003eWhat if we could convince the body to produce more brown fat, or trigger white fat to start burning energy?\u003c/b\u003e\u003c/p\u003e\n\n\u003ch2 id=\"the-experiment-flipping-genetic-switches\"\u003eThe Experiment: Flipping Genetic Switches\u003c/h2\u003e\n\n\u003cp\u003eTo find the biological \u0026quot;switches\u0026quot; that control these processes, researchers are conducting massive experiments. They harvest human fat-cell precursors and use CRISPR/Cas9 technology to turn off specific genes, one by one. They then observe:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eDoes the cell still become a fat cell?\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eDoes it act like a white fat cell (storage) or a brown fat cell (burning)?\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eHow does the cell's internal machinery (gene expression) change?\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2 id=\"why-cannot-we-physically-test-every-single-gene-in-the-human-genome\"\u003eWhy cannot we physically test every single gene in the human genome?\u003c/h2\u003e\n\n\u003cp\u003eThere are 20,000 genes in our genomes! It would take too much time and money. We need Machine Learning to fill in the gaps. By training on the existing experimental data, your model will predict the biological outcome of turning off genes that haven't been tested yet.\u003c/p\u003e\n\n\u003ch2 id=\"why-this-matters\"\u003eWhy this Matters?\u003c/h2\u003e\n\n\u003cp\u003eObesity affects over 890 million people worldwide and is a primary driver of cardiovascular disease and cancer. While weight-loss drugs exist, they don't work for everyone and often carry side effects.\u003c/p\u003e\n\n\u003cp\u003eTo develop better therapies, we need to understand the fundamental code of metabolism:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eWhich genes tell fat cells how to develop?\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eWhich genes help turn white fat cells into brown/heat-producing fat cells?\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eWhich genes change how cells store or burn fat?\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eIf your model can successfully simulate how perturbing genes affect fat cells, it will allow researchers to screen thousands of potential drug targets purely computationally. This could dramatically accelerate the discovery of medicines that restore metabolic balance and fight disease.\u003c/p\u003e\n\n\u003ch2 id=\"the-challenge\"\u003eThe Challenge\u003c/h2\u003e\n\n\u003cp\u003eIn this competition, you are working with single-cell RNA sequencing data, which indicates how much each gene is expressed in each single cell. Scientists have \u0026quot;knocked out\u0026quot; (deleted) different genes in fat-cell precursors and measured how the cells changed.\u003c/p\u003e\n\n\u003cp\u003eYour job is to \u003cb\u003ebuild a model that predicts what happens when scientists turn off new genes that appear in the test set\u003c/b\u003e.\u003c/p\u003e\n\n\u003cp\u003eYou must predict two specific outcomes for these unseen gene knockouts:\u003c/p\u003e\n\n\u003ch3 id=\"id-1.-the-internal-state-gene-expression-profiles\"\u003e1. The \u0026quot;Internal State\u0026quot; (Gene Expression Profiles)\u003c/h3\u003e\n\n\u003cp\u003eYou must predict the gene expression profile of single cells after the target gene is knocked out. This is a high-dimensional vector representing the activity levels of thousands of genes within the cell.\u003c/p\u003e\n\n\u003ch3 id=\"id-2.-the-cell-identity-cell-type-differentiation\"\u003e2. The \u0026quot;Cell Identity\u0026quot; (Cell Type differentiation)\u003c/h3\u003e\n\n\u003cp\u003eNormally, these precursor cells differentiate into specific types of fat cells. You must estimate the resulting proportions of four distinct cell states:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003ePre-adipocyte\u003c/b\u003e: Early-stage cells that haven't differentiated yet.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eAdipocyte\u003c/b\u003e: Mature fat cells (the standard white fat).\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eLipogenic\u003c/b\u003e: Specialized fat-producing cells.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eOther\u003c/b\u003e: Cells that followed a different developmental path.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cdiv class=\"hint success\"\u003e\n  \u003cp\u003eExplore the \u003ca href=\"https://docs.crunchdao.com/competitions/competitions/broad-obesity/full-specifications\" target=\"_blank\"\u003efull specifications\u003c/a\u003e for in-depth details.\u003c/p\u003e\n\u003c/div\u003e\n\n\u003ch2 id=\"crash-course\"\u003eCrash Course\u003c/h2\u003e\n\n\u003cp\u003eSimilar to last year, the Eric and Wendy Schmidt Center team \u003ca href=\"https://www.youtube.com/playlist?list=PLlMMtlgw6qNi-WSkY-UiJMvO2TTa0T4Ga\" target=\"_blank\"\u003eprepared an 80-minute lecture series\u003c/a\u003e containing a biology overview needed for this challenge.\u003c/p\u003e\n\n\u003cdiv class=\"youtube\"\u003e\u003ciframe allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" scrolling=\"no\" allowfullscreen=\"\" src=\"https://www.youtube.com/embed/videoseries?list=PLlMMtlgw6qNi-WSkY-UiJMvO2TTa0T4Ga\"\u003e\u003c/iframe\u003e\u003c/div\u003e\n"])</script><script>self.__next_f.push([1,"3d:T7c7,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eIn Crunch 3, you will not have the opportunity to evaluate your model's predictive performance. A final leaderboard will only be published after a lab experiment.\u003c/p\u003e\n\n\u003cp\u003e\u003cb\u003eAll participants may submit up to two times:\u003c/b\u003e\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eFor the first submission window, \u003cb\u003eparticipants from Crunch 2 are especially encouraged\u003c/b\u003e to \u003cb\u003eadapt their existing models and submit\u003c/b\u003e them for Crunch 3 within the first 3 weeks of the competition. \u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eAfter that, \u003cb\u003eall participants, including both Crunch 2 participants and new participants\u003c/b\u003e, will have an \u003cb\u003eadditional 3 weeks to submit or revise\u003c/b\u003e their work before the competition closes.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThis division will enable the EWSC team to conduct a preliminary selection based on the results of Crunch 2.\u003c/p\u003e\n\n\u003ch2 id=\"timeline\"\u003eTimeline\u003c/h2\u003e\n\n\u003cp\u003eThere will be multiple quota refresh, with one occurring every Tuesday at 4:00 p.m. UTC:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eRefresh 1 – May 19th\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eRefresh 2 – May 26th\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eRefresh 3 – June 2nd\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eProposal 1 deadline – June 9th\u003c/b\u003e\u003c/p\u003e\n\n    \u003cul\u003e\n      \u003cli\u003e\n        \u003cp\u003eIf no selection is made, the last proposal is used.\u003c/p\u003e\n      \u003c/li\u003e\n\n      \u003cli\u003e\n        \u003cp\u003eThere will be a one-day downtime.\u003c/p\u003e\n      \u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eRefresh 5 – June 16th\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eRefresh 6 – June 23th\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eRefresh 7 – June 30th\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eProposal 2 deadline – July 3rd\u003c/b\u003e\u003c/p\u003e\n\n    \u003cul\u003e\n      \u003cli\u003e\n        \u003cp\u003eIf no selection is made, the last proposal is used.\u003c/p\u003e\n      \u003c/li\u003e\n\n      \u003cli\u003e\n        \u003cp\u003eIf the same as Proposal 1, it is ignored.\u003c/p\u003e\n      \u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003ePeer review begins – July 4th\u003c/p\u003e\n\n    \u003cul\u003e\n      \u003cli\u003e\n        \u003cp\u003eMore information will be provided later.\u003c/p\u003e\n      \u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003ePeer review ends – July 10th\u003c/b\u003e\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n"])</script><script>self.__next_f.push([1,"3e:T560,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eParticipants must predict the effect of two-gene perturbations on thermogenesis-related gene expression in adipocyte cells.\u003c/p\u003e\n\n\u003cp\u003eThe search space covers all possible pairs drawn from 2,991 genes (those with \u0026gt;5 transcripts per million, plus transcription factors and marker genes), yielding ~4.47 million gene pairs (excluding pairs already tested in Crunch 2).\u003c/p\u003e\n\n\u003cp\u003eParticipants can build on work from Crunches 1 and 2, but it's not required. \u003cb\u003eNewcomers are also welcome\u003c/b\u003e and may use any approach they choose, including modeling, biological knowledge, public resources, or other strategies.\u003c/p\u003e\n\n\u003ch2 id=\"objective\"\u003eObjective\u003c/h2\u003e\n\n\u003cp\u003eThe objective in Crunch 3 is to predict the mean z-scored enrichment score for each of the 12 thermogenic gene sets per perturbation, and then to derive the final score by averaging the top 3 scores per perturbation to rank perturbations from highest to lowest.\u003c/p\u003e\n\n\u003cp\u003eTherefore, for each perturbation, participants should predict 13 scores (12 gene-set-level scores and 1 final aggregated score).\u003c/p\u003e\n\n\u003cdiv\u003e\n  \u003cfigure\u003e    \u003cimg src=\"https://3895192033-files.gitbook.io/~/files/v0/b/gitbook-x-prod.appspot.com/o/spaces%2FrZv71uKEauXe2J8CJm1h%2Fuploads%2FArr4TOYv4ji2JXpPqKLQ%2Fimage.png?alt=media\u0026token=cd6aaca1-3ebe-40b1-869e-a1f92a435075\" /\u003e    \u003cfigcaption\u003e\n    \u003cp\u003eOverall Workflow\u003c/p\u003e\n    \u003c/figcaption\u003e  \u003c/figure\u003e\n\u003c/div\u003e\n"])</script><script>self.__next_f.push([1,"3f:Tf8b,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eFor the training datasets released in Crunches 1 (\u003ccode class=\"inline\"\u003eTF150\u003c/code\u003e) and 2 (\u003ccode class=\"inline\"\u003eTF15_MOI2\u003c/code\u003e), we will provide the raw and z-scored signature scores for each adipocyte cell in \u003cspan class=\"tooltip\"\u003e\u003cspan class=\"tooltip-trigger\"\u003e\u003ccode class=\"inline\"\u003e{...}_ThermoScores_cell.csv\u003c/code\u003e files\u003c/span\u003e\u003cspan class=\"tooltip-content\"\u003e\n\u003cspan\u003e\u003ccode class=\"inline\"\u003eTF150_ThermoScores_cell.csv\u003c/code\u003e and \u003ccode class=\"inline\"\u003eTF15_MOI2_ThermoScores_cell.csv\u003c/code\u003e\u003c/span\u003e\n\u003c/span\u003e\u003c/span\u003e:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eEach row is a cell, identified by \u003ccode class=\"inline\"\u003ecell_id\u003c/code\u003e and its assigned perturbation (under column \u003ccode class=\"inline\"\u003egene\u003c/code\u003e). \u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eThe raw enrichment score for each of the 12 signatures appears as a \u003cspan class=\"tooltip\"\u003e\u003cspan class=\"tooltip-trigger\"\u003enamed columns\u003c/span\u003e\u003cspan class=\"tooltip-content\"\u003e\n\u003cspan\u003ee.g. \u003ccode class=\"inline\"\u003eC2.WP_THERMOGENESIS\u003c/code\u003e\u003c/span\u003e\n\u003c/span\u003e\u003c/span\u003e, and the corresponding z-score computed across all adipocyte cells is provided in the \u003cspan class=\"tooltip\"\u003e\u003cspan class=\"tooltip-trigger\"\u003e\u003ccode class=\"inline\"\u003ez_\u003c/code\u003e-prefixed columns\u003c/span\u003e\u003cspan class=\"tooltip-content\"\u003e\n\u003cspan\u003ee.g. \u003ccode class=\"inline\"\u003ez_C2.WP_THERMOGENESIS\u003c/code\u003e\u003c/span\u003e\n\u003c/span\u003e\u003c/span\u003e.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThe perturbation-level score for each perturbation is provided in \u003cspan class=\"tooltip\"\u003e\u003cspan class=\"tooltip-trigger\"\u003e\u003ccode class=\"inline\"\u003e{...}_ThermoScores_perturbation.csv\u003c/code\u003e files\u003c/span\u003e\u003cspan class=\"tooltip-content\"\u003e\n\u003cspan\u003e\u003ccode class=\"inline\"\u003eTF150_ThermoScores_perturbation.csv\u003c/code\u003e and \u003ccode class=\"inline\"\u003eTF15_MOI2_ThermoScores_perturbation.csv\u003c/code\u003e\u003c/span\u003e\n\u003c/span\u003e\u003c/span\u003e:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eEach row is a perturbation. \u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eThe signature columns (named according to the signature gene sets, 12 in total) contain the mean z-score across all cells belonging to that perturbation. \u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eThe column \u003ccode class=\"inline\"\u003eagg_top3_z\u003c/code\u003e is the final aggregated score (the mean of the top 3 signature z-scores) used to rank perturbations.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThe datasets come from two separate experiments and were processed separately. Therefore, the absolute expression values may differ across the two datasets, even though they are z-normalized. When combining them, participants are free to decide how to combine or adjust them if needed.\u003c/p\u003e\n\n\u003cp\u003eThe datasets includes cells with more than two perturbations, but the new experiment mainly focuses on double perturbations. \u003cb\u003eWhen computing the threshold to beat using the existing data, we require more than 16 adipocyte cells for a perturbation to receive a valid score.\u003c/b\u003e\u003c/p\u003e\n\n\u003cp\u003eThe signature gene sets used to define the score can be found in \u003ccode class=\"inline\"\u003ethermogenic_signatures.csv\u003c/code\u003e. The notebook showing how the scoring procedure was derived and computed is \u003ca href=\"https://julielaffy.github.io/obesity-broad-ml-competition-2025/program_analysis_py.html#Part-4:-Thermogenic-Scoring\" target=\"_blank\"\u003eavailable here\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch2 id=\"crunch-1-and-2-training-data\"\u003eCrunch 1 \u0026 2 Training Data\u003c/h2\u003e\n\n\u003cp\u003eThe Crunch 1 and Crunch 2 training datasets are available via the \u003ccode class=\"inline\"\u003eTF150.h5ad\u003c/code\u003e and \u003ccode class=\"inline\"\u003eTF15_MOI2.h5ad\u003c/code\u003e files, respectively. These are the same files provided in previous parts, just renamed for consistency with the thermo score files.\u003c/p\u003e\n\n\u003cp\u003eSince the files are large, a smaller version of the data is available to make it easier and faster to get and load the data. In the cloud environment, only the \u0026quot;default\u0026quot; one will be available.\u003c/p\u003e\n\n\u003cp\u003eYou can find out more about the content of the training data for \u003ca href=\"https://docs.crunchdao.com/competitions/competitions/broad-obesity/crunch-1#dataset\" target=\"_blank\"\u003eCrunch 1 here\u003c/a\u003e and for \u003ca href=\"https://docs.crunchdao.com/competitions/competitions/broad-obesity/crunch-2#dataset\" target=\"_blank\"\u003eCrunch 2 here\u003c/a\u003e.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"40:T1392,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eYour submission should include the following:\u003c/p\u003e\n\n\u003ch2 id=\"file-prediction.parquet\"\u003eFile: \u003ccode class=\"inline\"\u003eprediction.parquet\u003c/code\u003e\u003c/h2\u003e\n\n\u003cp\u003eA \u003ca href=\"https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.to_parquet.html\" target=\"_blank\"\u003ePARQUET\u003c/a\u003e file containing all candidate gene pairs, with one row per gene pair and at least the following columns:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eGenePairID\u003c/code\u003e: \u003cb\u003eGene pair ID\u003c/b\u003e, in the format \u003ccode class=\"inline\"\u003eGeneA+GeneB\u003c/code\u003e or \u003ccode class=\"inline\"\u003eGeneA+GeneA\u003c/code\u003e.\u003cbr /\u003eThe IDs should match the pairs in \u003ccode class=\"inline\"\u003epredict_perturbations_3.parquet\u003c/code\u003e file.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003enonucp1.all\u003c/code\u003e,\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eREACTOME_AMPK_inhibits_chREBP_R-HSA-163680\u003c/code\u003e,\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eREACTOME_Integration_of_energy_metabolism_R-HSA-163685\u003c/code\u003e,\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eREACTOME_Mitochondrial_biogenesis_R-HSA-1592230\u003c/code\u003e,\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eemont.hAd6\u003c/code\u003e,\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003elit.thermogenic\u003c/code\u003e,\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eC2.WP_THERMOGENESIS\u003c/code\u003e,\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eC5.GOBP_ADAPTIVE_THERMOGENESIS\u003c/code\u003e,\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eC5.GOBP_BROWN_FAT_CELL_DIFFERENTIATION\u003c/code\u003e,\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eC5.GOBP_NEGATIVE_REGULATION_OF_COLD_INDUCED_THERMOGENESIS\u003c/code\u003e,\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eC5.GOBP_POSITIVE_REGULATION_OF_COLD_INDUCED_THERMOGENESIS\u003c/code\u003e,\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eand \u003ccode class=\"inline\"\u003eyi.Thermogenesis_Village\u003c/code\u003e: \u003cb\u003ePredicted scores for each of the 12 thermogenic signatures\u003c/b\u003e, with one column per signature.\u003cbr /\u003eColumn names should match the signature names in the \u003ccode class=\"inline\"\u003ethermogenic_signatures.csv\u003c/code\u003e file.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eFinalAggScore\u003c/code\u003e: \u003cb\u003ePredicted final aggregated score for the gene pair\u003c/b\u003e, defined as the mean of the top-3 predicted signature scores among the 12 signatures.\r\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eRank\u003c/code\u003e: \u003cb\u003ePredicted rank\u003c/b\u003e of the gene pair based on the final aggregated score.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThis file should thus have 4,474,413 rows and \u003cspan class=\"tooltip\"\u003e\u003cspan class=\"tooltip-trigger\"\u003e15 columns\u003c/span\u003e\u003cspan class=\"tooltip-content\"\u003e\n\u003cspan\u003eUse \u003ccode class=\"inline\"\u003e.to_parquet(index=False)\u003c/code\u003e when saving the file.\u003c/span\u003e\n\u003c/span\u003e\u003c/span\u003e.\u003c/p\u003e\n\n\u003ch2 id=\"file-report.md\"\u003eFile: \u003ccode class=\"inline\"\u003eReport.md\u003c/code\u003e\u003c/h2\u003e\n\n\u003cp\u003eWe ask you to please write a small document that should include sufficient details outlining the approaches used by your algorithm to compute the scores.\u003c/p\u003e\n\n\u003cp\u003eThe document should be organized into three sections, represented as titles in a Markdown file:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eMethod description\u003c/b\u003e: Describe the algorithm used to generate the predicted scores. \u003ci\u003e(5-10 sentences)\u003c/i\u003e\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eDesign rationale\u003c/b\u003e: Explain the rationale behind the proposed gene panel design. \u003ci\u003e(5-10 sentences)\u003c/i\u003e\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eData and Resources\u003c/b\u003e: Describe the datasets, prior knowledge, and any additional resources used. \u003ci\u003e(5-10 sentences)\u003c/i\u003e\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eA reference list may be included.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e\u003cb\u003eNotes:\u003c/b\u003e\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eA human will validate the content at the end of the competition.\u003cbr /\u003eWork deemed unsatisfactory may be disqualified.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eThis file must be \u003cb\u003eprovided during submission\u003c/b\u003e.\u003cbr /\u003eIf content needs to be changed, you \u003cb\u003emust re-submit with the new version\u003c/b\u003e.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eThe name must be \u003ccode class=\"inline\"\u003eReport.md\u003c/code\u003e; case does not matter. \u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eOnly non-empty and non-comment lines are considered.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eBelow is an example of how to format the file:\u003c/p\u003e\n\n\u003ccode class=\"block\"\u003e\n  \u003cpre\u003e# Method Description\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e\u0026lt;!-- Describe the algorithm used to generate the predicted scores. (5-10 sentences) --\u0026gt;\u003c/pre\u003e\n\n  \u003cpre\u003eLorem ipsum dolor sit amet, consectetur adipiscing elit.\u003c/pre\u003e\n\n  \u003cpre\u003eAliquam eget augue quis metus viverra vehicula sit amet lacinia odio.\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e# Design rationale\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e\u0026lt;!-- Explain the rationale behind the proposed gene panel design. (5-10 sentences) --\u0026gt;\u003c/pre\u003e\n\n  \u003cpre\u003ePraesent dignissim ipsum vel leo eleifend, eget pulvinar mauris ornare.\u003c/pre\u003e\n\n  \u003cpre\u003eDuis efficitur lectus posuere iaculis dictum.\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e# Data and Resources\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e\u0026lt;!-- Describe the datasets, prior knowledge, and any additional resources used. (5-10 sentences) --\u0026gt;\u003c/pre\u003e\n\n  \u003cpre\u003eDonec feugiat eros vel odio gravida venenatis.\u003c/pre\u003e\n\n  \u003cpre\u003eNam et sem sit amet nisi vestibulum semper bibendum et libero.\u003c/pre\u003e\n\u003c/code\u003e\n"])</script><script>self.__next_f.push([1,"41:T6d9,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eFor this part, there will be no direct feedback that participants can use to judge their ranking against others', as scores will only be known after experimental validation is complete.\u003c/p\u003e\n\n\u003cp\u003eThe leaderboard will only show users (or teams) who submitted an algorithm that can generate a valid prediction.\u003c/p\u003e\n\n\u003cp\u003eThe scoring, and thus the prize, is divided into two parts:\u003c/p\u003e\n\n\u003ch2 id=\"evaluation-1-peer-review\"\u003eEvaluation 1 – Peer-review\u003c/h2\u003e\n\n\u003cp\u003eEvaluation 1 will award \u003cb\u003e10% of the prize pool\u003c/b\u003e and is focus on the submitted algorithms and rationales used to select gene pairs for experimental testing.\u003c/p\u003e\n\n\u003cp\u003eThese submissions will be assessed through a \u003ca href=\"#peer-review\"\u003epeer review\u003c/a\u003e process, and winners for this evaluation will be announced at the \u003cb\u003eend of Summer 2026\u003c/b\u003e.\u003c/p\u003e\n\n\u003cdiv class=\"hint info\"\u003e\n  \u003cp\u003eA proposal will only be considered if its author has also peer-reviewed other proposals.\u003c/p\u003e\n\u003c/div\u003e\n\n\u003ch2 id=\"evaluation-2-wet-lab-experiment\"\u003eEvaluation 2 – Wet lab experiment\u003c/h2\u003e\n\n\u003cp\u003eEvaluation 2 will award \u003cb\u003e90% of the prize pool\u003c/b\u003e and will assess algorithmic performance after new laboratory experiments have been completed.\u003c/p\u003e\n\n\u003cp\u003eSpecifically, all submitted algorithms will be evaluated based on how accurately they predict the effects of combinatorial perturbations using the newly generated experimental data. Winners based on this evaluation will be announced in \u003cb\u003eFall 2026 after the new laboratory experiments have been performed\u003c/b\u003e.\u003c/p\u003e\n\n\u003cdiv class=\"hint info\"\u003e\n  \u003cp\u003ePrizes will only be awarded to the top 10 teams whose proposed gene pairs achieve experimentally validated scores that exceed the maximum perturbation score observed in the training data released from Crunches 1 and 2.\u003c/p\u003e\n\u003c/div\u003e\n"])</script><script>self.__next_f.push([1,"42:T4b0,\n\u003cp\u003eThe peer review component is a mandatory part of the competition. In order to qualify for prizes, you must review 3-4 submissions from other participants.\u003c/p\u003e\n\n\u003cp\u003eThe peer review process is crutial for selecting the most promising gene panels for \u003ca href=\"#experimental-validation\"\u003eexperimental validation\u003c/a\u003e. Your evaluations help identify submissions with strong justifications and innovative approaches.\u003c/p\u003e\n\n\u003cp\u003eFor each assigned submission, reviewers should:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eAssign an overall rating on a 1-3 scale:\u003c/p\u003e\n\n    \u003cul\u003e\n      \u003cli\u003e\n        \u003cp\u003e\u003ccode class=\"inline\"\u003e1\u003c/code\u003e – poor proposal / justification\u003c/p\u003e\n      \u003c/li\u003e\n\n      \u003cli\u003e\n        \u003cp\u003e\u003ccode class=\"inline\"\u003e2\u003c/code\u003e – adequate proposal / justification\u003c/p\u003e\n      \u003c/li\u003e\n\n      \u003cli\u003e\n        \u003cp\u003e\u003ccode class=\"inline\"\u003e3\u003c/code\u003e – excellent proposal and justification\u003c/p\u003e\n      \u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eProvide a short written evaluation of 200-400 words covering:\u003c/p\u003e\n\n    \u003cul\u003e\n      \u003cli\u003e\n        \u003cp\u003eRationale of the design.\u003c/p\u003e\n      \u003c/li\u003e\n\n      \u003cli\u003e\n        \u003cp\u003eNovelty of the design.\u003c/p\u003e\n      \u003c/li\u003e\n\n      \u003cli\u003e\n        \u003cp\u003eCompliance with the required format.\u003c/p\u003e\n      \u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n43:T67f,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eTo validate the most promising gene panels, \u003cb\u003ewe will select a total of 150 unique gene pairs for experimental evaluation\u003c/b\u003e. This selection will occur via two routes:\u003c/p\u003e\n\n\u003ch2 id=\"route-1-nominations-from-crunch-2-winners\"\u003eRoute 1: nominations from Crunch 2 winners\u003c/h2\u003e\n\n\u003cp\u003eA total of ~110 unique gene pairs will be selected from top-performing teams in \u003cb\u003eCrunch 2 that also participate in Crunch 3\u003c/b\u003e.\r\u003c/p\u003e\n\n\u003cp\u003eSelection will proceed as follows:\r\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eThe 30 top-performing teams from Crunch 2 (top 10 teams for each of 3 evaluation metrics) will be considered.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eFor each team, the top 4-6 gene pairs from that team’s first Crunch #3 submission will be used.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThis process yields up to 180 nominations, which will be consolidated to ~110 unique gene pairs after accounting for overlap across evaluation metrics and teams.\u003c/p\u003e\n\n\u003ch2 id=\"route-2-nominations-from-crunch-3-winners\"\u003eRoute 2: nominations from Crunch 3 winners\u003c/h2\u003e\n\n\u003cp\u003eA total of ~40 unique gene pairs will be selected from top-performing Crunch 3 submissions based on the \u003ca href=\"#peer-review\"\u003epeer review\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eSelection will proceed as follows:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eThe top 10 teams will be identified based on peer-review rankings.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eFor each selected team, the top 4-6 gene pairs will be taken from the winning proposals.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThis process yields up to 60 nominations, which will be consolidated to ~40 unique gene pairs after accounting for overlap.\u003c/p\u003e\n\n\u003cp\u003eTogether, these two routes define the full experimental validation set of 150 gene-pair combinations.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"44:T47a,\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eI missed the other crunches, can I participate to this one?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003eYes.\u003c/p\u003e\n\n  \u003cp\u003eAll crunches are unique. You don't need to have participated in the first or second one to participate in the last one.\u003c/p\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eI participated to Crunch 2, can my model be adapted?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003eYes.\u003c/p\u003e\n\n  \u003cp\u003eIn Crunch 2, you had to predict the perturbation of gene pairs. In Crunch 3, you must do the same and then rank them.\u003c/p\u003e\n\n  \u003cp\u003eUpdating your one-page report is also very crutial so the EWSC team can understand your reasoning.\u003c/p\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eWhy must external resources be published or in the public domain?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003eWhile releasing the full model is encouraged, it is not strictly required if the weights are sufficient for reproducibility.\u003c/p\u003e\n\n  \u003cp\u003eWhen constraints limit what can be released, we ask that the methods and training procedures be clearly documented. These cases can be reviewed individually to ensure transparency and fairness.\u003c/p\u003e\n\u003c/details\u003e\n\n45:T1e61,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eBelow are a few references meant to provide more background and some of the approaches researchers are applying in the fields relevant to these Crunches. This is not meant to be an exhaustive list and many important works are not listed here.\u003c/p\u003e\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eSingle cell transcriptomic adipocytes datasets\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cul\u003e\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.nature.com/articles/s41588-025-02343-7\" target=\"_blank\"\u003eDissecting the impact of transcription factor dose on cell reprogramming heterogeneity using scTF-seq\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.nature.com/articles/s41586-022-04518-2\" target=\"_blank\"\u003eA single-cell atlas of human and mouse white adipose tissue\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.nature.com/articles/s41588-024-02048-3\" target=\"_blank\"\u003eHuman subcutaneous and visceral adipocyte atlases uncover classical and nonclassical adipocytes and depot-specific patterns\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.nature.com/articles/s41586-024-08165-7\" target=\"_blank\"\u003eAdipose tissue retains an epigenetic memory of obesity after weight loss.\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.cell.com/cell-metabolism/fulltext/S1550-4131(24)00452-2?_returnURL=https%3A%2F%2Flinkinghub.elsevier.com%2Fretrieve%2Fpii%2FS1550413124004522%3Fshowall%3Dtrue\" target=\"_blank\"\u003eUnveiling adipose populations linked to metabolic health in obesity\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.cell.com/cell-metabolism/fulltext/S1550-4131(21)00363-6?_returnURL=https%3A%2F%2Flinkinghub.elsevier.com%2Fretrieve%2Fpii%2FS1550413121003636%3Fshowall%3Dtrue\" target=\"_blank\"\u003eSpatial mapping reveals human adipocyte subpopulations with distinct sensitivities to insulin\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.nature.com/articles/s41586-020-2856-x\" target=\"_blank\"\u003esnRNA-seq reveals a subpopulation of adipocytes that regulates thermogenesis\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.nature.com/articles/s42255-023-00813-y\" target=\"_blank\"\u003eWnt signaling preserves progenitor cell multipotency during adipose tissue development\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.nature.com/articles/s42255-023-00820-z\" target=\"_blank\"\u003eAdipogenic and SWAT cells separate from a common progenitor in human brown and white adipose depots\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.biorxiv.org/content/10.1101/2025.09.14.673351v1\" target=\"_blank\"\u003eSingle-Nucleus Analysis of Human White Adipose Tissue Reveals Adipocyte Subsets with Distinct Metabolic Profiles\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S2212877823000807?via%3Dihub\" target=\"_blank\"\u003eMapping the transcriptional landscape of human white and brown adipogenesis using single-nuclei RNA-seq\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eCRISPR/Cas9 genetic perturbation screens\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cul\u003e\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S0092867422005979?via%3Dihub\" target=\"_blank\"\u003eMapping information-rich genotype-phenotype landscapes with genome-scale Perturb-seq\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.science.org/doi/10.1126/science.aax4438\" target=\"_blank\"\u003eExploring genetic interaction manifolds constructed from rich single-cell phenotypes\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.biorxiv.org/content/10.1101/2025.06.11.659105v1.full.pdf\" target=\"_blank\"\u003eX-Atlas/Orion: Genome-wide Perturb-seq Datasets via a Scalable Fix-Cryopreserve Platform for Training Dose-Dependent Biological Foundation Models\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eModeling perturbations and causality\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cul\u003e\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S2405471221002027\" target=\"_blank\"\u003eMachine learning for perturbational single-cell omics\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://library.oapen.org/handle/20.500.12657/26040\" target=\"_blank\"\u003eElements of Causal Inference: Foundations and Learning Algorithms\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://arxiv.org/abs/2511.04790\" target=\"_blank\"\u003eCausal Structure and Representation Learning with Biomedical Applications\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/38279009/\" target=\"_blank\"\u003escPerturb: Information Resource for Harmonized Single-Cell Perturbation Data\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://arxiv.org/abs/2110.11875\" target=\"_blank\"\u003eGeneDisco: A Benchmark for Experimental Design in Drug Discovery\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.nature.com/articles/s41587-025-02777-8\" target=\  href=\"https://www.nature.com/articles/s41587-023-01905-6\" target=\"_blank\"\u003eGEARS: Predicting transcriptional outcomes of novel multi-gene perturbations\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://arxiv.org/abs/2211.03553\" target=\"_blank\"\u003eLearning Causal Representations of Single Cells via Sparse Mechanism Shift Modeling\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/37154091/\" target=\"_blank\"\u003ePredicting cellular responses to complex perturbations in high-throughput screens\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://pubmed.ncbi.nlm.nih.gov/40640612/\" target=\"_blank\"\u003ePerturbNet predicts single-cell responses to unseen chemical and genetic perturbations\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://arxiv.org/abs/2204.13545\" target=\"_blank\"\u003ePredicting Cellular Responses to Novel Drug Perturbations at a Single-Cell Resolution\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.nature.com/articles/s42256-023-00719-0\" target=\"_blank\"\u003eActive Learning for Optimal Intervention Design in Causal Models\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003e\u003ca href=\"https://www.nature.com/articles/s41586-022-05194-y\" target=\"_blank\"\u003eControl of cell state transitions\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/details\u003e\n\n\n\u003cdiv class=\"hint info\"\u003e\n  \u003cp\u003eReading these articles is not necessary to complete the challenge, but we believe these can be a helpful resource.\u003c/p\u003e\n\u003c/div\u003e\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"$L3a\",null,{
