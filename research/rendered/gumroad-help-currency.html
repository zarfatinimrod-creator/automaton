    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;g9MKPSTtjmzWC1ZzC/ZjoBN5timiN3HjtvyJhK3IsVE=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;l6HyOsNP2pbuehwzs9B4zLpECIZcWG4JD0ub0asxK6rIC09kfXJ3ngQX_KvGjfjc5jV6ydZz2-y_AFI8mRcQVA&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;What currency does Gumroad use? - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;What currency does Gumroad use?&quot;,&quot;slug&quot;:&quot;46-what-currency-does-gumroad-use&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003e\u003cstrong\u003e\u003cem\u003eGumroad processes transactions in United States Dollars, or in the customer&#39;s local currency where supported\u003c/em\u003e\u003c/strong\u003e. \u003c/p\u003e\n  \u003cp\u003eYou have the flexibility to display your products in the currency of your choosing (see below). During checkout, eligible one-time card purchases are charged in the local currency shown at checkout, so the amount on the customer&#39;s statement matches the amount they confirmed. All other transactions are processed in USD, with real-time exchange rates used when conversion is needed.\u003c/p\u003e\n  \u003ch3 id=\&quot;local-currency-checkout\&quot;\u003eWhich currencies can customers pay in?\u003c/h3\u003e\n  \u003cp\u003eAt checkout, customers can pick one of these currencies for eligible one-time card purchases: US Dollars, British Pounds, Euro, Yen, Indian Rupees, Australian Dollars, Canadian Dollars, Hong Kong Dollars, Singapore Dollars, New Zealand Dollars, Brazilian Real, South African Rand, Swiss Franc, Israeli Shekel, Philippine Peso, Polish Zloty, Czech Koruna, Swedish Krona, Norwegian Krone, Danish Krone, Mexican Peso, Korean Won, Taiwanese Dollars, Saudi Riyal, UAE Dirham, Turkish Lira, Colombian Peso, Romanian Leu, Thai Baht, Malaysian Ringgit, Indonesian Rupiah and Vietnamese Dong. Not every currency is offered on every product, and a customer whose currency is not listed is charged in USD.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eThis changes nothing for you as a creator.\u003c/strong\u003e You set your price the same way, your earnings are the same, and your payouts arrive the same way. Only the amount the customer sees and is charged is converted. Nobody is sending you money unless they buy something you have listed.\u003c/p\u003e\n  \u003cp\u003eWhen a customer is charged in their own currency, the total they see keeps the price ending you chose in USD instead of showing the raw converted amount. A $9.99 total is quoted as €8,99 rather than €8,53, and a $10 total is quoted as €9. If tax is added, the ending mirrored is the one on the taxed total, so a customer paying in their own currency sees the same ending a customer paying in USD would. Your earnings, taxes, and payouts are unchanged — the small difference is absorbed by Gumroad. Not every total is adjusted: if the converted total is less than one unit of the customer&#39;s currency, or if matching your ending would move the total too far from the true converted amount, the customer is charged the exact converted amount instead. Because the difference comes out of Gumroad&#39;s fee, a total is only ever brought down when there is a fee to cover it: on sales where your Gumroad fee is waived the customer pays the exact converted amount, and on sales where Gumroad earns no percentage fee the total can still be matched up to your ending but is never lowered. You can turn this off with the \&quot;Keep price endings in local currency\&quot; setting in \u003ca href=\&quot;https://gumroad.com/settings/payments\&quot;\u003eSettings \u0026gt; Payments\u003c/a\u003e, in which case every total is the exact converted amount.\u003c/p\u003e\n  \u003cp\u003eIn your \u003ca href=\&quot;http://gumroad.com/settings\&quot;\u003eSettings menu\u003c/a\u003e, you can choose the default display currency for new products.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/61caeca5d1a2f12bbe21f0f2/file-o4FhZe2MjI.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003e\u003cstrong\u003eFor most products, you can change the display currency after creation. However, membership and bundle-type products cannot have their display currency changed once created.\u003c/strong\u003e\u003c/p\u003e\n  \u003cp\u003eIf you need to change the currency for a membership or bundle product, you will need to recreate the product. \u003c/p\u003e\n  \u003cp\u003eCustomers outside of the US may be subject to an additional fee for international purchases, depending on the policies of their credit card company. If you do set your currency in anything other than USD, you may want to inform your customers of this in your receipt&#39;s text.\u003c/p\u003e\n  \u003ch3\u003eWhat does this mean for getting paid?  \u003c/h3\u003e\n  \u003ch3\u003eFor all credit/debit card-related sales:\u003c/h3\u003e\n  \u003cp\u003eIf you live in one of the following \u003ca href=\&quot;13-getting-paid#DirectDeposits\&quot;\u003edirect-deposit countries\u003c/a\u003e, Gumroad pays you out in your native currency. All currency conversions happen based on the exchange rates at the time of sale, not at the time of the payout. These are typically mid-market rates that you can estimate \u003ca href=\&quot;https://dashboard.stripe.com/currency_conversion\&quot;\u003ehere\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003eIf you live in any other country, we pay you out via PayPal and you will be paid in USD. \u003c/p\u003e\n  \u003ch3\u003eFor all sales made via PayPal \u0026amp; Stripe Connect accounts:\u003c/h3\u003e\n  \u003cp\u003e\u003ca href=\&quot;275-paypal-connect\&quot;\u003ePayPal Connect\u003c/a\u003e and \u003ca href=\&quot;330-stripe-connect#disputes\&quot;\u003eStripe Connect\u003c/a\u003e allow creators to get paid instantly to their respective accounts whenever someone purchases their product.\u003c/p\u003e\n  \u003cp\u003eFor these sales, payouts will be at the time of sale and will be in the default currency of the creator&#39;s account — irrespective of what display currency you have set.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;13-getting-paid\&quot;\u003e\u003cspan\u003eGetting paid by Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;66-gumroads-fees\&quot;\u003e\u003cspan\u003eGumroad&#39;s fees\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;121-sales-tax-on-gumroad\&quot;\u003e\u003cspan\u003eSales tax on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-acco
