privacy%2C%20we%20do%20not%20allow%20content%20that%20contains%20the%20likeness%20of%20people%20under%20the%20age%20of%2018%2C%20or%20the%20likeness%20of%20adult%20private%20figures%20used%20without%20their%20permission.%3C%2Fp%3E%3Ch2%20level%3D%5C%222%5C%22%20id%3D%5C%22%5C%22%20align%3D%5C%22%5C%22%3E%3Cstrong%3EEvolving%20detection%20to%20keep%20pace%20with%20AI%3C%2Fstrong%3E%3C%2Fh2%3E%3Cp%3ETo%20enforce%20our%20policies%2C%20we%20continually%20evolve%20our%20detection%20methods%20to%20keep%20pace%20with%20AI's%20own%20evolution.%20We%20detect%20AI-generated%20content%20through%20a%20combination%20of%20proactive%20technologies%2C%20alerts%20from%20experts%20and%20fact-checking%20partners%2C%20searches%20for%20clips%20or%20keywords%20related%20to%20known%20AI-generated%20content%2C%20and%20user%20reports.%3C%2Fp%3E%3Cp%3EWhen%20we've%20identified%20misleading%20video%20or%20audio%20content%20that%20is%20spreading%20elsewhere%20online%20and%20violates%20our%20policies%2C%20we%20endeavor%20to%20automatically%20catch%20and%20take%20action%20on%20similar%20versions%20of%20that%20content%20to%20prevent%20it%20spreading%20on%20TikTok.%3C%2Fp%3E%3Ch2%20level%3D%5C%222%5C%22%20id%3D%5C%22%5C%22%20align%3D%5C%22%5C%22%3E%3Cstrong%3ELabeling%20content%20to%20provide%20transparency%20for%20viewers%20and%20other%20platforms%3C%2Fstrong%3E%3C%2Fh2%3E%3Cp%3EIn%20addition%20to%20providing%20a%20%3Ca%20href%3D%5C%22https%3A%2F%2Fwww.tiktok.com%2Fcreator-academy%2Fen%2Farticle%2Fai-generated-content-label%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3Etool%20for%20our%20creators%3C%2Fa%3E%20to%20easily%20label%20their%20own%20AIGC%20uploaded%20to%20TikTok%2C%20we%20automatically%20label%20AIGC%20made%20with%20TikTok%20AI%20effects.%20We%20also%20label%20AIGC%20from%20certain%20other%20platforms%20by%20using%20%3Ca%20href%3D%5C%22https%3A%2F%2Fc2pa.org%2F%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3EContent%20Credentials%3C%2Fa%3E%2C%20a%20technical%20standard%20developed%20by%20the%20Coalition%20for%20Content%20Provenance%20and%20Authenticity%20(C2PA).%20Content%20Credentials%20attach%20metadata%20to%20content%2C%20which%20enables%20our%20systems%20to%20instantly%20recognize%20and%20label%20AIGC.%3C%2Fp%3E%3Cp%3EIn%20addition%20to%20reading%20Content%20Credentials%2C%20we're%20also%20working%20to%20attach%20them%20to%20TikTok%20content%2C%20which%20will%20remain%20on%20content%20when%20downloaded%20or%20even%20shared%20on%20other%20platforms.%20This%20means%20that%20anyone%20will%20be%20able%20to%20use%20C2PA's%20%3Ca%20href%3D%5C%22https%3A%2F%2Fcontentcredentials.org%2Fverify%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3EVerify%20tool%20%3C%2Fa%3Eto%20help%20identify%20AIGC%20that%20was%20made%20or%20edited%20on%20TikTok%20and%20even%20learn%20when%2C%20where%20and%20how%20the%20content%20was%20made%20or%20edited.%3C%2Fp%3E%3Ch2%20level%3D%5C%222%5C%22%20id%3D%5C%22%5C%22%20align%3D%5C%22%5C%22%3E%3Cstrong%3EJoining%20partnerships%20to%20address%20shared%20challenges%3C%2Fstrong%3E%3C%2Fh2%3E%3Cp%3EWe%20recognize%20that%20promoting%20the%20responsible%20creation%20and%20distribution%20of%20AI-generated%20content%20is%20a%20societal%20challenge%20that%20no%20platform%20alone%20can%20solve.%20That's%20why%20we%20continue%20to%20partner%20with%20peers%2C%20experts%20and%20our%20community%20to%20advance%20AI%20transparency%20efforts%20and%20combat%20misleading%20AI%20at%20scale.%3C%2Fp%3E%3Cp%3EIn%20addition%20to%20implementing%20C2PA%20Content%20Credentials%2C%20we%20support%20the%20coalition's%20working%20groups%20as%20a%20C2PA%20General%20Member%2C%20and%20joined%20the%20Content%20Authenticity%20Initiative%20(CAI)%20to%20drive%20wider%20adoption%20of%20the%20technical%20standard.%20We%20were%20also%20launch%20supporters%20of%20the%20%3Ca%20href%3D%5C%22https%3A%2F%2Fsyntheticmedia.partnershiponai.org%2F%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3EPartnership%20on%20AI's%20Framework%20for%20Responsible%20Practices%20for%20Synthetic%20Media%3C%2Fa%3E%2C%20and%20co-published%20a%20%3Ca%20href%3D%5C%22https%3A%2F%2Fsyntheticmedia.partnershiponai.org%2F%23case_studies%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3Ecase%20study%3C%2Fa%3E%20on%20how%20we%20applied%20the%20Framework%20to%20our%20own%20AIGC%20policies.%20At%20the%20Munich%20Security%20Conference%20in%202024%2C%20we%3Ca%20href%3D%5C%22https%3A%2F%2Fwww.aielectionsaccord.com%2F%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3E%20joined%20forces%3C%2Fa%3E%20with%20some%20of%20the%20world's%20largest%20tech%20companies%20on%20a%20new%20pledge%20to%20combat%20the%20deceptive%20use%20of%20AI%20during%20elections.%3C%2Fp%3E%3Cp%3EAround%20the%20world%2C%20we%20are%20launching%20media%20literacy%20campaigns%20with%20guidance%20from%20expert%20organizations%20like%20%3Ca%20href%3D%5C%22https%3A%2F%2Fwww.tiktok.com%2F%40mediawise%3Flang%3Den%23%3A~%3Atext%3DMediaWise%2520(%2540mediawise)%2520Official%2520%257C%2520TikTok%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3EMediawise%3C%2Fa%3E%20and%20%3Ca%20href%3D%5C%22https%3A%2F%2Fwww.witness.org%2F%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3EWITNESS%3C%2Fa%3E%20that%20teach%20our%20community%20how%20to%20spot%20and%20label%20AI-generated%20co o%2C%20our%20priority%20is%20to%20keep%20harmful%20AIGC%20off%20TikTok%2C%20empower%20transparent%20and%20responsible%20content%20creation%2C%20and%20partner%20with%20peers%20and%20experts%20to%20address%20the%20shared%20challenges%20that%20generative%20AI%20can%20pose.%3C%2Fp%3E%3Ch2%20level%3D%5C%222%5C%22%20id%3D%5C%22%5C%22%20align%3D%5C%22left%5C%22%20style%3D%5C%22text-align%3Aleft%3B%5C%22%3E%3Cstrong%3EProtecting%20our%20community%20by%20enforcing%20firm%20policies%3C%2Fstrong%3E%3C%2Fh2%3E%3Cp%3EContent%20that%20violates%20our%20%3Ca%20href%3D%5C%22https%3A%2F%2Fwww.tiktok.com%2Fcommunity-guidelines%3Flang%3Den%2329%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3ECommunity%20Guidelines%3C%2Fa%3E%20is%20never%20allowed%20on%20TikTok%2C%20regardless%20of%20whether%20it%20was%20created%20or%20altered%20with%20AI%E2%80%94including%20misinformation%2C%20impersonation%2C%20nudity%2C%20sexual%20abuse%2C%20and%20child%20sexual%20abuse%20material%20(CSAM).%20Through%20our%20dedicated%20%3Ca%20href%3D%5C%22https%3A%2F%2Fwww.tiktok.com%2Fcommunity-guidelines%2Fen%2Fintegrity-authenticity%2F%233%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3EEdited%20Media%20and%20AI-Generated%20Content%20%3C%2Fa%3Epolicy%2C%20we%20apply%20additional%20rules%20for%20AIGC%20that%20enable%20creativity%20while%20protecting%20viewers%20from%20being%20misled.%3C%2Fp%3E%3Cp%3EWe%20require%20creators%20to%20label%20AIGC%20that%20shows%20realistic-appearing%20scenes%20or%20people%2C%20and%20were%20the%20first%20content%20sharing%20platform%20to%20build%20a%20%3Ca%20href%3D%5C%22https%3A%2F%2Fsupport.tiktok.com%2Fen%2Fusing-tiktok%2Fcreating-videos%2Fai-generated-content%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3Etool%3C%2Fa%3E%20that%20helps%20them%20do%20this%20easily.%20We%20also%20prohibit%20AIGC%20that%20could%20mislead%20viewers%20about%20the%20truth%20of%20real%20world%20events%2C%20including%20content%20that%20was%20misleadingly%20edited%20or%20taken%20out%20of%20context%2C%20shows%20fake%20authoritative%20sources%20or%20crisis%20events%2C%20or%20falsely%20shows%20public%20figures%20who%20are%20being%20bullied%2C%20or%20impersonated%2C%20including%20making%20an%20endorsement%2C%20or%20being%20endorsed.%3C%2Fp%3E%3Cp%3EIn%20line%20with%20our%20commitment%20to%20protecting%20peoples'%20privacy%2C%20we%20do%20not%20allow%20content%20that%20contains%20the%20likeness%20of%20people%20under%20the%20age%20of%2018%2C%20or%20the%20likeness%20of%20adult%20private%20figures%20used%20without%20their%20permission.%3C%2Fp%3E%3Ch2%20level%3D%5C%222%5C%22%20id%3D%5C%22%5C%22%20align%3D%5C%22%5C%22%3E%3Cstrong%3EEvolving%20detection%20to%20keep%20pace%20with%20AI%3C%2Fstrong%3E%3C%2Fh2%3E%3Cp%3ETo%20enforce%20our%20policies%2C%20we%20continually%20evolve%20our%20detection%20methods%20to%20keep%20pace%20with%20AI's%20own%20evolution.%20We%20detect%20AI-generated%20content%20through%20a%20combination%20of%20proactive%20technologies%2C%20alerts%20from%20experts%20and%20fact-checking%20partners%2C%20searches%20for%20clips%20or%20keywords%20related%20to%20known%20AI-generated%20content%2C%20and%20user%20reports.%3C%2Fp%3E%3Cp%3EWhen%20we've%20identified%20misleading%20video%20or%20audio%20content%20that%20is%20spreading%20elsewhere%20online%20and%20violates%20our%20policies%2C%20we%20endeavor%20to%20automatically%20catch%20and%20take%20action%20on%20similar%20versions%20of%20that%20content%20to%20prevent%20it%20spreading%20on%20TikTok.%3C%2Fp%3E%3Ch2%20level%3D%5C%222%5C%22%20id%3D%5C%22%5C%22%20align%3D%5C%22%5C%22%3E%3Cstrong%3ELabeling%20content%20to%20provide%20transparency%20for%20viewers%20and%20other%20platforms%3C%2Fstrong%3E%3C%2Fh2%3E%3Cp%3EIn%20addition%20to%20providing%20a%20%3Ca%20href%3D%5C%22https%3A%2F%2Fwww.tiktok.com%2Fcreator-academy%2Fen%2Farticle%2Fai-generated-content-label%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3Etool%20for%20our%20creators%3C%2Fa%3E%20to%20easily%20label%20their%20own%20AIGC%20uploaded%20to%20TikTok%2C%20we%20automatically%20label%20AIGC%20made%20with%20TikTok%20AI%20effects.%20We%20also%20label%20AIGC%20from%20certain%20other%20platforms%20by%20using%20%3Ca%20href%3D%5C%22https%3A%2F%2Fc2pa.org%2F%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3EContent%20Credentials%3C%2Fa%3E%2C%20a%20technical%20standard%20developed%20by%20the%20Coalition%20for%20Content%20Provenance%20and%20Authenticity%20(C2PA).%20Content%20Credentials%20attach%20metadata%20to%20content%2C%20which%20enables%20our%20systems%20to%20instantly%20recognize%20and%20label%20AIGC.%3C%2Fp%3E%3Cp%3EIn%20addition%20to%20reading%20Content%20Credentials%2C%20we're%20also%20working%20to%20attach%20them%20to%20TikTok%20content%2C%20which%20will%20remain%20on%20content%20when%20downloaded%20or%20even%20shared%20on%20other%20platforms.%20This%20means%20that%20anyone%20will%20be%20able%20to%20use%20C2PA's%20%3Ca%20href%3D%5C%22https%3A%2F%2Fcontentcredentials.org%2Fverify%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3EVerify%20tool%20%3C%2Fa%3Eto%20help%20identify%20AIGC%20that%20was%20made%20or%20edited%20on%20TikTok%20and%20even%20learn%20when%2C%20where%20and%20how%20the%20content%20was%20made%20or%20edited.%3C%2Fp%3E%3Ch2%20level%3D%5C%222%5C%22%20id%3D%5C%22%5C%22%20align%3D%5C%22%5C%22%3E%3Cstrong%3EJoining%20partnerships%20to%20address%20shared%20challenges%3C%2Fstrong%3E%3C%2Fh2%3E%3Cp%3EWe%20recognize%20that%20promoting%20the%20responsible%20creation%20and%20distribution%20of%20AI-generated%20content%20is%20a%20societal%20challenge%20that%20no%20platform%20alone%20can%20solve.%20That's%20why%20we%20continue%20to%20partner%20with%20peers%2C%20experts%20and%20our%20community%20to%20advance%20AI%20transparency%20efforts%20and%20combat%20misleading%20AI%20at%20scale.%3C%2Fp%3E%3Cp%3EIn%20addition%20to%20implementing%20C2PA%20Content%20Credentials%2C%20we%20support%20the%20coalition's%20working%20groups%20as%20a%20C2PA%20General%20Member%2C%20and%20joined%20the%20Content%20Authenticity%20Initiative%20(CAI)%20to%20drive%20wider%20adoption%20of%20the%20technical%20standard.%20We%20were%20also%20launch%20supporters%20of%20the%20%3Ca%20href%3D%5C%22https%3A%2F%2Fsyntheticmedia.partnershiponai.org%2F%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3EPartnership%20on%20AI's%20Framework%20for%20Responsible%20Practices%20for%20Synthetic%20Media%3C%2Fa%3E%2C%20and%20co-published%20a%20%3Ca%20href%3D%5C%22https%3A%2F%2Fsyntheticmedia.partnershiponai.org%2F%23case_studies%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3Ecase%20study%3C%2Fa%3E%20on%20how%20we%20applied%20the%20Framework%20to%20our%20own%20AIGC%20policies.%20At%20the%20Munich%20Security%20Conference%20in%202024%2C%20we%3Ca%20href%3D%5C%22https%3A%2F%2Fwww.aielectionsaccord.com%2F%5C%22%20target%3D%5C%22_blank%5C%22%20rel%3D%5C%22nofollow%20noreferrer%5C%22%20class%3D%5C%22syl-link%5C%22%20data-anchor-id%3D%5C%22%5C%22%3E%20joined%20forces%3C%2Fa%3E%20with%20some%20of%20the%20world's%20largest%20tech%20companies%20on%20a%20new%20pledge%20to%20combat%20the%20deceptive%20use%20of%20AI%20during%20elections.%3C%2Fp%3E%3Cp%3EAround%20the%20world%2C%20we%20are%20launching%20media%20literacy%20campaigns%20with%20guidance%20from%20expert%20organizations%20like%20%3Ca%20href%3D%5C%22https%3A%2F
