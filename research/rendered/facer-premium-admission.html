        <script type="application/json" id="data-preloaded">{"topic_25147":"{\"post_stream\":{\"posts\":[{\"id\":43551,\"name\":\"Veertualia\",\"username\":\"veertualia.team\",\"avatar_template\":\"/user_avatar/community.facer.io/veertualia.team/{size}/11382_2.png\",\"created_at\":\"2018-06-28T13:05:48.833Z\",\"cooked\":\"\\u003cp\\u003eIt seems economics is not a secondary aspect in designing for Facer, even if a lot of designers just love to share their passion for creating watch faces designs.\\u003c/p\\u003e\\n\\u003cp\\u003eThese are \\u003ca class=\\\"mention\\\" href=\\\"/u/facer_official\\\"\\u003e@Facer_Official\\u003c/a\\u003e  own words (\\u003ca href=\\\"https://news.facer.io/facer-passes-1-million-smartwatch-users-and-designers-are-starting-to-make-big-selling-watch-8ca6338e00f5\\\"\\u003ehttps://news.facer.io/facer-passes-1-million-smartwatch-users-and-designers-are-starting-to-make-big-selling-watch-8ca6338e00f5\\u003c/a\\u003e):\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eMost of Facer’s 5,000 designers create watch faces just for fun but others are starting to earn some serious revenue by selling their designs on the platform:\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e“Selling watch faces on Facer easily pays my rent each month!” —  G7\\u003cbr\\u003e\\n“Facer is a great creative outlet \\u0026amp; pays better than freelance jobs” — Timeless\\u003cbr\\u003e\\n“Thanks to Facer, I can pay for my University studies!” — \\u003ca class=\\\"mention\\\" href=\\\"/u/grr\\\"\\u003e@GRR\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eSo, since \\u003ca class=\\\"mention\\\" href=\\\"/u/facer_official\\\"\\u003e@Facer_Official\\u003c/a\\u003e clearly states that earning \\u003cem\\u003esome\\u003c/em\\u003e money \\u003cem\\u003eis\\u003c/em\\u003e a strong motivational factor for designers to create watch faces on their platform, I think they should answer a couple of questions, just to help us understand.\\u003cbr\\u003e\\nAfter all, when operating your own store - because that’s also what the “Premium designer” program is - transparency is essential.\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eWhat are the revenue-sharing terms of the Premium Designer program?\\u003cbr\\u003e\\nI couldn’t find them. Can someone? Google Play publishes them here: \\u003ca href=\\\"https://support.google.com/googleplay/android-developer/answer/112622?hl=en\\\" class=\\\"inline-onebox\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eService fees - Play Console Help\\u003c/a\\u003e\\u003cbr\\u003e\\n70% goes to the developers, while 30% goes to the distribution partner and operating fees.\\u003cbr\\u003e\\nDo you Premium Designers care to share that information, please?\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eIn order to understand \\u003cem\\u003ehow\\u003c/em\\u003e a designer watch face portfolio must perform to allow to pay the rent or the university studies, the number of syncs (downloads) of every designer should also be visible - at the very least - to the designer community, in addition to the revenue-sharing terms.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eSince Facer uses a ranking-list approach to decide who’s admitted to the store and who isn’t (and when), while expecting the designers to keep contributing free watch faces - just to wait in line -, such ranking list should be periodically published and accessible to everybody.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eThese are not abstract principles when deciding if designing for Facer. I respect people working just for passion.  But, sometimes, for someone, money is involved. And I’m not the one talking about the money you can make by publishing watch faces here. \\u003ca class=\\\"mention\\\" href=\\\"/u/facer_official\\\"\\u003e@Facer_Official\\u003c/a\\u003e is.\\u003c/p\\u003e\\n\\u003cp\\u003eSome answers are in order.\\u003c/p\\u003e\",\"post_number\":1,\"post_type\":1,\"posts_count\":34,\"updated_at\":\"2018-06-28T13:05:48.833Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":57,\"reads\":93,\"readers_count\":92,\"score\":325.6,\"yours\":false,\"topic_id\":25147,\"topic_slug\":\"premium-designer-program-admission-rankings-and-revenue-sharing-terms\",\"display_username\":\"Veertualia\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://news.facer.io/facer-passes-1-million-smartwatch-users-and-designers-are-starting-to-make-big-selling-watch-8ca6338e00f5\",\"internal\":false,\"reflection\":false,\"clicks\":24},{\"url\":\"https://support.google.com/googleplay/android-developer/answer/112622?hl=en\",\"internal\":false,\"reflection\":false,\"title\":\"Transaction fees - Play Console Help\",\"clicks\":9},{\"url\":\"https://community.facer.io/t/how-to-become-a-premium-designer-and-sell-your-watch-face-designs-on-facer/3540/103\",\"internal\":true,\"reflection\":true,\"title\":\"How to become a Premium Designer and sell your watch face designs on Facer\",\"clicks\":3},{\"url\":\"https://community.facer.io/t/ways-to-become-premium/27167/3\",\"internal\":true,\"reflection\":true,\"title\":\"Ways to Become Premium?\",\"clicks\":0},{\"url\":\"https://community.facer.io/t/replica-faces-seems-not-for-all-aloud/26902/17\",\"internal\":true,\"reflection\":true,\"title\":\"Replica Faces (seems) not for all aloud\",\"clicks\":0},{\"url\":\"https://community.facer.io/t/cease-and-desist-warning/50023/7\",\"internal\":true,\"reflection\":true,\"title\":\"Cease and desist warning\",\"clicks\":0}],\"read\":true,\"user_title\":null,\"bookmarked\ adge-color: #283890; --category-badge-text-color: #FFFFFF; --parent-category-badge-color: #283890;\\\" data-parent-category-id=\\\"32\\\" data-drop-close=\\\"true\\\" class=\\\"badge-category --style-square --has-parent\\\"\\u003e\\u003cspan class=\\\"badge-category__name\\\"\\u003eGeneral discussion\\u003c/span\\u003e\\u003c/span\\u003e\\u003c/a\\u003e\\n    \\u003c/div\\u003e\\n  \\u003c/div\\u003e\\n  \\u003cblockquote\\u003e\\n    Ok. \\nDear \\u003ca class=\\\"mention\\\" href=\\\"/u/facer_official\\\"\\u003e@Facer_Official\\u003c/a\\u003e, @Facer-Staff … \\nToday i did my second attempt in applying for Facer’s Premium Designer program. Last time was one month ago with no result and no answer … but i will keep on fighting.  \\u003cimg width=\\\"20\\\" height=\\\"20\\\" src=\\\"https://community.facer.io/images/emoji/twitter/slight_smile.png?v=15\\\" title=\\\"slight_smile\\\" alt=\\\"slight_smile\\\" class=\\\"emoji\\\"\\u003e \\nI really don´t know why nobody reacts on my last application but maybe time will tell … \\nI am a little bit frustrated, mostly that i don´t get any feedback at all. \\nI now have more than six watches which fullfill the desired 3000 syncs in 30 days, two watch faces over 10k…\\n  \\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eAs long as you are happy elsewhere there is no need to pursue your questioning of Facer policies.\\u003c/p\\u003e\",\"post_number\":4,\"post_type\":1,\"posts_count\":34,\"updated_at\":\"2018-06-30T17:00:02.764Z\",\"reply_count\":2,\"reply_to_post_number\":null,\"quote_count\":1,\"incoming_link_count\":1,\"reads\":84,\"readers_count\":83,\"score\":46.8,\"yours\":false,\"topic_id\":25147,\"topic_slug\":\"premium-designer-program-admission-rankings-and-revenue-sharing-terms\",\"display_username\":\"\",\"primary_group_name\":\"Premium-Designers\",\"flair_name\":\"Premium-Designers\",\"flair_url\":\"star\",\"flair_bg_color\":\"ec2224\",\"flair_color\":\"FFFFFF\",\"flair_group_id\":42,\"badges_gra \\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThey could just say it. Unless this hypothetical Non Disclosure Agreement lists its very existence among the topics that cannot be discussed.\\u003cimg src=\\\"https://community.facer.io/images/emoji/twitter/smile.png?v=15\\\" title=\\\":smile:\\\" class=\\\"emoji\\\" alt=\\\":smile:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003cbr\\u003e\\nWhich would be \\u003cem\\u003eunusual\\u003c/em\\u003e, at the very least, since other stores such as Google Play and Galaxy Apps are \\u003cem\\u003ecompletely\\u003c/em\\u003e transparent when it comes to their revenue sharing terms.\\u003c/p\\u003e\\n\\u003caside class=\\\"quote group-Premium-Designers\\\" data-username=\\\"Linlay\\\" data-post=\\\"4\\\" data-topic=\\\"25147\\\" data-full=\\\"true\\\"\\u003e\\n\\u003cdiv class=\\\"title\\\"\\u003e\\n\\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://community.facer.io/user_avatar/community.facer.io/linlay/48/19694_2.png\\\" class=\\\"avatar\\\"\\u003e Linlay:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eThat may be because one or more of your earlier posts mentioning that you are already selling faces on Google Play and Galaxy Apps gave everyone the impression that you do not wish to participate here.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI \\u003cem\\u003eam\\u003c/em\\u003e interested in in publishing \\u003cem\\u003epaid\\u003c/em\\u003e watch faces here. I applied for Premium in February.\\u003cbr\\u003e\\nI said - after months of waiting in line - that I will not publish any more \\u003cem\\u003efree\\u003c/em\\u003e watch faces until I’m accepted in the program.\\u003c/p\\u003e\\n\\u003cp\\u003eThat’s why I’m asking for the revenue-sharing terms, the possibility to see the number of syncs of other authors and the ranking list that determines who’s accepted in the program.\\u003c/p\\u003e\\n\\u003cp\\u003eI’m just a determined, persistent, pacient man.\\u003c/p\\u003e\",\"post_number\":5,\"post_type\":1,\"posts_count\":34,\"updated_at\":\"2018-06-30T17:41:41.042Z\",\"reply_count\":1,\"reply_to_post_number\":3,\"quote_count\":2,\"incoming_link_count\":1,\"reads\":79,\"readers_count\":78,\"score\":27.8,\"yours\":false,\"topic_id\":25147,\"topic_slug\":\"premium-designer-program-admission-rankings-and-revenue-sharing-terms\",\"display_username\":\"Veertualia\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":20615,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":false,\"wiki\":false,\"user_custom_fields\":{\"facer_id\":\"LZOluWxhTJ\"},\"post_url\":\"/t/premium-designer-program-admission-rankings-and-revenue-sharing-terms/25147/5\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":43730,\"name\":\"\",\"username\":\"Linlay\",\"avatar_template\":\"/user_avatar/community.facer.io/linlay/{size}/19694_2.png\",\"created_at\":\"2018-06-30T18:03:02.175Z\",\"cooked\":\"\\u003cp\\u003e[quote=“veertualia.team, post:5, topic:25147”]\\u003cbr\\u003e\\nI’m just a determined, persistent, pacient man.\\u003cbr\\u003e\\n[/quote]  Persistence in an online community environment is not always perceived as a positive attribute. I suggest that you discuss your questions privately with Facer and accept whatever response or lack thereof that you receive.\\u003c/p\\u003e\",\"post_number\":6,\"post_type\":1,\"posts_count\":34,\"updated_at\":\"2018-06-30T18:03:02.175Z\",\"reply_count\":1,\"reply_to_post_number\":5,\"quote_count\":1,\"incoming_link_count\":1,\"reads\":74,\"readers_count\":73,\"score\":24.8,\"yours\":false,\"topic_id\":25147,\"topic_slug\":\"premium-designer-program-admission-rankings-and-revenue-sharing-terms\",\"display_username\":\"\",\"primary_group_name\":\"Premium-Designers\",\"flair_name\":\"Premium-Designers\",\"flair_url\":\"star\",\"flair_bg_color\":\"ec2224\",\"flair_color\":\"FFFFFF\",\"flair_group_id\":42,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"Facer Creator Partner\",\"title_is_group\":true,\"reply_to_user\":{\"id\":20615,\"username\":\"veertualia.team\",\"name\":\"Veertualia\",\"avatar_template\":\"/user_avatar/community.facer.io/veertualia.team/{size}/11382_2.png\"},\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":469,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":false,\"wiki\":false,\"user_custom_fields\":{\"facer_id\":\"aSyiStfuwe\"},\"post_url\":\"/t/premium-designer-program-admission-rankings-and-revenue-sharing-terms/25147/6\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":43734,\"name\":\"Veertualia\",\"username\":\"veertualia.team\",\"avatar_template\":\"/user_avatar/community.facer.io/veertualia.team/{size}/11382_2.png\",\"created_at\":\"2018-06-30T18:09:55.204Z\",\"cooked\":\"\\u003cp\\u003eI think it’s perfectly normal wanting to know your share, if you plan to earn some money designing watch faces for this platform. Even if you will never reach the amount you need to pay for your rent - as \\u003ca class=\\\"mention\\\" href=\\\"/u/facer_official\\\"\\u003e@Facer_Official\\u003c/a\\u003e says (did you read it?).\\u003c/p\\u003e\\n\\u003cp\\u003eAt least you can decide if it deserves the time and the energy (the number of free watch faces) you are willing to put in the effort. Would you rather prefer to sell something without knowing what will you earn from it?\\u003c/p\\u003e\\n\\u003cp\\u003eFor Google is 70/30: \\u003ca href=\\\"https://support.google.com/googleplay/android-developer/answer/112622?hl=en\\\" class=\\\"inline-onebox\\\" rel=\\\"nofollow noopener\\\"\\u003eTransaction fees - Play Console Help\\u003c/a\\u003e\\u003cbr\\u003e\\nFor Samsung is also 70/30: \\u003ca href=\\\"https://seller.samsungapps.com/help/termsAndConditions.as\\\" rel=\\\"nofollow noopener\\\"\\u003ehttps://seller.samsungapps.com/help/termsAndConditions.as\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eOf course, if the revenue-sharing terms were 95% Facer - 5% designer, I would just say “so long and thanks for all the fish” and disappear forever. \\u003cimg src=\\\"https://community.facer.io/images/emoji/twitter/wink.png?v=9\\\" title=\\\":wink:\\\" class=\\\"emoji\\\" alt=\\\":wink:\\\"\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eWhy is it so difficult to know?\\u003c/p\\u003e\",\"post_number\":7,\"post_type\":1,\"posts_count\":34,\"updated_at\":\"2018-06-30T18:09:55.204Z\",\"reply_count\":0,\"reply_to_post_number\":4,\"quote_count\":0,\"incoming_link_count\":1,\"reads\":75,\"readers_count\":74,\"score\":20.0,\"yours\":false,\"topic_id\":25147,\"topic_slug\":\"premium-designer-program-admission-rankings-and-revenue-sharing-terms\",\"display_username\":\"Veertualia\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://seller.samsungapps.com/help/termsAndConditions.as\",\"internal\":false,\"reflection\":false,\"title\":\"SAMSUNG Galaxy Apps Seller Office\",\"clicks\":4},{\"url\":\"https://support.google.com/googleplay/android-developer/answer/112622?hl=en\",\"internal\":false,\"reflection\":false,\"title\":\"Transaction fees - Play Console Help\",\"clicks\":1}],\"read\":true,\"user_title\":null,\"reply_to_user\":{\"id\":469,\"username\":\"Linlay\",\"name\":\"\",\"avatar_template\":\"/user_avatar/community.facer.io/linlay/{size}/19694_2.png\"},\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":20615,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":false,\"wiki\":false,\"user_custom_fields\":{\"facer_id\":\"LZOluWxhTJ\"},\"post_url\":\"/t/premium-designer-program-admission-rankings-and-revenue-sharing-terms/25147/7\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":43740,\"name\":\"Veertualia\",\"username\":\"veertualia.team\",\"avatar_template\":\"/user_avatar/community.facer.io/veertualia.team/{size}/11382_2.png\",\"created_at\":\"2018-06-30T18:49:27.699Z\",\"cooked\":\"\\u003cp\\u003eLinlay, I (too) manage large communities. Quite turbulent ones because they are about football.\\u003cbr\\u003e\\nI know what rules are, and I respect them.\\u003c/p\\u003e\\n\\u003cp\\u003eI’m just asking three legit questions. I opened one (1) topic. I’m not bumping. I’m not trolling.\\u003cbr\\u003e\\nAnd I have already had a (6 month) long email exchange with Facer which I’m not revealing.\\u003c/p\\u003e\\n\\u003c             <div class='post' itemprop="text">
              <p>It seems economics is not a secondary aspect in designing for Facer, even if a lot of designers just love to share their passion for creating watch faces designs.</p>
<p>These are <a class="mention" href="/u/facer_official">@Facer_Official</a>  own words (<a href="https://news.facer.io/facer-passes-1-million-smartwatch-users-and-designers-are-starting-to-make-big-selling-watch-8ca6338e00f5">https://news.facer.io/facer-passes-1-million-smartwatch-users-and-designers-are-starting-to-make-big-selling-watch-8ca6338e00f5</a>):</p>
<blockquote>
<p>Most of Facer’s 5,000 designers create watch faces just for fun but others are starting to earn some serious revenue by selling their designs on the platform:</p>
</blockquote>
<blockquote>
<p>“Selling watch faces on Facer easily pays my rent each month!” —  G7<br>
“Facer is a great creative outlet &amp; pays better than freelance jobs” — Timeless<br>
“Thanks to Facer, I can pay for my University studies!” — <a class="mention" href="/u/grr">@GRR</a></p>
</blockquote>
<p>So, since <a class="mention" href="/u/facer_official">@Facer_Official</a> clearly states that earning <em>some</em> money <em>is</em> a strong motivational factor for designers to create watch faces on their platform, I think they should answer a couple of questions, just to help us understand.<br>
After all, when operating your own store - because that’s also what the “Premium designer” program is - transparency is essential.</p>
<ol>
<li>
<p>What are the revenue-sharing terms of the Premium Designer program?<br>
I couldn’t find them. Can someone? Google Play publishes them here: <a href="https://support.google.com/googleplay/android-developer/answer/112622?hl=en" class="inline-onebox" rel="noopener nofollow ugc">Service fees - Play Console Help</a><br>
70% goes to the developers, while 30% goes to the distribution partner and operating fees.<br>
Do you Premium Designers care to share that information, please?</p>
</li>
<li>
<p>In order to understand <em>how</em> a designer watch face portfolio must perform to allow to pay the rent or the university studies, the number of syncs (downloads) of every designer should also be visible - at the very least - to the designer community, in addition to the revenue-sharing terms.</p>
</li>
<li>
<p>Since Facer uses a ranking-list approach to decide who’s admitted to the store and who isn’t (and when), while expecting the designers to keep contributing free watch faces - just to wait in line -, such ranking list should be periodically published and accessible to everybody.</p>
</li>
</ol>
<p>These are not abstract principles when deciding if designing for Facer. I respect people working just for passion.  But, sometimes, for someone, money is involved. And I’m not the one talking about the money you can make by publishing watch faces here. <a class="mention" href="/u/facer_official">@Facer_Official</a> is.</p>
<p>Some answers are in order.</p>

              <p>I think it’s perfectly normal wanting to know your share, if you plan to earn some money designing watch faces for this platform. Even if you will never reach the amount you need to pay for your rent - as <a class="mention" href="/u/facer_official">@Facer_Official</a> says (did you read it?).</p>
