    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;4Xu6AcAnktBmZcwzals5T6GQD7BYoqPhaPCvOVwjUEM=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;UeG6sWKwQJa9xeZnxw4s4QPltyv-p4NeiUresBVAwNbKJYcl9YEqSXCLyZOEmdtYM6x3EJqj7fbBwIHlRY6NfQ&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;How do I get a refund? - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;How do I get a refund?&quot;,&quot;slug&quot;:&quot;190-how-do-i-get-a-refund&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003eIn this article:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Website-purchases-YEQit\&quot; target=\&quot;_self\&quot;\u003eWebsite purchases\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Brazil-7-day-withdrawal-kQ2pF\&quot; target=\&quot;_self\&quot;\u003eBrazil 7-day withdrawal\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#In-App-Purchases-GL6fX\&quot; target=\&quot;_self\&quot;\u003eIn-app purchases\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003chr role=\&quot;separator\&quot;\u003e\n  \u003ch3 id=\&quot;Website-purchases-YEQit\&quot;\u003eWebsite purchases\u003c/h3\u003e\n  \u003cp\u003eWhen you buy a product from a Gumroad creator, Gumroad only processes payments on behalf of that creator. We allow creators on our platform to \u003ca href=\&quot;51-what-is-gumroads-refund-policy\&quot;\u003eset their own refund policies\u003c/a\u003e and issue their own refunds to their customers (i.e. you!).\u003c/p\u003e\n  \u003cp\u003eUnfortunately, we can&#39;t issue an immediate refund unless the charge was \u003ca href=\&quot;https://gumroad.com/help/article/283-fraudulent-purchases\&quot;\u003efraudulent\u003c/a\u003e or a duplicate, or you qualify for the Brazil 7-day withdrawal for website purchases below.\u003c/p\u003e\n  \u003cp\u003ePlease write to us if you haven’t heard back from the creator for 30 days since first contacting them, along with the proof of correspondence. We will reach out to them and will issue a refund if they continue to be unresponsive.\u003c/p\u003e\n  \u003cp\u003eIf you have issues with the product you&#39;ve purchased through Gumroad or feel you deserve a refund, you should contact the creator of the product. \u003c/p\u003e\n  \u003cp\u003eYou can contact the creator by replying directly to your receipt email:\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://lh7-us.googleusercontent.com/dl2KcyB6VcgKyQjf_PdY7mSpA3PwCXm4kfCzmq-kbi0hRee7mzCRjIG0oLOuAjucAk-1Z6uEl4rVS-LeIjd58epUux48b0Sm1QhY_AhBPSZWAKgINSkHcFiWMTNUEOlYlYG5KdDpPdhuOhJk3_7RebM\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eor by looking at the \&quot;reply-to\&quot; information on your purchase email\u003c/p\u003e\n  \u003ch3\u003e\u003c/h3\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/61fb919bd86136157d9a05c5/file-kV4glDwBbx.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eIf you didn&#39;t receive a receipt, please first check the spam folder in your email inbox. If you still cannot find your receipt, please go through the steps \u003ca href=\&quot;212-i-never-received-a-receipt\&quot; target=\&quot;_self\&quot;\u003eon this page\u003c/a\u003e.\u003c/p\u003e\n  \u003cbr\u003e\n  \u003ch3 id=\&quot;Brazil-7-day-withdrawal-kQ2pF\&quot;\u003eBrazil 7-day withdrawal\u003c/h3\u003e\n  \u003cp\u003eFor website purchases processed by Gumroad, if you bought as a consumer in Brazil, Brazilian law (Consumer Protection Code, Article 49) gives you 7 days from delivery to withdraw from a distance purchase, including digital products, even if the listing says no refunds. Write to us within that window and we will refund the charge. In-app purchases are refunded by Apple or Google instead, as described below.\u003c/p\u003e\n  \u003cbr\u003e\n  \u003ch3 id=\&quot;In-App-Purchases-GL6fX\&quot;\u003eIn-App purchases\u003c/h3\u003e\n  \u003cp\u003eRefunds for in-app purchases are handled independently by Apple/Google support, so if you made a purchase on the \u003ca href=\&quot;177-the-gumroad-dashboard-app#Download-the-app-a0fEa\&quot;\u003eGumroad mobile app\u003c/a\u003e, neither the creator nor Gumroad can refund your purchase.\u003c/p\u003e\n  \u003cbr\u003e\n  \u003cp\u003eIf you need a refund for an in-app purchase, please contact \u003ca href=\&quot;https://support.apple.com/en-au/118223\&quot;\u003eApple\u003c/a\u003e (for IOS devices) or \u003ca href=\&quot;https://support.google.com/googleplay/answer/2479637?sjid=15689087848422407774-AP\&quot;\u003eGoogle support\u003c/a\u003e (for Android devices).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;192-how-do-i-cancel-my-membership\&quot;\u003e\u003cspan\u003eHow do I cancel my membership?\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;214-why-was-i-charged-by-gumroad\&quot;\u003e\u003cspan\u003eWhy was I charged by Gumroad?\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;195-theres-an-issue-with-my-purchase\&quot;\u003e\u003cspan\u003eThere&#39;s an issue with my purchase\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;197-why-do-i-have-a-1-charge-from-gumroad\&quot;\u003e\u003cspan\u003eWhy do I have a $1 charge from Gumroad?\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;215-when-will-my-purchase-be-shipped\&quot;\u003e\u003cspan\u003eWhen will my purchase be shipped?\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;211-im-not-receiving-updates\&quot;\u003e\u003cspan\u003eI&#39;m not receiving updates\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Receipts and refunds&quot;,&quot;slug&quot;:&quot;337-receipts-and-refunds&quot;,&quot;url&quot;:&quot;/help/category/337-receipts-and-refunds&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Accessing your purchase&quot;,&quot;slug&quot;:&quot;219-after-your-purchase&quot;,&quot;url&quot;:&quot;/help/category/219-after-your-purchase&quot;},{&quot;title&quot;:&quot;Before you buy&quot;,&quot;slug&quot;:&quot;220-before-you-buy&quot;,&quot;url&quot;:&quot;/help/category/220-before-you-buy&quot;},{&quot;title&quot;:&quot;Receipts and refunds&quot;,&quot;slug&quot;:&quot;337-receipts-and-refunds&quot;,&quot;url&quot;:&quot;/help/category/337-receipts-and-refunds&quot;},{&quot;title&quot;:&quot;Issues with your purchase&quot;,&quot;slug&quot;:&quot;338-issues-with-your-purchase&quot;,&quot;url&quot;:&quot;/help/category/338-issues-with-your-purchase&quot;}],&quot;_inertia_meta&quot;:[{&quot;tagName&quot;:&quot;title&quot;,&quot;headKey&quot;:&quot;title&quot;,&quot;innerContent&quot;:&quot;How do I get a refund? - Gumroad Help Center&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf
