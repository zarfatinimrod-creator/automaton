    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;8mv/jM0SKKWhIaQrZ4viLVCICRWnGy692PodvbJ68m0=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;SMx-99EM0He35_iYGDq1cVXbD70DIYvvueL_499C-Ga7SqaylPAnQbQkpHUTE2Y8RCkaRdgmH3W4GcGT2XK2nA&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Issuing a refund - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Issuing a refund&quot;,&quot;slug&quot;:&quot;47-how-to-refund-a-customer&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003e\u003cstrong\u003eIn this article:\u003c/strong\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#full\&quot;\u003eFull refund\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#partial\&quot;\u003ePartial refund\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#paypal\&quot;\u003ePayPal refund\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#after\&quot;\u003eAfter issuing a refund\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Refund-fees-hk-4p\&quot;\u003eRefund fees\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cbr\u003e\n  \u003cdiv class=\&quot;callout-red\&quot;\u003e\n    \u003cp\u003eRefunds can only be processed if your balance is able to cover the transaction amount. If your balance is too low you will need to make additional sales until the refund can be issued.\u003c/p\u003e\n    \u003cp\u003ePlease only issue refunds from your Gumroad dashboard. Our system does not support refunds issued directly from Stripe or PayPal accounts.\u003c/p\u003e\n  \u003c/div\u003e\n  \u003ch3 id=\&quot;full\&quot;\u003eFull refund\u003c/h3\u003e\n  \u003cp\u003eGo to your \u003ca href=\&quot;https://gumroad.com/customers\&quot;\u003eSales dashboard\u003c/a\u003e and click on the sale to open the customer drawer. Then scroll down and click the \u003cstrong\u003eRefund fully\u003c/strong\u003e button:\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/6385991eb3261c24b49eda78/file-v3dx5aMJjS.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eCustomers are refunded in the currency they were charged. Where local-currency payment is supported, customers pay and are refunded in their own currency, and their refund email shows the refunded amount in that currency. For purchases charged in USD, the amount customers receive back in their local currency may be different than what they initially paid due to differences in exchange rates.\u003c/p\u003e\n  \u003ch3 id=\&quot;partial\&quot;\u003ePartial refund\u003c/h3\u003e\n  \u003cp\u003eTo issue a partial refund, enter the amount to be refunded in the ‘Refund’ box and click \u003cstrong\u003eIssue partial refund\u003c/strong\u003e.  \u003c/p\u003e\n  \u003cp\u003eYour customer will still have access to their content after a partial refund.\u003c/p\u003e\n  \u003cp\u003eIf it is a Membership that is pending cancellation and has &#39;Members will lose access when their Membership ends&#39; toggled on, issuing a partial refund will end the Membership and revoke the customer&#39;s access.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/62469f0eab585b230a8a7601/file-nnUgqbE3pw.gif\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3 id=\&quot;paypal\&quot;\u003ePayPal refund\u003c/h3\u003e\n  \u003cp\u003eIf you refund a \u003ca href=\&quot;275-paypal-connect\&quot;\u003ePayPal Connect\u003c/a\u003e purchase, PayPal keeps its fees on the sale but refunds 100% of the amount to the customer. In this case, you would be responsible for Gumroad and PayPal&#39;s fees.\u003c/p\u003e\n  \u003ch3 id=\&quot;after\&quot;\u003eAfter issuing a refund\u003c/h3\u003e\n  \u003cp\u003eCustomers receive an email confirmation after a refund is issued. Credit card funds usually take 5-10 business days to appear on the buyer’s account while PayPal refunds are immediate. \u003c/p\u003e\n  \u003cp\u003eIn the case of a full refund, customers will no longer be able to access the content or receive the respective product’s updates.\u003c/p\u003e\n  \u003cp\u003eRefunding a customer fully will also delete any \u003ca href=\&quot;222-product-ratings-on-gumroad\&quot;\u003eproduct rating\u003c/a\u003e they&#39;ve given.\u003c/p\u003e\n  \u003ch3 id=\&quot;Refund-fees-hk-4p\&quot;\u003eRefund fees\u003c/h3\u003e\n  \u003cp\u003eWhen a sale is refunded (fully or partially), your customer receives the full refunded amount, and Gumroad&#39;s own \u003ca href=\&quot;https://gumroad.com/help/article/66-gumroads-fees\&quot;\u003efee\u003c/a\u003e on the refunded portion is returned to you. The underlying payment-processing portion of the fee is retained, because payment processors do not return it to Gumroad on a refund.\u003c/p\u003e\n  \u003cp\u003eSales processed through your own connected payment account work differently: for \u003ca href=\&quot;330-stripe-connect\&quot;\u003eStripe Connect\u003c/a\u003e and \u003ca href=\&quot;275-paypal-connect\&quot;\u003ePayPal Connect\u003c/a\u003e purchases, the processor keeps its fees on the sale, and you are responsible for Gumroad&#39;s and the processor&#39;s fees on the refund.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;51-what-is-gumroads-refund-policy\&quot;\u003e\u003cspan\u003eGumroad&#39;s refund policy\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;42-content-security\&quot;\u003e\u003cspan\u003eContent protection on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&quot;:&quot;Market your work&quot;,&quot;slug&quot;:&quot;328-market-your-work&quot;,&quot;url&quot;:&quot;/help/category/328-market-your-work&quot;}],&quot;_inertia_meta&quot;:[
