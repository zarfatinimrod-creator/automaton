    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;nKrTL3KH0LL6Aj+ysmnjuIOJVwYN6S1t3bPza/H97EM=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;o5eatemgtOxP0FmFmZY3v4Sxvqa7Cu63G73_zVmWls22CJJe2Km5F_nVjhBRbF0lwRPxego4eqI_Ocsfhgj1mw&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Set a custom refund policy - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Set a custom refund policy&quot;,&quot;slug&quot;:&quot;335-custom-refund-policy&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003eYou can set a custom refund policy by adding it to your product settings. Be clear about the conditions—whether it&#39;s a 30-day money-back guarantee or a firm no-refunds policy. This helps your customers know what to expect and allows Gumroad Support to issue refunds (or not) on your behalf. We also include your policy in any credit card or PayPal dispute, providing an extra layer of protection for your business. A no-refunds policy does not override the \u003ca href=\&quot;51-what-is-gumroads-refund-policy\&quot;\u003eBrazil 7-day withdrawal\u003c/a\u003e we honor for Brazilian consumers on website purchases processed by Gumroad.\u003c/p\u003e\n  \u003ch3\u003eAdding a refund policy\u003c/h3\u003e\n  \u003cp\u003eOn the product edit page, under the Settings section of the Product tab, toggle \u003cb\u003eSpecify a refund policy for this product\u003c/b\u003e. From here, you can add a refund policy (and optional fine print) or copy a refund policy from another product to save time. \u003c/p\u003e\n  \u003cp style=\&quot;\&quot; class=\&quot;\&quot;\u003e\u003cimg src=\&quot;https://assets.gumroad.com/images/help_center/product-level-refund-policy-edit.png\&quot; /\u003e\u003c/p\u003e\n  \u003cp\u003eThe refund policy will be shown on the product page. If fine print is provided, the policy will be clickable and the details will be displayed to the customer in a modal:\u003c/p\u003e\n  \u003cp style=\&quot;\&quot; class=\&quot;\&quot;\u003e\u003cimg src=\&quot;https://assets.gumroad.com/images/help_center/product-level-refund-policy-modal.png\&quot; /\u003e\u003c/p\u003e\n  \u003cp\u003eTo remove the refund policy, simply switch off the toggle and save the product. \u003c/p\u003e\n  \u003ch3\u003e\u003cb\u003eSharing a refund policy\u003c/b\u003e\u003c/h3\u003e\n  \u003cp\u003eWhen the policy modal is visible on the product page, the product&#39;s URL contains an anchor so you can share that URL with customers to send them directly to the refund policy.\u003c/p\u003e\n  \u003cp style=\&quot;\&quot; class=\&quot;\&quot;\u003e\n    \u003cvideo src=\&quot;help/images/product-level-refund-policy-share.mp4\&quot; style=\&quot;width: 100%; max-width: 100%;\&quot; autoplay loop muted playsinline\u003e\u003c/video\u003e\n  \u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;51-what-is-gumroads-refund-policy\&quot;\u003e\u003cspan\u003eGumroad&#39;s refund policy\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;47-how-to-refund-a-customer\&quot;\u003e\u003cspan\u003eIssuing a refund\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&quot;:&quot;Market your work&quot;,&quot;slug&quot;:&quot;328-market-your-work&quot;,&quot;url&quot;:&quot;/help/category/328-market-your-work&quot;}],&quot;_inertia_meta&quot;:[{&quot;tagName&quot;:&quot;title&quot;,&quot;headKey&quot;:&quot;title&quot;,&quot;innerContent&quot;:&quot;Set a custom refund policy - Gumroad Help Center&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-param&quot;,&quot;name&quot;:&quot;csrf-param&quot;,&quot;content&quot;:&quot;authenticity_token&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-token&quot;,&quot;name&quot;:&quot;csrf-token&quot;,&quot;content&quot;:&quot;BnBZlzn3pp1giH4YVaNE_jgq
