    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;iTkdvm5V8w7bPTQQM04HZ3m7mOxC7xOGSjNQkQp83Q0=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;BQ4y9FjqRC-3ljoPrQRMjaiYH-eECa7c2jjxwfBIYIgV_soCHyCZ9Zt6aAv_ajzFBAF09cjM8GosxuoQhfLyeg&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Gumroad&#39;s refund policy - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Gumroad&#39;s refund policy&quot;,&quot;slug&quot;:&quot;51-what-is-gumroads-refund-policy&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003eEvery seller has their own unique needs and principles when it comes to issuing refunds, therefore Gumroad allows and encourages its sellers to \u003ca href=\&quot;335-custom-refund-policy\&quot;\u003eset their own refund policies\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003eThat said, Gumroad reserves the right to issue refunds within 90 days of purchase, at its discretion, to prevent chargebacks. If Gumroad support refunds a sale on your behalf, we&#39;ll email you to let you know, along with the reason for the refund.\u003c/p\u003e\n  \u003cp\u003eSeparately, if the buyer is a consumer in Brazil and the sale is a website purchase processed by Gumroad, Brazilian law (Consumer Protection Code, Article 49) gives them 7 days from delivery to withdraw from a distance purchase, including digital products. We honor that request even when the product is set to no refunds, and we will email you if we refund a sale on that basis. In-app purchases are refunded by Apple or Google, not by Gumroad.\u003c/p\u003e\n  \u003cp\u003eThat said, you can set a \&quot;no-refunds\&quot; policy, but card networks still allow customers to file \u003ca href=\&quot;134-how-does-gumroad-handle-chargebacks\&quot;\u003echargebacks\u003c/a\u003e at any time. \u003cstrong\u003eToo many successful disputes can put your Gumroad account at risk of suspension\u003c/strong\u003e, even if your policy is clearly stated. \u003c/p\u003e\n  \u003cp\u003eIf more than 1% of your customers dispute their purchases, Gumroad enforces a refund policy on your entire account. This rate counts unique customers rather than individual sales, so several disputed charges from the same customer email (for example, both installments of the same purchase) count once. Purchases made with different email addresses count separately. If your account is set to \&quot;No refunds allowed\&quot; at that point, we automatically update it to a 30-day money-back guarantee; refund policies you already offer of 7 days or more stay as they are. While a policy is enforced, it applies to your whole account and can&#39;t be edited in Settings. To request a different refund period of at least 7 days, contact us with the specific steps you&#39;ve taken to reduce disputes, and we&#39;ll apply the change for you. We&#39;ll email you if a policy is enforced, and refunding customers who ask is the fastest way to bring your dispute rate back down.\u003c/p\u003e\n  \u003cp\u003eIf a customer is threatening a chargeback, we recommend that you offer them a \u003ca href=\&quot;47-how-to-refund-a-customer#partial\&quot;\u003epartial refund\u003c/a\u003e using the feature we&#39;ve provided you with. \u003c/p\u003e\n  \u003cp\u003eLearn more about our terms \u003ca href=\&quot;http://www.gumroad.com/terms\&quot;\u003ehere\u003c/a\u003e.\u003c/p\u003e\n  \u003cp\u003eAnd learn more about chargebacks \u003ca href=\&quot;134-how-does-gumroad-handle-chargebacks\&quot; rel=\&quot;nofollow\&quot;\u003ehere\u003c/a\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;47-how-to-refund-a-customer\&quot;\u003e\u003cspan\u003eIssuing a refund\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;134-how-does-gumroad-handle-chargebacks\&quot;\u003e\u003cspan\u003eChargebacks on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/
