    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;taCsUibFCdEblnOAKlvUCOumOwOEXsR45gaNt4TvG4A=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;AK7L193GCbuv7p95V76u3bObJR_5Q8N4HNN3LqFplRAAJrmoBdAZRAuD-AsQ2ZuuaHh6d0TmcH4kFHYkIu6GvA&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;I need an invoice - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;I need an invoice&quot;,&quot;slug&quot;:&quot;194-i-need-an-invoice&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003e\u003cstrong\u003eIn this article:\u003c/strong\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#How-to-generate-your-invoice-from-the-receipt-wpmBD\&quot; target=\&quot;_self\&quot;\u003eHow to generate your invoice from the receipt\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Generate-your-invoice-from-the-download-page-nT8vR\&quot; target=\&quot;_self\&quot;\u003eGenerate your invoice from the download page\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#VAT-ID-Erp7a\&quot; target=\&quot;_self\&quot;\u003eVAT ID\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Refunded-purchases-mQx4T\&quot; target=\&quot;_self\&quot;\u003eRefunded purchases\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Dont-have-your-receipt-Kger0\&quot; target=\&quot;_self\&quot;\u003eDon&#39;t have your receipt?\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#Older-purchases-II5BZ\&quot; target=\&quot;_self\&quot;\u003eOlder purchases\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#No-W9-KSAkH\&quot; target=\&quot;_self\&quot;\u003eNo W9?\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;How-to-generate-your-invoice-from-the-receipt-wpmBD\&quot;\u003eHow to generate your invoice from the receipt\u003c/h3\u003e\n  \u003cp\u003eYou can print your own invoice by clicking the Generate link at the bottom of your receipt.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/65b0e4b487e88924b5fa2015/file-5q7QumzVdW.png\&quot; /\u003e\u003c/figure\u003e\n  \u003cp\u003eYou&#39;ll be sent to Gumroad&#39;s Invoice generator where you can enter your full name and business or personal address. Next, click “Download”, and the invoice will download as a PDF.\u003c/p\u003e\n  \u003cp\u003eIf you need to add optional notes such as your business&#39; specific information or invoice numbers, you can do that in the additional notes field.\u003c/p\u003e\n  \u003cfigure\u003e\u003cimg src=\&quot;https://d33v4339jhl8k0.cloudfront.net/docs/assets/5c4657ad2c7d3a66e32d763f/images/65b0e50587e88924b5fa2016/file-mIRJJ1LKxj.png\&quot; /\u003e\u003c/figure\u003e\n  \u003ch3 id=\&quot;Generate-your-invoice-from-the-download-page-nT8vR\&quot;\u003eGenerate your invoice from the download page\u003c/h3\u003e\n  \u003cp\u003eYou can also start from the product&#39;s download page, without opening the receipt first. Open the product from your \u003ca href=\&quot;http://gumroad.com/library\&quot; target=\&quot;_blank\&quot;\u003eLibrary\u003c/a\u003e or from the download link in your receipt email, expand the Receipt section, and click \&quot;Generate invoice\&quot;. That takes you to the same invoice generator.\u003c/p\u003e\n  \u003cp\u003eThe link only appears when there is something to invoice, so a free download or a membership free trial does not show it. If you bought the product as part of a bundle, the invoice covers the bundle purchase you actually paid for.\u003c/p\u003e\n  \u003cp\u003eFor a membership, \&quot;View receipt\&quot; and \&quot;Generate invoice\&quot; cover your most recent payment that was not fully refunded or charged back, not your original sign-up, so the invoice shows that period&#39;s date, amount, and card. If your latest renewal was fully refunded or charged back, the links move to the newest payment before it. They fall back to your sign-up purchase when you have no such payment, and also when that payment belongs to someone else&#39;s email address — a membership bought for you as a gift, for example.\u003c/p\u003e\n  \u003ch3 id=\&quot;VAT-ID-Erp7a\&quot;\u003eVAT ID\u003c/h3\u003e\n  \u003cp\u003eIf you paid VAT and you&#39;re a business in the EU, you can also enter your VAT registration number and automatically process a refund for the VAT you paid. The VAT refund will take 2-3 days to arrive at your credit card or PayPal account. The invoice will display without VAT.\u003c/p\u003e\n  \u003cp\u003ePlease note that everything you need on your invoice should be written in the custom text box called \&quot;Additional notes\&quot; when you generate your invoice. Gumroad Support doesn&#39;t have the capability to change or adjust invoices, so be sure to add anything your tax office might need.\u003c/p\u003e\n  \u003ch3 id=\&quot;Refunded-purchases-mQx4T\&quot;\u003eRefunded purchases\u003c/h3\u003e\n  \u003cp\u003eIf your purchase has been refunded, the invoice you generate reflects that. The payment total shows the amount you actually paid after refunds (so a fully refunded purchase shows a zero total), and a \&quot;Refund status\&quot; line appears under the payment total reading \&quot;Fully refunded\&quot; or \&quot;Partially refunded\&quot;, along with the date of the most recent refund. This lets you use the regenerated invoice as documentation of the refund for your books.\u003c/p\u003e\n  \u003ch3 id=\&quot;Dont-have-your-receipt-Kger0\&quot;\u003eDon&#39;t have your receipt?\u003c/h3\u003e\n  \u003cp\u003ePlease see \u003ca href=\&quot;212-i-never-received-a-receipt\&quot; target=\&quot;_self\&quot;\u003ethis article\u003c/a\u003e if you are unable to find your receipt.\u003c/p\u003e\n  \u003ch3 id=\&quot;Older-purchases-II5BZ\&quot;\u003eOlder purchases\u003c/h3\u003e\n  \u003cp\u003eIf you have products in your Library from purchases made long, long ago, simply open up those products in your \u003ca href=\&quot;http://gumroad.com/library\&quot; target=\&quot;_blank\&quot;\u003eLibrary\u003c/a\u003e and hit \&quot;View receipt\&quot;\u003c/p\u003e\n  \u003ch3 id=\&quot;No-W9-KSAkH\&quot;\u003eNo W9?\u003c/h3\u003e\n  \u003cp\u003eBecause Gumroad is a C Corporation, we do not issue W9s to customers. As a C Corporation, you are not required to send us 1099s for your purchases on our site.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;200-i-need-a-vat-refund\&quot;\u003e\u003cspan\u003eI need a VAT refund\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;212-i-never-received-a-receipt\&quot;\u003e\u003cspan\u003eI never received a receipt\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Receipts and refunds&quot;,&quot;slug&quot;:&quot;337-receipts-and-refunds&quot;,&quot;url&quot;:&quot;/help/category/337-receipts-and-refunds&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Accessing your purchase&quot;,&quot;slug&quot;:&quot;219-after-your-purchase&quot;,&quot;url&quot;:&quot;/help/category/219-after-your-purchase&quot;},{&quot;title&quot;:&quot;Before you buy&quot;,&quot;slug&quot;:&quot;220-before-you-buy&quot;,&quot;url&quot;:&quot;/help/category/220-before-you-buy&quot;},{&quot;title&quot;:&quot;Receipts and refunds&quot;,&quot;slug&quot;:&quot;337-receipts-and-refunds&quot;,&quot;url&quot;:&quot;/help/category/337-receipts-and-refunds&quot;},{&quot;title&quot;:&quot;Issues with your purchase&quot;,&quot;slug&quot;:&quot;338-issues-with-your-purchase&quot;,&quot;url&quot;:&quot;/help/category/338-issues-with-your-purchase&quot;}],&quot;_inertia_meta&quot;:[{&quot;tagName&quot;:&quot;title&quot;,&quot;headKey&quot;:&quot;title&quot;,&quot;innerContent&quot;:&quot;I need an invoice - Gumroad Help Center&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-param&quot;,&quot;name&quot;:&quot;csrf-param&quot;,&quot;content&quot;:&quot;authenticity_token&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-token&quot;,&quot;name&quot;:&quot;csrf-token&quot;,&quot;content&quot;:&quot;DSJbtnirkIrjl5RdnpI03Bps227vhez7rkxLFfBMliENqinJoL2AdUf68y_Z9QGvwY-EBlIgX_2Wi0ofc8uFjQ&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-charset&quot;,&quot;charset&quot;:&quot;utf-8&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-property-fb-app_id&quot;,&quot;property&quot;:&quot;fb:app_id&quot;,&quot;content&quot;:&quot;149071038533330&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-property-fb-page_id&quot;,&quot;property&quot;:&quot;fb:page_id&quot;,&quot;content&quot;:&quot;http://www.facebook.com/gumroad&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-property-gr-environment&quot;,&quot;property&quot;:&q
