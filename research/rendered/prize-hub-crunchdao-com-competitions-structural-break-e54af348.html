inline\"\u003e1\u003c/code\u003e, reflecting cumulative confidence that a structural break has already occurred - \u003ccode class=\"inline\"\u003e0\u003c/code\u003e if absolutely confident no break has occurred, \u003ccode class=\"inline\"\u003e1\u003c/code\u003e if absolutely confident a break has already occurred.\u003c/p\u003e\n\n\u003cp\u003eThe training data (with known structural break locations) combines a large collection of synthetic and real-world time series exhibiting a wide variety of break types - including changes in mean, variance, distributional shape, and dependence structure.\u003c/p\u003e\n\n\u003cp\u003eSubmissions are evaluated on an independent test set using the Time-Stratified AUC (\u003ccode class=\"inline\"\u003eTS-AUC\u003c/code\u003e): at each online time step, a standard AUC is computed cross-sectionally across all series, and the weighted average over time steps is the final score.\u003c/p\u003e\n\n\u003ch2 id=\"differences-from-the-2025-edition\"\u003eDifferences from the 2025 Edition\u003c/h2\u003e\n\n\u003cp\u003eIf you participated in the 2025 edition, the core concept is the same, but the mechanics are fundamentally different:\u003c/p\u003e\n\n\u003ctable\u003e\n  \u003cthead\u003e\n    \u003ctr\u003e\n      \u003cth\u003e      \u003c/th\u003e\n      \u003cth\u003e2025      \u003c/th\u003e\n      \u003cth\u003e2026 (this one)      \u003c/th\u003e\n    \u003c/tr\u003e\n  \u003c/thead\u003e\n  \u003ctbody\u003e\n    \u003ctr\u003e\n      \u003ctd\u003e\n        \u003cp\u003eData delivery\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003eBoth segments given at once\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003eOnline segment arrives \u003cb\u003eone step at a time\u003c/b\u003e\u003c/p\u003e\n      \u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n      \u003ctd\u003e\n        \u003cp\u003eBreak location\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003eAlways at the known boundary\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003e\u003cb\u003eUnknown\u003c/b\u003e -- anywhere in the online segment\u003c/p\u003e\n      \u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n      \u003ctd\u003e\n        \u003cp\u003eOutput\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003eOne score per series\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003e\u003cb\u003eOne score per time step\u003c/b\u003e\u003c/p\u003e\n      \u003c/td\u003e\n    \u003c/tr\u003e\n  \u003c/tbody\u003e\n\u003c/table\u003e\n\n\n\u003cp\u003eThis edition mirrors a realistic monitoring scenario: you watch a stream of data and, after each new observation, you report how confident you are that the process has already changed.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"3c:T543,\n\u003cp\u003eA \u003cb\u003estructural break\u003c/b\u003e occurs when the statistical behaviour of a time series changes permanently at some point in time. Before the break, the data follows one process; from the break onwards, it follows a different one.\u003c/p\u003e\n\n\u003cp\u003eThe figure below shows a simple example: the series has a constant mean before the break and a different mean after it. The dashed line marks the break time.\u003c/p\u003e\n\n\u003cdiv\u003e\n  \u003cfigure\u003e    \u003cimg src=\"https://3895192033-files.gitbook.io/~/files/v0/b/gitbook-x-prod.appspot.com/o/spaces%2FrZv71uKEauXe2J8CJm1h%2Fuploads%2FQwZ0oIDTkhPOrgT8rwZK%2Fdgp_example.png?alt=media\u0026token=020aeeb1-c3c9-4ac0-acdf-d215e5124091\" /\u003e    \u003cfigcaption\u003e\n    \u003cp\u003eExample: a time series with a structural break.\u003c/p\u003e\n    \u003c/figcaption\u003e  \u003c/figure\u003e\n\u003c/div\u003e\n\n\u003cp\u003eStructural breaks appear in many domains:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eClimatology:\u003c/b\u003e shifts in weather patterns that may signal climate anomalies or long-term change.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eIndustry:\u003c/b\u003e changes in machinery sensor readings that anticipate equipment failures or maintenance needs.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eHealthcare:\u003c/b\u003e sudden changes in physiological signals that may indicate critical health events.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eFinance:\u003c/b\u003e shifts in market or strategy behaviour relevant to risk management and portfolio decisions.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n3d:Td15,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eThe dataset contains a large and diverse collection of univariate time series exhibiting many different kinds of structural breaks -- changes in mean, variance, distribution shape, correlation structure, and more. All series are pre-processed into a common z-scored format.\u003c/p\u003e\n\n\u003cp\u003eEach series is split into two parts, a \u003cb\u003ehistorical segment\u003c/b\u003e and an \u003cb\u003eonline segment\u003c/b\u003e.\u003c/p\u003e\n\n\u003cdiv\u003e\n  \u003cfigure\u003e    \u003cimg src=\"https://3895192033-files.gitbook.io/~/files/v0/b/gitbook-x-prod.appspot.com/o/spaces%2FrZv71uKEauXe2J8CJm1h%2Fuploads%2F4EtFVn376EJvemHrgNm4%2Fcompetition_overview.png?alt=media\u0026token=ca8634c9-6e9c-4a90-8ef6-cbc937a45e31\" /\u003e    \u003cfigcaption\u003e\n    \u003cp\u003eTime series structure\u003c/p\u003e\n    \u003c/figcaption\u003e  \u003c/figure\u003e\n\u003c/div\u003e\n\n\u003ch2 id=\"historical-segment\"\u003e\u003cb\u003eHistorical segment\u003c/b\u003e\u003c/h2\u003e\n\n\u003cp\u003eThe \u003cb\u003ehistorical segment\u003c/b\u003e is a long reference sequence provided to you in full at the start, typically between 1,000 and 5,000 observations. It represents the behaviour of the series before any potential break.\u003c/p\u003e\n\n\u003ch2 id=\"online-segment\"\u003eOnline segment\u003c/h2\u003e\n\n\u003cp\u003eThe \u003cb\u003eonline segment\u003c/b\u003e follows the historical segment and is revealed to you \u003cb\u003eone observation at a time, \u003c/b\u003etypically between 10 and 1,000 observations long.\u003c/p\u003e\n\n\u003cp\u003eAfter you submit your score for the current observation, the next one is released. There is no way to look ahead.\u003c/p\u003e\n\n\u003cp\u003eEach series contains \u003cb\u003eat most one\u003c/b\u003e structural break, and the historical segment is always break-free.\u003c/p\u003e\n\n\u003cp\u003eAny break, if present, falls somewhere within the online segment:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eWith probability \u003ccode class=\"inline\"\u003e0.5\u003c/code\u003e, a break occurs at some unknown point within the online segment. You must infer its position from the data.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eWith probability \u003ccode class=\"inline\"\u003e0.5\u003c/code\u003e, no break occurs during the online segment at all.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2 id=\"break-position\"\u003eBreak position\u003c/h2\u003e\n\n\u003cp\u003eFor the training set only, the \u003cb\u003ebreak position\u003c/b\u003e \u003ccode class=\"inline\"\u003etau\u003c/code\u003e is a 0-indexed position within the online segment at which the break occurs, or \u003ccode class=\"inline\"\u003eNone\u003c/code\u003e if no break occurs.\u003c/p\u003e\n\n\u003ch2 id=\"data-size\"\u003eData Size\u003c/h2\u003e\n\n\u003cp\u003eThe dataset is divided into multiple parts:\u003c/p\u003e\n\n\u003ctable\u003e\n  \u003cthead\u003e\n    \u003ctr\u003e\n      \u003cth\u003eSplit      \u003c/th\u003e\n      \u003cth\u003eAvailability      \u003c/th\u003e\n      \u003cth\u003eNumber of series      \u003c/th\u003e\n    \u003c/tr\u003e\n  \u003c/thead\u003e\n  \u003ctbody\u003e\n    \u003ctr\u003e\n      \u003ctd\u003e\n        \u003cp\u003ePublic training set\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003eLocal \u0026 Cloud\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003e10,000\u003c/p\u003e\n      \u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n      \u003ctd\u003e\n        \u003cp\u003ePublic \u003cb\u003e(reduced)\u003c/b\u003e test set\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003eLocal\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003e100\u003c/p\u003e\n      \u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n      \u003ctd\u003e\n        \u003cp\u003ePublic test set\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003eCloud\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003e10,000\u003c/p\u003e\n      \u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n      \u003ctd\u003e\n        \u003cp\u003ePrivate test set\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003eCloud\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003e10,000\u003c/p\u003e\n      \u003c/td\u003e\n    \u003c/tr\u003e\n  \u003c/tbody\u003e\n\u003c/table\u003e\n\n\n\u003cp\u003e\u003cspan class=\"tooltip\"\u003e\u003cspan class=\"tooltip-trigger\"\u003eTrue values\u003c/span\u003e\u003cspan class=\"tooltip-content\"\u003e\n\u003cspan\u003eAlso known as Y train/test.\u003c/span\u003e\n\u003c/span\u003e\u003c/span\u003e are only available for the training set (both locally and in the cloud) and the reduced test set (only locally).\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"3e:T8b4,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eThe competition uses a single metric: \u003cb\u003eTime-Stratified \u003c/b\u003e\u003ca target=\"_blank\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.roc_auc_score.html\"\u003e\u003cb\u003eAUC\u003c/b\u003e\u003c/a\u003e\u003cb\u003e (TS-AUC)\u003c/b\u003e.\u003c/p\u003e\n\n\u003cp\u003eAt each online time step \u003cimg alt=\"t\" class=\"math size-line\" src=\"https://wikimedia.org/api/rest_v1/media/math/render/svg/a69220aabe3435c83e275b3757b11461fcc261c1\" /\u003e, the metric computes a standard AUC cross-sectionally across all series alive at that step:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eA series is \u003cb\u003epositive\u003c/b\u003e at step \u003cimg alt=\"t\" class=\"math size-line\" src=\"https://wikimedia.org/api/rest_v1/media/math/render/svg/a69220aabe3435c83e275b3757b11461fcc261c1\" /\u003e, if the break has already occurred by that step (ideal score = \u003ccode class=\"inline\"\u003e1\u003c/code\u003e).\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eA series is \u003cb\u003enegative\u003c/b\u003e at step \u003cimg alt=\"t\" class=\"math size-line\" src=\"https://wikimedia.org/api/rest_v1/media/math/render/svg/a69220aabe3435c83e275b3757b11461fcc261c1\" /\u003e, otherwise (ideal score = \u003ccode class=\"inline\"\u003e0\u003c/code\u003e).\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThe TS-AUC is the weighted average of these per-step AUCs, with weight \u003cimg alt=\"w(t) = n_\\text{pos}(t) \\cdot n_\\text{neg}(t)\" class=\"math size-line\" src=\"https://wikimedia.org/api/rest_v1/media/math/render/svg/1acb5527af2e33361451b8d646330827f0f435c5\" /\u003e (the number of positive-negative pairs at step \u003cimg alt=\"t\" class=\"math size-line\" src=\"https://wikimedia.org/api/rest_v1/media/math/render/svg/a69220aabe3435c83e275b3757b11461fcc261c1\" /\u003e):\u003c/p\u003e\n\n\u003cimg alt=\"\\text{TS-AUC} = \\frac{\\sum_t w(t)\\,\\text{AUC}(t)}{\\sum_t w(t)}\" class=\"math\" src=\"https://wikimedia.org/api/rest_v1/media/math/render/svg/af0948fa1b991dbe7ee60a7355f87efc12f643f0\" /\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003e0.5\u003c/code\u003e: equivalent to random guessing.\u003cbr /\u003eTo score above 0.5, a predictor must use the content of the series: at every fixed \u003cimg alt=\"t\" class=\"math size-line\" src=\"https://wikimedia.org/api/rest_v1/media/math/render/svg/a69220aabe3435c83e275b3757b11461fcc261c1\" /\u003e, the metric compares series against each other, so a score that does not depend on the series cannot discriminate.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003e1.0\u003c/code\u003e: perfect detection.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n"])</script><script>self.__next_f.push([1,"3f:T2a39,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eThis is a code competition where participants are required to submit their Python code (files or notebooks) directly to the Crunch Hub.\u003c/p\u003e\n\n\u003cp\u003eYour submission should:\u003c/p\u003e\n\n\u003col\u003e\n  \u003cli\u003e\n    \u003cp\u003eProcess and analyze the data;\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eOutput a score between \u003ccode class=\"inline\"\u003e0\u003c/code\u003e and \u003ccode class=\"inline\"\u003e1\u003c/code\u003e for each time series steps in the test set, representing the likelihood of a structural break;\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eYour code must produce deterministic output, or it will be ineligible for any rewards;\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eIf you participate as a team, only \u003ca target=\"_blank\" href=\"https://docs.crunchdao.com/competitions/teams#leaders\"\u003ethe team leader\u003c/a\u003e will be ranked on the leaderboard, \u003ca target=\"_blank\" href=\"https://docs.crunchdao.com/competitions/teams/rewards\"\u003erewards are split among all members\u003c/a\u003e.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ol\u003e\n\n\u003cp\u003eYour submitted code will be executed on the platform and automatically scored against a portion of the test set. Shortly after submission, your score will appear on the public leaderboard of the competition.\u003c/p\u003e\n\n\u003cdiv\u003e\n  \u003cfigure\u003e    \u003cimg src=\"https://3895192033-files.gitbook.io/~/files/v0/b/gitbook-x-prod.appspot.com/o/spaces%2FrZv71uKEauXe2J8CJm1h%2Fuploads%2FKZ9o0bW1OQKUuNuDOnsX%2Fcompetition_animation.gif?alt=media\u0026token=b1548613-9631-46fd-9903-e45c0671f777\" /\u003e    \u003cfigcaption\u003e\n    \u003cp\u003eVisual animation.\u003c/p\u003e\n    \u003c/figcaption\u003e  \u003c/figure\u003e\n\u003c/div\u003e\n\n\u003ch2 id=\"interface\"\u003eInterface\u003c/h2\u003e\n\n\u003cp\u003eAt each new online observation, produce a \u003cb\u003escore between \u003c/b\u003e\u003cb\u003e\u003ccode class=\"inline\"\u003e0\u003c/b\u003e\u003c/code\u003e\u003cb\u003e and \u003c/b\u003e\u003cb\u003e\u003ccode class=\"inline\"\u003e1\u003c/b\u003e\u003c/code\u003e representing your cumulative confidence that a structural break has \u003cb\u003ealready occurred\u003c/b\u003e somewhere in the online segment up to and including the current step:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003e\u003ccode class=\"inline\"\u003e0\u003c/b\u003e\u003c/code\u003e: no break detected so far.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003e\u003ccode class=\"inline\"\u003e1\u003c/b\u003e\u003c/code\u003e: a break has definitely already occurred.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou produce one score per time step, so for a series with an online segment of length \u003ccode class=\"inline\"\u003eT\u003c/code\u003e you output \u003ccode class=\"inline\"\u003eT\u003c/code\u003e scores.\u003c/p\u003e\n\n\u003ccode class=\"block\"\u003e\n  \u003cpre\u003edef infer(\u003c/pre\u003e\n\n  \u003cpre\u003e    datasets: Iterable[Tuple[List[float], Iterable[float]]],\u003c/pre\u003e\n\n  \u003cpre\u003e    model_directory_path: str,\u003c/pre\u003e\n\n  \u003cpre\u003e):\u003c/pre\u003e\n\n  \u003cpre\u003e    \u0026quot;\u0026quot;\u0026quot;\u003c/pre\u003e\n\n  \u003cpre\u003e    Load your trained model, then use the `yield` keyword to indicate that it is ready.\u003c/pre\u003e\n\n  \u003cpre\u003e    Then iterate over the datasets and points to provide a result using `yield \u0026lt;prediction\u0026gt;`.\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e    Args:\u003c/pre\u003e\n\n  \u003cpre\u003e        datasets: the data object to iterate.\u003c/pre\u003e\n\n  \u003cpre\u003e        model_directory_path: the path to the directory where you model has been saved in the train function.\u003c/pre\u003e\n\n  \u003cpre\u003e    \u0026quot;\u0026quot;\u0026quot;\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e    model = joblib.load(os.path.join(model_directory_path, 'model.joblib'))\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e    # Mark as ready\u003c/pre\u003e\n\n  \u003cpre\u003e    yield\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e    for x_historical, x_online in datasets:\u003c/pre\u003e\n\n  \u003cpre\u003e        for point in x_online:\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e            # Consume the point (float)\u003c/pre\u003e\n\n  \u003cpre\u003e            result = model.consume(point)\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e            # Provide your result, one at a time\u003c/pre\u003e\n\n  \u003cpre\u003e            yield result\u003c/pre\u003e\n\u003c/code\u003e\n\n\u003cp\u003eThere are a few constraints on the data that will stop your code if you try to ignore them:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eYou must provide your result before you can get the next point from \u003ccode class=\"inline\"\u003ex_online\u003c/code\u003e.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eThe online segment cannot be read twice.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eYou must \u003ccode class=\"inline\"\u003eyield\u003c/code\u003e at each point.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cdiv class=\"hint warning\"\u003e\n  \u003cp\u003eRely on the testing tool to make sure your code is working as intended locally.\u003c/p\u003e\n\u003c/div\u003e\n\n\u003ch2 id=\"requirements\"\u003eRequirements\u003c/h2\u003e\n\n\u003cp\u003eYour solution must include two functions:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003etrain()\u003c/code\u003e: to train your model on the training set.\u003cbr /\u003e\u003ca target=\"_blank\" href=\"https://docs.crunchdao.com/competitions/faqs#can-i-train-a-model-locally\"\u003eYou must provide it if your model requires training\u003c/a\u003e. If not, you can leave it empty.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003einfer()\u003c/code\u003e: to returns predictions on the test set.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThe execution time of your solution should not exceed the platform's time limits: \u003cb\u003e15 hours per week\u003c/b\u003e.\u003c/p\u003e\n\n\u003cp\u003eYour solution must be deterministic: when \u003cspan class=\"tooltip\"\u003e\u003cspan class=\"tooltip-trigger\"\u003e\u003cb\u003ere-run on 10% of the data\u003c/b\u003e\u003c/span\u003e\u003cspan class=\"tooltip-content\"\u003e\n\u003cspan\u003eOnly applies to inference, not training.\u003c/span\u003e\n\u003c/span\u003e\u003c/span\u003e, the predicted values should be the same (within a \u003cb\u003etolerance of 1e-8\u003c/b\u003e).\u003c/p\u003e\n\n\u003ch3 id=\"pre-trained-models\"\u003ePre-trained models\u003c/h3\u003e\n\n\u003cp\u003eIf you submit a pre-trained models without the training code, \u003cspan class=\"background-null text-$danger\"\u003eyour model will be ineligible for rewards\u003c/span\u003e. This includes regular files of unknown origin and very long strings that are decoded at runtime.\u003c/p\u003e\n\n\u003cp\u003eThere multiple ways to remain eligible without having your \u003ccode class=\"inline\"\u003etrain(...)\u003c/code\u003e function called in the cloud environment:\u003c/p\u003e\n\n\u003col\u003e\n  \u003cli\u003e\n    \u003cp\u003eJust don't ask for it: select \u0026quot;No training\u0026quot; on the run creation screen (the last step).\u003cbr /\u003e\u003cimg src=\"https://3895192033-files.gitbook.io/~/files/v0/b/gitbook-x-prod.appspot.com/o/spaces%2FrZv71uKEauXe2J8CJm1h%2Fuploads%2FNpD45hsv1LyYsj9M41N7%2Fimage.png?alt=media\u0026token=91579677-5b91-41f9-b339-b14c836171c8\" class=\"size-original\" /\u003e\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eMake it dead code by voluntarily returning at the first instruction while keeping the original code intact:\u003c/p\u003e\n\n    \u003ccode class=\"block\"\u003e\n      \u003cpre\u003edef train(datasets, model_directory_path):\u003c/pre\u003e\n\n      \u003cpre\u003e    return  # stop right now, ignore the rest\u003c/pre\u003e\n\n      \u003cpre\u003e\u003c/pre\u003e\n\n      \u003cpre\u003e    model = ...  # but still keep the original code\u003c/pre\u003e\n\n      \u003cpre\u003e    model.train(datasets)\u003c/pre\u003e\n\n      \u003cpre\u003e    joblib.dump(model, os.path.join(model_directory_path, \u0026quot;model.joblib\u0026quot;))\u003c/pre\u003e\n    \u003c/code\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eIf your pipeline does not fit well within the \u003ccode class=\"inline\"\u003etrain(...)\u003c/code\u003e function, which force you to use external scripts or notebooks, you will still need to push them. Just add a comment stating where they can be found:\u003c/p\u003e\n\n    \u003ccode class=\"block\"\u003e\n      \u003cpre\u003edef train(datasets, model_directory_path):\u003c/pre\u003e\n\n      \u003cpre\u003e    pass  # available in train_script/train.py\u003c/pre\u003e\n    \u003c/code\u003e\n  \u003c/li\u003e\n\u003c/ol\u003e\n\n\u003ch3 id=\"what-a-good-score-sequence-looks-like\"\u003eWhat a good score sequence looks like\u003c/h3\u003e\n\n\u003cp\u003eThe ideal score is a step function: it stays at \u003ccode class=\"inline\"\u003e0\u003c/code\u003e as long as no break has occurred, then jumps to \u003ccode class=\"inline\"\u003e1\u003c/code\u003e as soon as the break happens. If there is no break, the ideal score is \u003ccode class=\"inline\"\u003e0\u003c/code\u003e throughout.\u003c/p\u003e\n\n\u003cp\u003eThe figure below shows how your detection algorithm's score sequence (solid line) compares to the ideal sequence (dashed step). The shaded area between them reflects how early and how cleanly the break was detected.\u003c/p\u003e\n\n\u003cdiv\u003e\n  \u003cfigure\u003e    \u003cimg src=\"https://3895192033-files.gitbook.io/~/files/v0/b/gitbook-x-prod.appspot.com/o/spaces%2FrZv71uKEauXe2J8CJm1h%2Fuploads%2FbdOsYzHEWzExvKZqHhZN%2Fevaluation_example.png?alt=media\u0026token=091d7334-5d3f-47ad-907e-2ea1dbffed3e\" /\u003e    \u003cfigcaption\u003e\n    \u003cp\u003eEvaluation example.\u003c/p\u003e\n    \u003c/figcaption\u003e  \u003c/figure\u003e\n\u003c/div\u003e\n\n\u003ch2 id=\"computational-note\"\u003eComputational note\u003c/h2\u003e\n\n\u003cp\u003eWith 10,000 series and up to 1,000 online steps each, solutions that recompute everything from scratch at every step may run into time budget constraints.\u003c/p\u003e\n\n\u003cp\u003eIncremental approaches, which are maintaining a compact running state and updating it with each new observation, are worth considering for efficiency, though any solution that fits within the time budget is acceptable.\u003c/p\u003e\n\n\u003ch2 id=\"parallelism\"\u003eParallelism\u003c/h2\u003e\n\n\u003cp\u003eInfering so many points can be slow. That is why we offer a parallel approach, but \u003cb\u003eonly at the time series level\u003c/b\u003e. Your model \u003cb\u003emust still process each point separately\u003c/b\u003e.\u003c/p\u003e\n\n\u003cp\u003eDepending on your model's capacity, the dataset will be split into n equal parts. Your model will start n times \u003cb\u003ein different processes\u003c/b\u003e \u003cspan class=\"tooltip\"\u003e\u003cspan class=\"tooltip-trigger\"\u003e(not threads)\u003c/span\u003e\u003cspan class=\"tooltip-content\"\u003e\n\u003cspan\u003eThis means that memory is not shared. Your running model cannot communicate with other running models.\u003c/span\u003e\n\u003c/span\u003e\u003c/span\u003e, and each process will receive and fully process one part.\u003c/p\u003e\n\n\u003ch3 id=\"how-to-use-it\"\u003eHow to use it\u003c/h3\u003e\n\n\u003cp\u003eTo ensure optimal performance, your model must follow a few restrictions:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eBecause of the concurrency, your model should avoid writing any files.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eMake sure the cloud environment can handle the RAM and CPU consumption of your model.\u003c/p\u003e\n\n    \u003cul\u003e\n      \u003cli\u003e\n        \u003cp\u003eIf you want 6 processes and your model consumes 4 GB of RAM, the runtime must have 4 * 6 = 12 GB of RAM plus some overhead.\u003c/p\u003e\n      \u003c/li\u003e\n\n      \u003cli\u003e\n        \u003cp\u003eThe same applies to CPU cores. Overallocation can actually decrease performance.\u003c/p\u003e\n      \u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou can enable parallel processing by simply specifying the number of workers you want via a global constant:\u003c/p\u003e\n\n\u003ccode class=\"block\"\u003e\n  \u003cpre\u003e# @crunch/keep:on\u003c/pre\u003e\n\n  \u003cpre\u003eINFER_PARALLELISM = 4\u003c/pre\u003e\n\u003c/code\u003e\n\n\u003cdiv class=\"hint info\"\u003e\n  \u003cp\u003eThe \u003ca target=\"_blank\" href=\"https://docs.crunchdao.com/competitions/participate/notebook-processor#automatic-line-commenting\"\u003e\u003ccode class=\"inline\"\u003e@crunch/keep:on\u003c/code\u003e command\u003c/a\u003e is only required for notebook users to prevent the line from being commented out. Keep the constant in a dedicated cell, or add \u003ccode class=\"inline\"\u003e@crunch/keep:off\u003c/code\u003e after the assignation.\u003c/p\u003e\n\u003c/div\u003e\n\n\u003ch3 id=\"known-issues\"\u003eKnown issues\u003c/h3\u003e\n\n\u003col\u003e\n  \u003cli\u003e\n    \u003cp\u003eExceptions and Crashes: When using multiple processes that all print to a single terminal, it is expected that lines will mix with each other. This makes errors harder to debug, as traces cannot be printed properly. We have made sure to report the first error trace, but subsequent errors will be ignored.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eCPU over-allocation: NumPy uses \u003ca target=\"_blank\" href=\"https://github.com/OpenMathLib/OpenBLAS\"\u003eOpenBLAS\u003c/a\u003e behind the scenes to try to parallelize some computations which could potentially conflict with the parallelism mechanism. To help resolve this issue, we recommend using \u003ca target=\"_blank\" href=\"https://pypi.org/project/threadpoolctl/\"\u003ethreadpoolctl\u003c/a\u003e at the correct location(s).\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ol\u003e\n"])</script><script>self.__next_f.push([1,"40:T418,\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eStatistical tests\u003c/b\u003e comparing the distribution of the historical segment to the online observations seen so far (t-tests, KS tests, CUSUM).\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eChange-point detection algorithms\u003c/b\u003e designed for online or streaming data.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eFeature extraction\u003c/b\u003e summarising the online window incrementally, fed into a trained classifier.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eProbabilistic and Bayesian models\u003c/b\u003e tracking the likelihood of a change sequentially.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eDeep learning\u003c/b\u003e models trained to score (series, time step) pairs using the labeled training data.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003cb\u003eFoundation models for time series\u003c/b\u003e pre-trained on large corpora, used as feature extractors or fine-tuned on the labeled training data.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eWhatever approach you choose, the training set provides full supervision: the known break positions let you construct labeled (series, time step) pairs and apply standard binary classification training.\u003c/p\u003e\n41:T585,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eAll prizes are in \u003ca target=\"_blank\" href=\"https://www.usdc.com/\"\u003eUSDC\u003c/a\u003e, a cryptocurrency with the same value as the US dollar.\u003c/p\u003e\n\n\u003ctable\u003e\n  \u003cthead\u003e\n    \u003ctr\u003e\n      \u003cth\u003eWinners’ rank      \u003c/th\u003e\n      \u003cth\u003ePrize value      \u003c/th\u003e\n    \u003c/tr\u003e\n  \u003c/thead\u003e\n  \u003ctbody\u003e\n    \u003ctr\u003e\n      \u003ctd\u003e\n        \u003cp\u003e1st place\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003e$40,000\u003c/p\u003e\n      \u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n      \u003ctd\u003e\n        \u003cp\u003e2nd place\u003c/p\u003e\n      \u003c/td\u003e\n      \u003ctd\u003e\n        \u003cp\u003e$ e\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eWhy is my code slower in the cloud environment?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003e\u003cb\u003eIt depends:\u003c/b\u003e\u003c/p\u003e\n\n  \u003cul\u003e\n    \u003cli\u003e\n      \u003cp\u003eThe cloud environment asks you to predict 10,000 datasets, which is 100 times more than what you were given locally to test your code.\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003eNumPy can sometimes conflict with the parallelism mechanism. See Known Issues.\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003eIf you need more help, you can join us on \u003ca target=\"_blank\" href=\"https://discord.crunchdao.com/\"\u003eDiscord\u003c/a\u003e or in the \u003ca target=\"_blank\" href=\"https://forum.crunchdao.com/\"\u003eForum\u003c/a\u003e.\u003c/p\u003e\n    \u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eI have a question on the competition or the dataset. Where can I ask for help?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003eJoin us on \u003ca target=\"_blank\" href=\"https://discord.crunchdao.com/\"\u003eDiscord\u003c/a\u003e (an account is required) or in the \u003ca target=\"_blank\" href=\"https://forum.crunchdao.com/\"\u003eForum\u003c/a\u003e (a Crunch account is all you need).\u003c/p\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eWhat data is used to compute the mean and standard deviation for standardizing each series?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003e\u003cb\u003eOnly the historical (reference) segment\u003c/b\u003e, not the online period or the full series.\u003c/p\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eIs standardization done separately for each series?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003e\u003cb\u003eYes\u003c/b\u003e, each series is standardized independently.\u003c/p\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eAre the normalization parameters (mean/std) updated once the online period starts?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003e\u003cb\u003eNo\u003c/b\u003e. They are fixed before the online stream begins and never updated afterward.\u003c/p\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eAre real and synthetic series normalized the same way?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003e\u003cb\u003eYes\u003c/b\u003e, both go through the same standardization pipeline.\u003c/p\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eIs the reference window assumed to be free of structural breaks or irregularities?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003e\u003cb\u003eYes and no\u003c/b\u003e: there are no structural breaks by definition (the reference window defines what is \u0026quot;normal\u0026quot;), but there can be irregularities (jumps, etc.).\u003c/p\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eCan I use an AI assistant or LLM to help with the competition?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003e\u003cb\u003eYes\u003c/b\u003e, as long as you don't copy the full dataset into its context.\u003c/p\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eIs it possible to use the dataset from the previous Structural Break competition?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003e\u003cb\u003eYes, but it is not officially encouraged.\u003c/b\u003e The dataset was designed for another type of problem, which does not match this year's objective of finding not \u003ci\u003eIF\u003c/i\u003e, but \u003ci\u003eWHEN\u003c/i\u003e there is a structural break.\u003c/p\u003e\n\n  \u003cp\u003eYou can find the dataset in the \u003ca target=\"_blank\" href=\"https://hub.crunchdao.com/competitions/structural-break/resources/datasets\"\u003eResources section\u003c/a\u003e. Please note that you will also need to accept the rules of the old competition to access the files.\u003c/p\u003e\n\u003c/details\u003e\n\n\n\u003cdetails class=\"expandable\"\u003e\n  \u003csummary\u003e\n    \u003cp\u003eCan I use external data?\u003c/p\u003e\n  \u003c/summary\u003e\n  \u003cp\u003e\u003cb\u003eYes\u003c/b\u003e, but you must be able to grant a license to it, \u003ca target=\"_blank\" href=\"https://hub.crunchdao.com/competitions/structural-break-real-time/rules\"\u003esee 6.3. in the rules\u003c/a\u003e:\u003c/p\u003e\n\n  \u003cul\u003e\n    \u003cli\u003e\n      \u003cp\u003eA third-party dataset uploaded becomes part of the \u0026quot;Participant Submission.\u0026quot;\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003eParticipants must grant CrunchDAO the specified distribution and sublicensing rights.\u003c/p\u003e\n    \u003c/li\u003e\n\n    \u003cli\u003e\n      \u003cp\u003eIf the dataset license prohibits redistribution, participants cannot grant those rights.\u003c/p\u003e\n    \u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003cp\u003eA purchased dataset is acceptable if you have the right to distribute it. However, it would likely be very expensive (at least more expensive than the prize pool).\u003c/p\u003e\n\n\u003chr /\u003e\n\n\u003cp\u003eThe following are already known to not be allowed:\u003c/p\u003e\n\n  \u003cul\u003e\n    \u003cli\u003e\n      \u003cp\u003eYahoo Finance: as they \u003ca target=\"_blank\" href=\"https://help.yahoo.com/kb/finance/exchanges-markets-indices-covered-yahoo-finance-sln2310.html#:~:text=You%20must%20not%20redistribute%20information%20displayed%20on%20
