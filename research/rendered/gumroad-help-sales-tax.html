    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;tU23rT1nN/wGv6ojYh88uyDmjH7QeaTC2cOlsqzSFio=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;X9AXB5YjP5zWZ6TA15CjQIlVRVuL3Wk3pj9nigY_BQuNCQ3_ds7wwxxRlImME-DHmc2lMFolAjixgcIQOnAHbg&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Sales tax on Gumroad - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Sales tax on Gumroad&quot;,&quot;slug&quot;:&quot;121-sales-tax-on-gumroad&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003e\u003cem\u003e\u003cstrong\u003eDisclaimer:\u003c/strong\u003e\u003c/em\u003e\u003cem\u003e This article is neither legal advice nor tax advice. We recommend that you speak to your tax advisor with any questions or concerns about tax reporting.\u003c/em\u003e\u003c/p\u003e\n  \u003ch3\u003eGumroad as Merchant of Record\u003c/h3\u003e\n  \u003cp\u003eGumroad now acts as the Merchant of Record for all sales. This means we automatically handle all sales tax collection and remittance worldwide. You don&#39;t need to manage any tax settings or applications - we take care of everything.\u003c/p\u003e\n  \u003ch3\u003ePhysical products shipped into the EU\u003c/h3\u003e\n  \u003cp\u003eThere is one exception. When a physical product ships to a buyer in an EU country, we do not charge VAT at checkout. A parcel arriving from outside the EU is an import, and the destination country&#39;s customs authority assesses the import VAT itself when the parcel arrives, so the buyer pays it there. Collecting it at checkout as well would mean the buyer pays the same VAT twice.\u003c/p\u003e\n  \u003cp\u003eThis applies to the 27 EU member states. Physical shipments to the United Kingdom, Norway, Australia, and Singapore still have VAT or GST collected at checkout, because those countries allow the marketplace to collect it on lower-value consignments. Higher-value shipments to any country can still be assessed at the border, so check the import rules for the destination country. Digital products are unaffected and still have VAT collected at checkout everywhere it applies.\u003c/p\u003e\n  \u003cp\u003eA bundle counts as a physical shipment when every product inside it is physical, so it is treated the same way. A bundle that mixes physical and digital products still has VAT collected at checkout, because the digital part of that sale is VAT we do owe.\u003c/p\u003e\n  \u003ch3\u003eReseller Certificate\u003c/h3\u003e\n  \u003cp\u003eSome creators may have an obligation to file sales tax (or other indirect tax) returns already, and will need to report their sales on Gumroad as \&quot;sales to other retailers for purposes of resale\&quot;, which are not taxable. To justify this treatment to your tax authority, you will need to download and save \u003ca href=\&quot;/Gumroad-CA-Resale%20Certificate-01JAN25.pdf\&quot;\u003ethis Reseller Certificate\u003c/a\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;66-gumroads-fees\&quot;\u003e\u003cspan\u003eGumroad&#39;s fees\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;10-dealing-with-vat\&quot;\u003e\u003cspan\u003eEU \u0026amp; UK VAT on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;336-singaporean-gst\&quot;\u003e\u003cspan\u003eSingaporean GST on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&quot;:&quot;Market your work&quot;,&quot;slug&quot;:&quot;328-market-your-work&quot;,&quot;url&quot;:&quot;/help/category/328-market-your-work&quot;}],&quot;_inertia_meta&quot;:[{&quot;tagName&quot;:&quot;title&quot;,&quot;headKey&quot;:&quot;title&quot;,&quot;innerContent&quot;:&quot;Sales tax on Gumroad - Gumroad Help Center&quot;},{&quot;tagName&quot;:&quot;meta&quot;,&quot;headKey&quot;:&quot;meta-name-csrf-param&quot;,&quot;name&quot;:&quot;csrf-param&quot;,
