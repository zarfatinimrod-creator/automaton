    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;LlWcJ076kh2bCG8CgM6ZIUkrn5mQGrKiEN2HcbnhMFI=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;nzFlkZVN1WoaVbEm16CrXJ-XOpPA6d9BqbYrQJI-NCNSANkv8IeFffH706_m2P9BK7AUY9_DliY9_V1bVn1_GA&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Gumroad&#39;s fees - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Gumroad&#39;s fees&quot;,&quot;slug&quot;:&quot;66-gumroads-fees&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cbr\u003e\n  \u003ch3 id=\&quot;Gumroads-fees-are-simple--EFxXf\&quot;\u003eGumroad&#39;s fees are simple \u003c/h3\u003e\n  \u003cp\u003eFor sales made on Gumroad&#39;s website, we charge a 10% + $0.50 fee + \u003ca href=\&quot;https://gumroad.com/pricing\&quot;\u003esales tax\u003c/a\u003e per transaction. This does not include: \u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eCredit card processing (2.9% + $0.30)\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;https://www.paypal.com/us/webapps/mpp/merchant-fees\&quot; target=\&quot;_blank\&quot;\u003ePayPal fees\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eSales made through Gumroad&#39;s marketplace (discovery sales via Gumroad.com) are subject to a flat 30% fee, which includes all processing fees.\u003c/p\u003e\n  \u003cp\u003eThere are no monthly payments or other hidden charges.\u003c/p\u003e\n  \u003ch3 id=\&quot;High-volume-discounts-hVd20\&quot;\u003eHigh-volume discounts\u003c/h3\u003e\n  \u003cp\u003eOnce your paid sales in a calendar month reach $20,000, new direct sales that month are 5% + $0.50 instead of 10% + $0.50. This resets on the 1st of each month. There is no application — the lower fee applies automatically. A refund can bring you back under $20,000, in which case new sales return to 10% + $0.50 until you cross it again that month.\u003c/p\u003e\n  \u003cp\u003eThe discount does not change anything else: Discover marketplace sales stay at 30%, the $0.50 per-sale fee stays, and a custom fee already set on your account still takes precedence.\u003c/p\u003e\n  \u003cp\u003eIf you wish to see the exact fees taken out on every sale, you can \u003ca href=\&quot;74-the-analytics-dashboard#sales-csv\&quot;\u003eexport a CSV of your sales\u003c/a\u003e, giving a full breakdown of every sale.\u003c/p\u003e\n  \u003ch3 id=\&quot;Affiliates-sW9pK\&quot;\u003eAffiliates\u003c/h3\u003e\n  \u003cp\u003eFor \u003ca href=\&quot;333-affiliates-on-gumroad\&quot;\u003eaffiliates\u003c/a\u003e, fees on affiliate purchases are split between the affiliate and the creator proportional to the affiliate&#39;s commission. For example, if an affiliate&#39;s commission is 30%, they&#39;ll be responsible for 30% of the fees on the purchase.\u003c/p\u003e\n  \u003ch3 id=\&quot;Refunds-aSEwt\&quot;\u003eRefunds\u003c/h3\u003e\n  \u003cp\u003eWhen a sale is refunded, Gumroad&#39;s own fee on the refunded portion is returned to you; only the underlying payment-processing portion of the fee is retained, because payment processors do not return it on a refund. Sales through your own connected payment account (Stripe Connect or PayPal Connect) work differently. Learn more about refunds \u003ca href=\&quot;https://gumroad.com/help/article/47-how-to-refund-a-customer\&quot;\u003ehere\u003c/a\u003e.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;13-getting-paid\&quot;\u003e\u003cspan\u003eGetting paid by Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;121-sales-tax-on-gumroad\&quot;\u003e\u003cspan\u003eSales tax on Gumroad\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;46-what-currency-does-gumroad-use\&quot;\u003e\u003cspan\u003eWhat currency does Gumroad use?\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n&quot;,&quot;category&quot;:{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;}},&quot;sidebar_categories&quot;:[{&quot;title&quot;:&quot;Open an account&quot;,&quot;slug&quot;:&quot;316-open-an-account&quot;,&quot;url&quot;:&quot;/help/category/316-open-an-account&quot;},{&quot;title&quot;:&quot;Add a product&quot;,&quot;slug&quot;:&quot;318-add-a-product&quot;,&quot;url&quot;:&quot;/help/category/318-add-a-product&quot;},{&quot;title&quot;:&quot;Start selling&quot;,&quot;slug&quot;:&quot;319-start-selling&quot;,&quot;url&quot;:&quot;/help/category/319-start-selling&quot;},{&quot;title&quot;:&quot;Get paid&quot;,&quot;slug&quot;:&quot;320-get-paid&quot;,&quot;url&quot;:&quot;/help/category/320-get-paid&quot;},{&quot;title&quot;:&quot;Advanced&quot;,&quot;slug&quot;:&quot;321-advanced&quot;,&quot;url&quot;:&quot;/help/category/321-advanced&quot;},{&quot;title&quot;:&quot;Contact Gumroad&quot;,&quot;slug&quot;:&quot;322-contact-gumroad&quot;,&quot;url&quot;:&quot;/help/category/322-contact-gumroad&quot;},{&quot;title&quot;:&quot;Market your work&quot;,&quo
