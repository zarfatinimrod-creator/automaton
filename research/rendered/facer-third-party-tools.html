        <script type="application/json" id="data-preloaded">{"topic_86976":"{\"post_stream\":{\"posts\":[{\"id\":187382,\"name\":\"TS Design Watch Faces\",\"username\":\"thosais\",\"avatar_template\":\"/user_avatar/community.facer.io/thosais/{size}/37238_2.png\",\"created_at\":\"2023-08-06T23:42:37.382Z\",\"cooked\":\"\\u003cp\\u003eHello everyone.\\u003cbr\\u003e\\nI’ve been here on Facer for 2 days and I have a question that has probably been asked a number of times, but I couldn’t find it when I searched.\\u003c/p\\u003e\\n\\u003cp\\u003eI’ve been using Samsung’s “Watch Face Studio” software for Wear OS 3 for a few years now and I put my watch faces on Google.\\u003cbr\\u003e\\nNow it’s time, as I think the Facer platform is more beneficial, to get involved here.\\u003c/p\\u003e\\n\\u003cp\\u003eNow to my real question:\\u003cbr\\u003e\\nThe Facer Creator Pro is a fine thing. Is it the only way to create my Watch Faces and upload them here to Facer? Or is there other software that can do this?\\u003c/p\\u003e\\n\\u003cp\\u003eThanks in advance for your assistance.\\u003c/p\\u003e\",\"post_number\":1,\"post_type\":1,\"posts_count\":8,\"updated_at\":\"2023-08-06T23:42:37.382Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":1554,\"reads\":63,\"readers_count\":62,\"score\":7782.6,\"yours\":false,\"topic_id\":86976,\"topic_slug\":\"software-to-create-watch-faces-here-on-facer\",\"display_username\":\"TS Design Watch Faces\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":69551,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\" n_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":4}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":45826,\"hidden\":false,\"trust_level\":3,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":false,\"wiki\":false,\"user_custom_fields\":{\"facer_id\":\"T81SHm4uLl\"},\"post_url\":\"/t/software-to-create-watch-faces-here-on-facer/86976/2\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":4}],\"current_user_reaction\":null,\"reaction_users_count\":4,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":187389,\"name\":\"Tom\",\"username\":\"tom.vannes\",\"avatar_template\":\"/user_avatar/community.facer.io/tom.vannes/{size}/30938_2.png\",\"created_at\":\"2023-08-07T04:37:03.337Z\",\"cooked\":\"\\u003cp\\u003eHi and welcome.\\u003cbr\\u003e\\nYou can either use the Facer software or create watch faces via Browser without the need to download the software. The PRO subscription allows you to do more, such as stop watches and a few things more. To get started, you do not need PRO. Also very valuable is this community and that some folks have opened up their designs for inspection (the little rocket you can see below next to the watch face). This will allow you to see how the designer has created the watch face.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\"lightbox-wrapper\\\"\\u003e\\u003ca class=\\\"lightbox\\\" href=\\\"https://community.facer.io/uploads/default/original/3X/0/3/037c66bac7917b30adc2902fa2eaf46a664ccd8a.png\\\" data-download-href=\\\"https://community.facer.io/uploads/default/037c66bac7917b30adc2902fa2eaf46a664ccd8a\\\" title=\\\"Screenshot 2023-08-07 at 06.32.54\\\"\\u003e\\u003cimg src=\\\"https://community.facer.io/uploads/default/optimized/3X/0/3/037c66ba             <div class='post' itemprop="text">
              <p>Hello everyone.<br>
I’ve been here on Facer for 2 days and I have a question that has probably been asked a number of times, but I couldn’t find it when I searched.</p>
<p>I’ve been using Samsung’s “Watch Face Studio” software for Wear OS 3 for a few years now and I put my watch faces on Google.<br>
Now it’s time, as I think the Facer platform is more beneficial, to get involved here.</p>
<p>Now to my real question:<br>
The Facer Creator Pro is a fine thing. Is it the only way to create my Watch Faces and upload them here to Facer? Or is there other software that can do this?</p>
<p>Thanks in advance for your assistance.</p>
            </div>

              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.facer.io/u/icrltd4'><span itemprop="name">icrltd4</span></a>
                  <meta itemprop='url' content='https://community.facer.io/u/icrltd4'>

              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2023-08-07T00:13:46Z' class='post-time'>

              </span>

            <div class='post' itemprop="text">
              <p>Welcome to the Community, THE best Smartwatch Face Creating Community there is right now, with lots of friendly) helpful people, free resources to download and use as you want, and loads to learn too.<br>
The answer to your question is simple, as yes, the Facer Creator is the only way to make Facer Faces, but it’s also the best.<br>
Hope you have lots of fun here, and please feel free to ask whatever you want…we don’t bite <img src="https://community.facer.io/images/emoji/twitter/grin.png?v=12" title=":grin:" class="emoji" alt=":grin:" loading="lazy" width="20" height="20"></p>

          <div id='post_3' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>

              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.facer.io/u/tom.vannes'><span itemprop="name">tom.vannes</span></a>
                  <meta itemprop='url' content='https://community.facer.io/u/tom.vannes'>
                
              </span>


                <link itemprop="image" href="https://community.facer.io/uploads/default/original/3X/0/3/037c66bac7917b30adc2902fa2eaf46a664ccd8a.png">

              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2023-08-07T04:37:03Z' class='post-time'>

                  </time>
                  <meta itemprop='dateModified' content='2023-08-07T04:37:03Z'>
              <span itemprop="position">3</span>
              </span>

            <div class='post' itemprop="text">
              <p>Hi and welcome.<br>
You can either use the Facer software or create watch faces via Browser without the need to download the software. The PRO subscription allows you to do more, such as stop watches and a few things more. To get started, you do not need PRO. Also very valuable is this community and that some folks have opened up their designs for inspection (the little rocket you can see below next to the watch face). This will allow you to see how the designer has created the watch face.</p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://community.facer.io/uploads/default/original/3X/0/3/037c66bac7917b30adc2902fa2eaf46a664ccd8a.png" data-download-href="https://community.facer.io/uploads/default/037c66bac7917b30adc2902fa2eaf46a664ccd8a" title="Screenshot 2023-08-07 at 06.32.54"><img src="https://community.facer.io/uploads/default/optimized/3X/0/3/037c66bac7917b30adc2902fa2eaf46a664ccd8a_2_390x499.png" alt="Screenshot 2023-08-07 at 06.32.54" data-base62-sha1="uPXzR47DoRnPHXhMIr5k8MnyKm" width="390" height="499" srcset="https://community.facer.io/uploads/default/optimized/3X/0/3/037c66bac7917b30adc2902fa2eaf46a664ccd8a_2_390x499.png, https://community.facer.io/uploads/default/original/3X/0/3/037c66bac7917b30adc2902fa2eaf46a664ccd8a.png 1.5x, https://community.facer.io/uploads/default/original/3X/0/3/037c66bac7917b30adc2902fa2eaf46a664ccd8a.png 2x" data-dominant-color="9A928B"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Screenshot 2023-08-07 at 06.32.54</span><span class="informations">484×620 123 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p>You can check out my <a href="https://www.facer.io/collection/kis-26280c8578?platform=android">inspectable watch faces here</a>.</p>

          <div id='post_4' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>

              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">

            <div class='post' itemprop="text">
              <p>Welcome <a class="mention" href="/u/thosais">@thosais</a> . I found the Downloadable version of Facer a Bit of Bloatware and your work is still saved to the Cloud .As the other guys have Recommended use the Web Base UI . Interesting you coming to have a Look here . Many are moving the Other way .</p>

          <div id='post_5' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.facer.io/u/petruuccios'><span itemprop="name">petruuccios</span></a>
                  <meta itemprop='url' content='https://community.facer.io/u/petruuccios'>
                
              </span>


                <link itemprop="image" href="https://community.facer.io/uploads/default/original/3X/3/f/3f4472ce482574031df3a239d102f865f08875a7.png">

              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2023-08-07T10:12:01Z' class='post-time'>
                    August 7, 2023, 10:12am
                  </time>
                  <meta itemprop='dateModified' content='2023-08-07T11:50:26Z'>
              <span itemprop="position">5</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Hello and welcome. As Tom already mentioned, you do not need PRO subscription to publish faces in general. It is needed to use some features of faces, which are then reserved for the author and premium users. I think also the promo media area is available only to pro subscribers, no matter whether the face uses the pro features or not. I simply like to play with some of these features like stopwatch so much, that I bought me yearly subscription.<br>
