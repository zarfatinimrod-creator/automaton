    <div id="app" data-page="{&quot;component&quot;:&quot;HelpCenter/Articles/Show&quot;,&quot;props&quot;:{&quot;errors&quot;:{},&quot;design_settings&quot;:{&quot;font&quot;:{&quot;name&quot;:&quot;ABC Favorit&quot;,&quot;url&quot;:&quot;https://assets.gumroad.com/fonts/ABCFavorit-Regular.woff2&quot;}},&quot;domain_settings&quot;:{&quot;scheme&quot;:&quot;https&quot;,&quot;app_domain&quot;:&quot;gumroad.com&quot;,&quot;root_domain&quot;:&quot;gumroad.com&quot;,&quot;short_domain&quot;:&quot;gum.co&quot;,&quot;discover_domain&quot;:&quot;gumroad.com&quot;,&quot;third_party_analytics_domain&quot;:&quot;gumroad-analytics.com&quot;,&quot;api_domain&quot;:&quot;api.gumroad.com&quot;},&quot;user_agent_info&quot;:{&quot;is_mobile&quot;:false},&quot;logged_in_user&quot;:null,&quot;current_seller&quot;:null,&quot;csp_nonce&quot;:&quot;eJ1cd4qYnyFqA7hcBmVHrgFi01OkPhER6fVaaSiIp3k=&quot;,&quot;locale&quot;:&quot;en-US&quot;,&quot;feature_flags&quot;:{&quot;disable_stripe_signup&quot;:true},&quot;authenticity_token&quot;:&quot;x-TzA21P5kmJBvkkrh5C9oSSHRYJbTKi1zAia-Pa8KvHTBw79Ece8tGB_Io-2yyHYTCn7qczsBLWR90xP79iFQ&quot;,&quot;flash&quot;:null,&quot;title&quot;:&quot;Supporting your customers - Gumroad Help Center&quot;,&quot;article&quot;:{&quot;title&quot;:&quot;Supporting your customers&quot;,&quot;slug&quot;:&quot;352-supporting-your-customers&quot;,&quot;content&quot;:&quot;\u003cdiv\u003e\n  \u003cp\u003e\u003cb\u003eIn this article:\u003c/b\u003e\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;#your-support-email\&quot; target=\&quot;_self\&quot;\u003eYour support email\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#product-specific-support-emails\&quot; target=\&quot;_self\&quot;\u003eProduct-specific support emails\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#which-emails-use-which-address\&quot; target=\&quot;_self\&quot;\u003eWhich emails use which address\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#answering-questions-from-the-sales-dashboard\&quot; target=\&quot;_self\&quot;\u003eAnswering questions from the sales dashboard\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#refunds-and-your-refund-policy\&quot; target=\&quot;_self\&quot;\u003eRefunds and your refund policy\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#reviews-and-review-reminders\&quot; target=\&quot;_self\&quot;\u003eReviews and review reminders\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#difficult-customers\&quot; target=\&quot;_self\&quot;\u003eDifficult customers\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#supporting-customers-in-a-community\&quot; target=\&quot;_self\&quot;\u003eSupporting customers in a community\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;#when-gumroad-support-helps-instead\&quot; target=\&quot;_self\&quot;\u003eWhen Gumroad support helps instead\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eYou answer questions about your own products: how to use a file, what a version includes, whether a refund is possible. Gumroad gives your customers a way to reach you and gives you the tools to act on what they ask for. This article covers both.\u003c/p\u003e\n  \u003ch3 id=\&quot;your-support-email\&quot;\u003eYour support email\u003c/h3\u003e\n  \u003cp\u003eYour \u003cb\u003esupport email\u003c/b\u003e is the address your customers reach you at. It is listed on the receipt of every sale, and it is where replies to the emails you send through Gumroad go.\u003c/p\u003e\n  \u003cp\u003eTo set it, open your \u003ca href=\&quot;https://gumroad.com/settings\&quot;\u003eSettings\u003c/a\u003e page, find the \u003cb\u003eSupport\u003c/b\u003e section, enter the address in the \u003cb\u003eEmail\u003c/b\u003e field, and click \u003cb\u003eUpdate settings\u003c/b\u003e.\u003c/p\u003e\n  \u003cp\u003eIf you leave it blank, your customers&#39; replies go to the email address on your account instead, the one you use to sign in.\u003c/p\u003e\n  \u003ch3 id=\&quot;product-specific-support-emails\&quot;\u003eProduct-specific support emails\u003c/h3\u003e\n  \u003cp\u003eIf different products should be handled by different inboxes, you can set an address per product. In the same \u003cb\u003eSupport\u003c/b\u003e section, click \u003cb\u003eAdd a product specific email\u003c/b\u003e, enter the address, and pick the products it should cover.\u003c/p\u003e\n  \u003cp\u003eA few things to know:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eOne address can cover as many of your products as you like.\u003c/li\u003e\n    \u003cli\u003eA product can only belong to one address. Products already assigned to another address won&#39;t be offered in the product picker.\u003c/li\u003e\n    \u003cli\u003eProducts you don&#39;t assign keep using your account-level support email.\u003c/li\u003e\n    \u003cli\u003eClick \u003cb\u003eUpdate settings\u003c/b\u003e to save, the same as any other change on this page.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003ch3 id=\&quot;which-emails-use-which-address\&quot;\u003eWhich emails use which address\u003c/h3\u003e\n  \u003cp\u003eOnce a product has its own support email, Gumroad uses it in these places:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003cb\u003eReceipts.\u003c/b\u003e The receipt for an order shows the product&#39;s support email, as long as every product in that order shares the same one. If a customer buys several products with different addresses in one order, the receipt shows your account-level support email instead.\u003c/li\u003e\n    \u003cli\u003e\u003cb\u003eEmails and posts about that product.\u003c/b\u003e When you \u003ca href=\&quot;169-how-to-send-an-update\&quot;\u003esend an email\u003c/a\u003e to the customers of a single product, or of a single version or tier, replies go to that product&#39;s support email. Emails sent to a wider audience, to your followers, to your affiliates, or to the customers of more than one product, use your account-level support email.\u003c/li\u003e\n    \u003cli\u003e\u003cb\u003eWorkflow emails.\u003c/b\u003e A \u003ca href=\&quot;131-using-workflows-to-send-automated-updates\&quot;\u003eworkflow\u003c/a\u003e built for one product behaves the same way, so replies to its emails land in that product&#39;s inbox.\u003c/li\u003e\n    \u003cli\u003e\u003cb\u003ePre-order confirmations and file-ready notifications.\u003c/b\u003e These are always about one product, so they use that product&#39;s address.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eIn every case, if the product has no address of its own, Gumroad falls back to your account-level support email, and then to the email address on your account.\u003c/p\u003e\n  \u003ch3 id=\&quot;answering-questions-from-the-sales-dashboard\&quot;\u003eAnswering questions from the sales dashboard\u003c/h3\u003e\n  \u003cp\u003eMost support requests are answered from the \u003ca href=\&quot;268-customer-dashboard\&quot;\u003eSales dashboard\u003c/a\u003e. Open a customer to see what they bought and act on it. From there you can:\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003eFix a mistyped email address, then resend the receipt.\u003c/li\u003e\n    \u003cli\u003eResend a receipt, a past email, or a workflow email the customer missed. Posts and workflow emails can only be resent to customers who are still subscribed to your emails; if a customer has unsubscribed, receipts are the only emails you can resend to them.\u003c/li\u003e\n    \u003cli\u003eMove a customer to a different version or tier without charging or refunding them.\u003c/li\u003e\n    \u003cli\u003eDisable a \u003ca href=\&quot;76-license-keys\&quot;\u003elicense key\u003c/a\u003e or change its number of seats.\u003c/li\u003e\n    \u003cli\u003eCancel a membership.\u003c/li\u003e\n    \u003cli\u003eIssue a full or partial refund.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003eIf a customer says they never received an email from you, \u003ca href=\&quot;54-not-receiving-updates\&quot;\u003ethis article\u003c/a\u003e walks through the usual causes. For missing receipts specifically, see \u003ca href=\&quot;78-my-customer-did-not-receive-a-receipt\&quot;\u003ecustomers not receiving receipts\u003c/a\u003e.\u003c/p\u003e\n  \u003ch3 id=\&quot;refunds-and-your-refund-policy\&quot;\u003eRefunds and your refund policy\u003c/h3\u003e\n  \u003cp\u003eRefunds are yours to decide and yours to issue. \u003ca href=\&quot;47-how-to-refund-a-customer\&quot;\u003eIssuing a refund\u003c/a\u003e covers full refunds, partial refunds, and what happens to your balance and fees afterwards.\u003c/p\u003e\n  \u003cp\u003eYou can also tell customers where you stand before they buy by setting a \u003ca href=\&quot;335-custom-refund-policy\&quot;\u003ecustom refund policy\u003c/a\u003e on a product, which is shown on its product page. Clear terms up front are the cheapest support you will ever provide, and Gumroad uses your stated policy when handling refunds or disputes on your behalf.\u003c/p\u003e\n  \u003ch3 id=\&quot;reviews-and-review-reminders\&quot;\u003eReviews and review reminders\u003c/h3\u003e\n  \u003cp\u003eCustomers can \u003ca href=\&quot;222-product-ratings-on-gumroad\&quot;\u003erate and review\u003c/a\u003e what they bought, and Gumroad sends each of them a one-time reminder asking them to do so. You can turn those reminders off for your whole account in the \u003cb\u003eReview reminders\u003c/b\u003e section of your \u003ca href=\&quot;https://gumroad.com/settings\&quot;\u003eSettings\u003c/a\u003e page.\u003c/p\u003e\n  \u003cp\u003eA review you disagree with is often a support request in disguise. Reaching out to the customer and solving the underlying problem tends to work better than hiding ratings. Fully refunding a purchase removes its rating automatically; a partial refund leaves the rating in place, except on a bundle purchase, where a partial refund removes the ratings of the products inside the bundle.\u003c/p\u003e\n  \u003ch3 id=\&quot;difficult-customers\&quot;\u003eDifficult customers\u003c/h3\u003e\n  \u003cp\u003eIf someone abuses your products or your patience, you have two tools, both covered in \u003ca href=\&quot;329-customer-moderation\&quot;\u003eCustomer moderation\u003c/a\u003e: you can block an email address from buying from you again, and you can revoke a customer&#39;s access to content they have already bought.\u003c/p\u003e\n  \u003ch3 id=\&quot;supporting-customers-in-a-community\&quot;\u003eSupporting customers in a community\u003c/h3\u003e\n  \u003cp\u003eFor products where the same questions come up again and again, a \u003ca href=\&quot;347-gumroad-community\&quot;\u003eGumroad Community\u003c/a\u003e chat can carry a lot of your support load. Answers stay visible to everyone who bought the product, and customers often answer each other.\u003c/p\u003e\n  \u003ch3 id=\&quot;when-gumroad-support-helps-instead\&quot;\u003eWhen Gumroad support helps instead\u003c/h3\u003e\n  \u003cp\u003eSome questions belong to us rather than to you: failed payments, download problems, fraudulent purchases, and anything about a customer&#39;s Gumroad account. \u003ca href=\&quot;20-how-do-i-contact-gumroad\&quot;\u003eContact Gumroad\u003c/a\u003e has the full split of what we handle and what creators handle, so you can forward a customer to us when it is ours to fix. Our \u003ca href=\&quot;348-support-response-times\&quot;\u003eresponse times\u003c/a\u003e are usually well under a day.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv\u003e\n  \u003ch3\u003eRelated Articles\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\&quot;67-the-settings-menu\&quot;\u003e\u003cspan\u003eAccount settings\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n    \u003cli\u003e\u003ca href=\&quot;268-customer-dashboard\&quot;\u003e\u003cspan\u003eThe sales dashboard\u003c/s
