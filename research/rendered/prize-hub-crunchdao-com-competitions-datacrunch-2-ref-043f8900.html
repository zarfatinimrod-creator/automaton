ewae4i.js\",\"/_next/static/chunks/0.wopa-0byr-0.js\",\"/_next/static/chunks/0~n0skg0cn-pm.js\",\"/_next/static/chunks/09.9-zyun_ilc.js\",\"/_next/static/chunks/0nie0ut8-dkds.js\",\"/_next/static/chunks/0ui3hrznc3fc6.js\",\"/_next/static/chunks/0ia7imbc3feml.js\",\"/_next/static/chunks/0wg1bjoh5v5iw.js\",\"/_next/static/chunks/0y3kziv_u_xye.js\",\"/_next/static/chunks/0wq9zgjtw8sg2.js\",\"/_next/static/chunks/07ov4eyftl-~z.js\",\"/_next/static/chunks/0d89l1251~wz~.js\",\"/_next/static/chunks/0g1lhli.zacy6.js\",\"/_next/static/chunks/0sxc0x5l6um~2.js\",\"/_next/static/chunks/0saq3s..02j~0.js\",\"/_next/static/chunks/0n9algkg_t76j.js\",\"/_next/static/chunks/0ux00~vv0lphk.js\",\"/_next/static/chunks/10qk6c32fud5~.js\",\"/_next/static/chunks/102pepw28kyas.js\",\"/_next/static/chunks/0odtm21_2s09p.js\",\"/_next/static/chunks/05ufhz~395qlp.js\",\"/_next/static/chunks/0uw7j4vuo8j6c.js\"],\"HydrationBoundary\"]\n"])</script><script>self.__next_f.push([1,"3b:T439,\n\u003cp\u003e\u003ca target=\"_blank\" href=\"https://datacrunch.com/\"\u003eDataCrunch\u003c/a\u003e uses the quantitative research of the CrunchDAO to manage its systematic market-neutral portfolio.\u003c/p\u003e\n\n\u003cp\u003eThe long-term strategic goal of the fund is capital appreciation by capturing idiosyncratic return at low volatility.\u003c/p\u003e\n\n\u003cp\u003eIn order to achieve this goal, DataCrunch needs the community to assess the relative performance of all assets in a subset of the \u003ca target=\"_blank\" href=\"https://www.investopedia.com/terms/r/russell_3000.asp\"\u003eRussell 3000\u003c/a\u003e universe. In other words, DataCrunch is expecting your model to predict the performance of the constituent of its investment universe.\u003c/p\u003e\n\n\u003cp\u003eThis dataset is the new of the original DataCrunch dataset that can be found \u003ca target=\"_blank\" href=\"https://hub.crunchdao.com/competitions/datacrunch\"\u003ehere\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eTo read more about the evolutions between #1 and #2 of the DataCrunch datasets, please \u003ca target=\"_blank\" href=\"https://docs.crunchdao.com/competitions/competitions/datacrunch-2/from-dataset-1-to-dataset-2\"\u003eread the full article\u003c/a\u003e.\u003c/p\u003e\n3c:T4b8,\n\u003cp\u003eDataCrunch is distributing 1,000 USDC every weeks.\u003c/p\u003e\n\n\u003cp\u003eThe reward scheme is calculated as follows for both metrics:\u003c/p\u003e\n\n\u003ccode class=\"block\"\u003e\n  \u003cpre\u003e# Reward Calculation\u003c/pre\u003e\n\n  \u003cpre\u003eweekly_rewards = 1000\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e# 0 = worst, 1 = best\u003c/pre\u003e\n\n  \u003cpre\u003epercentile_rank = your_rank / nb_participants\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003eif percentile_rank \u0026lt;= 0.5:\u003c/pre\u003e\n\n  \u003cpre\u003e    reward = 0\u003c/pre\u003e\n\n  \u003cpre\u003eelse:\u003c/pre\u003e\n\n  \u003cpre\u003e    # excess above median, scaled 0–1\u003c/pre\u003e\n\n  \u003cpre\u003e    e = 2 * (percentile_rank - 0.5)\u003c/pre\u003e\n\n  \u003cpre\u003e    weight = e ** 20\u003c/pre\u003e\n\n  \u003cpre\u003e    reward = weekly_rewards * (weight / sum(participants_weights))\u003c/pre\u003e\n\u003c/code\u003e\n\n\u003cdiv\u003e\n  \u003cfigure\u003e    \u003cimg src=\"https://3895192033-files.gitbook.io/~/files/v0/b/gitbook-x-prod.appspot.com/o/spaces%2FrZv71uKEauXe2J8CJm1h%2Fuploads%2FB8MJB3Mmily6ptl9McKi%2Fimage2.png?alt=media\u0026token=97f345be-01b1-4a9b-9a4b-4f7e55742251\" /\u003e    \u003cfigcaption\u003e\n    \u003cp\u003e\u003c/p\u003e\n    \u003c/figcaption\u003e  \u003c/figure\u003e\n\u003c/div\u003e\n\n\u003cp\u003eAll rewards are computed on the leaderboards.\u003c/p\u003e\n\n\u003cp\u003eThe Historical Rewards are the sum of every payout you have received from DataCrunch.\u003c/p\u003e\n\n\u003cp\u003eThe Projected Rewards are the current estimated rewards yet to be distributed.\u003c/p\u003e\n3d:T8cd,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eEach row of the dataset represents a single stock at a given weekly timestamp.\u003c/p\u003e\n\n\u003ch2 id=\"x_train\"\u003e\u003ccode class=\"inline\"\u003eX_train\u003c/code\u003e\u003c/h2\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003emoon\u003c/code\u003e: A sequentially increasing integer representing a date. Time between subsequent moons is constant, denoting a weekly fixed frequency at which the data is sampled.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eid\u003c/code\u003e: A unique identifier representing a stock at a given \u003ccode class=\"inline\"\u003emoon\u003c/code\u003e. Note that the same asset has a different \u003ccode class=\"inline\"\u003eid\u003c/code\u003e in different \u003ccode class=\"inline\"\u003emoon\u003c/code\u003e.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eFeature_1\u003c/code\u003e, …, \u003ccode class=\"inline\"\u003eFeature_1150\u003c/code\u003e: Anonymised features that describe the state of assets on a given \u003ccode class=\"inline\"\u003emoon\u003c/code\u003e. They are ways of assessing the relative performance of each stock on a given \u003ccode class=\"inline\"\u003emoon\u003c/code\u003e.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2 id=\"y_train\"\u003e\u003ccode class=\"inline\"\u003ey_train\u003c/code\u003e\u003c/h2\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003emoon\u003c/code\u003e: Same as in \u003ccode class=\"inline\"\u003eX_train\u003c/code\u003e.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003eid\u003c/code\u003e: Same as in \u003ccode class=\"inline\"\u003eX_train\u003c/code\u003e.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003etarget\u003c/code\u003e: The targets that will help you build your models. It is derived from the 28 days forward returns.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2 id=\"x_test-and-y_test\"\u003e\u003ccode class=\"inline\"\u003eX_test\u003c/code\u003e and \u003ccode class=\"inline\"\u003ey_test\u003c/code\u003e\u003c/h2\u003e\n\n\u003cp\u003e\u003ccode class=\"inline\"\u003eX_test\u003c/code\u003e and \u003ccode class=\"inline\"\u003ey_test\u003c/code\u003e have the same structure as \u003ccode class=\"inline\"\u003eX_train\u003c/code\u003e and \u003ccode class=\"inline\"\u003ey_train\u003c/code\u003e but comprise only one \u003ccode class=\"inline\"\u003emoon\u003c/code\u003e at each iteration. These files are used to simulate the submission process locally via \u003ccode class=\"inline\"\u003ecrunch.test()\u003c/code\u003e (within the code), or \u003ccode class=\"inline\"\u003ecrunch test\u003c/code\u003e (via the CLI). The aim is to help participants debug their code and have successful submissions. A successful local test usually means no errors during execution on the submission platform.\u003c/p\u003e\n\n\u003ch2 id=\"embargo\"\u003eEmbargo\u003c/h2\u003e\n\n\u003cp\u003eThe embargo is defined by the length of the target and is thus 4 moons.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"3e:Tf3a,"])</script><script>self.__next_f.push([1,"\n\u003ch2 id=\"data-splits\"\u003eData Splits\u003c/h2\u003e\n\n\u003cp\u003eThe DataCrunch competition follows a fixed and transparent structure:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eLocal data:\u003c/p\u003e\n\n    \u003cul\u003e\n      \u003cli\u003e\n        \u003cp\u003eThe first 15 years of the dataset. A smaller version of the latest 2.5 years of these 15 years is provided for small configurations.\u003c/p\u003e\n      \u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eCloud data:\u003c/p\u003e\n\n    \u003cul\u003e\n      \u003cli\u003e\n        \u003cp\u003eA public Out-of-Sample allowing participants to test your submission in the cloud. This data is on the first two month of 2020 year.\u003c/p\u003e\n      \u003c/li\u003e\n\n      \u003cli\u003e\n        \u003cp\u003eA private Out-of-Sample allowing DataCrunch to have historical performance of the models in order to do meta-modelling and ensemble research. (see below)\u003c/p\u003e\n      \u003c/li\u003e\n\n      \u003cli\u003e\n        \u003cp\u003eThe last available date of the dataset will be scored on a weekly basis, after the target is resolved.\u003c/p\u003e\n      \u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cdiv class=\"hint info\"\u003e\n  \u003cp\u003eYour code will have access to the entire dataset when running in the cloud.\u003c/p\u003e\n\u003c/div\u003e\n\n\u003ch2 id=\"submission-cut-off\"\u003eSubmission Cut-off\u003c/h2\u003e\n\n\u003cp\u003eThe window to submit and lock your model is removed. You can submit your code / model whenever you want. If the run completes before Sunday 12pm UTC, it will be taken into account for the week. Otherwise, the run will be terminated and ignored for the week.\u003c/p\u003e\n\n\u003cp\u003eThe prediction target takes 1 day + 4 weeks to be fully resolved, so the score for a model submitted in week #1 will be available and published in week #6.\u003c/p\u003e\n\n\u003ch2 id=\"private-historical-performance-dataset\"\u003ePrivate Historical Performance Dataset\u003c/h2\u003e\n\n\u003cp\u003eThe first time your model is run for the Out-of-Sample, you must first infer a mandatory ~300-moon test set, which is not scored but used for historical performance analysis. After that, you will only need to infer one moon per week.\u003c/p\u003e\n\n\u003cp\u003eIf you decide to submit (and select) a new model, you will need to predict this dataset again.\u003c/p\u003e\n\n\u003ch2 id=\"train-frequency\"\u003eTrain Frequency\u003c/h2\u003e\n\n\u003cp\u003eThe train frequency is representing when your model's \u003ccode class=\"inline\"\u003etrain()\u003c/code\u003e function will be called:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n    \u003cp\u003eIf set to 0, \u003ccode class=\"inline\"\u003etrain()\u003c/code\u003e will never be called.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eIf set to 1, \u003ccode class=\"inline\"\u003etrain()\u003c/code\u003e will be called at every moon.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eIf set to 2, \u003ccode class=\"inline\"\u003etrain()\u003c/code\u003e will be called at every even moon.\u003c/p\u003e\n  \u003c/li\u003e\n\n  \u003cli\u003e\n    \u003cp\u003eIf set to 10, \u003ccode class=\"inline\"\u003etrain()\u003c/code\u003e will be called at every tenth moon.\u003c/p\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThe number is based on the modulo of the moon itself, not the one of the iteration, meaning that a train frequency of 5 will run at moon 300, 305, 310, ...\u003c/p\u003e\n\n\u003cp\u003eIt is not based on the loop. If the cloud environment starts at moon 303, only after two moon (305) the \u003ccode class=\"inline\"\u003etrain()\u003c/code\u003e function will be called.\u003c/p\u003e\n\n\u003cp\u003eYou can put frequency, but the smaller, the more time the \u003ccode class=\"inline\"\u003etrain()\u003c/code\u003e function will be called, and the longer your code will take to run. Some models may not be able to run within the time constraint, considering that you must first pass the private historical performance dataset.\u003c/p\u003e\n\n\u003cp\u003eWhen you run your model for the first time, you can choose the train frequency. This frequency will be used for the Out-of-Sample phase. It is not possible to change the frequency during an Out-of-Sample phase. If you need to change the frequency, you must submit again.\u003c/p\u003e\n\n\u003cdiv\u003e\n  \u003cfigure\u003e    \u003cimg src=\"https://3895192033-files.gitbook.io/~/files/v0/b/gitbook-x-prod.appspot.com/o/spaces%2FrZv71uKEauXe2J8CJm1h%2Fuploads%2F3xC5hei3SPoCFgsLVFsO%2Fimage.png?alt=media\u0026token=ddf1ca83-983d-40eb-9bfe-85c0ea717735\" /\u003e    \u003cfigcaption\u003e\n    \u003cp\u003e\u003ccode class=\"inline\"\u003etrain()\u003c/code\u003e function calling matrix for a moon and a train frequency \u003c/p\u003e\n    \u003c/figcaption\u003e  \u003c/figure\u003e\n\u003c/div\u003e\n"])</script><script>self.__next_f.push([1,"3f:Tb19,"])</script><script>self.__next_f.push([1,"\n\u003cp\u003eParticipants can begin by implementing the required \u003ccode class=\"inline\"\u003etrain\u003c/code\u003e and \u003ccode class=\"inline\"\u003einfer\u003c/code\u003e functions and validating locally using the \u003ca target=\"_blank\" href=\"https://colab.research.google.com/github/crunchdao/quickstarters/blob/master/competitions/datacrunch-2/quickstarters/quickstarter/quickstarter.ipynb\"\u003eprovided quickstarter notebook\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe API is as follow:\u003c/p\u003e\n\n\u003ccode class=\"block\"\u003e\n  \u003cpre\u003edef train(\u003c/pre\u003e\n\n  \u003cpre\u003e    X_train: pd.DataFrame,\u003c/pre\u003e\n\n  \u003cpre\u003e    y_train: pd.DataFrame,\u003c/pre\u003e\n\n  \u003cpre\u003e    model_directory_path: str,\u003c/pre\u003e\n\n  \u003cpre\u003e    loop_moon: int,\u003c/pre\u003e\n\n  \u003cpre\u003e    embargo: int,\u003c/pre\u003e\n\n  \u003cpre\u003e) -\u0026gt; None:\u003c/pre\u003e\n\n  \u003cpre\u003e    \u0026quot;\u0026quot;\u0026quot;\u003c/pre\u003e\n\n  \u003cpre\u003e    At each retrain this function will have to save an updated version of the model under the model_directory_path, as in the example below.\u003c/pre\u003e\n\n  \u003cpre\u003e    \u003c/pre\u003e\n\n  \u003cpre\u003e    Note: You can use other serialization methods than joblib.dump(), as long as it matches what reads the model in infer().\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e    Args:\u003c/pre\u003e\n\n  \u003cpre\u003e        X_train, y_train: the data to train the model.\u003c/pre\u003e\n\n  \u003cpre\u003e        model_directory_path: the path to save your updated model.\u003c/pre\u003e\n\n  \u003cpre\u003e        loop_moon: the moon currently being processed.\u003c/pre\u003e\n\n  \u003cpre\u003e        embargo: data embrago.\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e    Returns:\u003c/pre\u003e\n\n  \u003cpre\u003e        None: Returned value is ignored.\u003c/pre\u003e\n\n  \u003cpre\u003e    \u0026quot;\u0026quot;\u0026quot;\u003c/pre\u003e\n\u003c/code\u003e\n\n\u003ccode class=\"block\"\u003e\n  \u003cpre\u003edef infer(\u003c/pre\u003e\n\n  \u003cpre\u003e    X_test: pd.DataFrame,\u003c/pre\u003e\n\n  \u003cpre\u003e    model_directory_path: str,\u003c/pre\u003e\n\n  \u003cpre\u003e    loop_moon: int,\u003c/pre\u003e\n\n  \u003cpre\u003e    embargo: int,\u003c/pre\u003e\n\n  \u003cpre\u003e) -\u0026gt; pd.DataFrame:\u003c/pre\u003e\n\n  \u003cpre\u003e    \u0026quot;\u0026quot;\u0026quot;\u003c/pre\u003e\n\n  \u003cpre\u003e    This function will load the model(s) saved at the previous iteration and use it/them to produce your inference on the current moon.\u003c/pre\u003e\n\n  \u003cpre\u003e    It is mandatory to send your inferences with the ids and moon so the system can match it correctly.\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e    Args:\u003c/pre\u003e\n\n  \u003cpre\u003e        X_test: the independant variables of the current moon passed to your model.\u003c/pre\u003e\n\n  \u003cpre\u003e        model_directory_path: the path to the directory to the directory in wich we will be saving your updated model.\u003c/pre\u003e\n\n  \u003cpre\u003e        loop_moon: the moon currently being processed.\u003c/pre\u003e\n\n  \u003cpre\u003e        embargo: data embargo.\u003c/pre\u003e\n\n  \u003cpre\u003e\u003c/pre\u003e\n\n  \u003cpre\u003e    Returns:\u003c/pre\u003e\n\n  \u003cpre\u003e        A pd.DataFrame (moon, id, prediction) with the inferences of your model for the current moon.\u003c/pre\u003e\n\n  \u003cpre\u003e    \u0026quot;\u0026quot;\u0026quot;\u003c/pre\u003e\n\u003c/code\u003e\n\n\u003cdiv class=\"hint info\"\u003e\n  \u003cp\u003eRunning a local test will validate your API.\u003c/p\u003e\n\n  \u003cp\u003eAll parameters are optional and be commented if not needed.\u003c/p\u003e\n\n  \u003cp\u003eIf the test passes locally, it will also pass in the cloud environment.\u003c/p\u003e\n\u003c/div\u003e\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"$L3a\",null,{\"state\":{\"mutations\":[],\"queries\":[{\"dehydratedAt\":1791276397747,\"state\":{\"data\":[{\"id\":1063,\"name\":\"description\",\"displayName\":\"description\",\"type\":\"CONTENT\",\"nativeConfiguration\":{\"source\":\"$3b\",\"language\":\"HTML\"},\"order\":0,\"updatedAt\":\"2026-08-03T17:25:47.205408\",\"createdAt\":\"2026-08-03T17:25:47.205403\"},{\"id\":1064,\"name\":\"reward-scheme\",\"displayName\":\"Reward Scheme\",\"type\":\"CONTENT\",\"nativeConfiguration\":{\"source\":\"$3c\",\"language\":\"HTML\"},\"order\":10,\"updatedAt\":\"2026-08-03T17:25:47.206888\",\"createdAt\":\"2026-08-03T17:25:47.206884\"},{\"id\":1065,\"name\":\"dataset\",\"displayName\":\"Dataset\",\"type\":\"CONTENT\",\"nativeConfiguration\":{\"source\":\"$3d\",\"language\":\"HTML\"},\"order\":20,\"updatedAt\":\"2026-08-03T17:25:47.207956\",\"createdAt\":\"2026-08-03T17:25:47.207954\"},{\"id\":1066,\"name\":\"tournament-structure\",\"displayName\":\"Tournament Structure\",\"type\":\"CONTENT\",\"nativeConfiguration\":{\"source\":\"$3e\",\"language\":\"HTML\"},\"order\":30,\"updatedAt\":\"2026-08-03T17:25:47.208779\",\"createdAt\":\"2026-08-03T17:25:47.208777\"},{\"id\":1067,\"name\":\"scoring-and-evaluation\",\"displayName\":\"Scoring and Evaluation\",\"type\":\"CONTENT\",\"nativeConfiguration\":{\"source\":\"\\n\u003c
