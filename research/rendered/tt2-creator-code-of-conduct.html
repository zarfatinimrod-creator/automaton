com/tos-alisg-i-0twjg7x6w4-sg/f1cba95d9f3321c82bff85fb55bb5c0f.png~tplv-0twjg7x6w4-default:0:0:q75.image","ttp":"https://p16-ttark.tiktokcdn-us.com/tos-useast5-i-1rzkm2vceq-tx/f1cba95d9f3321c82bff85fb55bb5c0f.png~tplv-1rzkm2vceq-default:0:0:q75.image","ttp2":"https://p16-ttark-useast8.tiktokcdn-us.com/tos-useast8-i-zr23xo8qx2-tx2/f1cba95d9f3321c82bff85fb55bb5c0f.png~tplv-zr23xo8qx2-default:0:0:q75.image","us_east":"https://p16-ttak-va.tiktokcdn.com/tos-maliva-i-m3rm1y8daf-us/f1cba95d9f3321c82bff85fb55bb5c0f.png~tplv-m3rm1y8daf-default:0:0:q75.image","us_east_red":"https://p16-ttark-useastred.tiktokcdn-eu.com/tos-useast2a-i-mysv9ld3jo-euttp/f1cba95d9f3321c82bff85fb55bb5c0f.png~tplv-mysv9ld3jo-default:0:0:q75.image","us_ttp":"https://p16-ttark.tiktokcdn-us.com/tos-useast5-i-1rzkm2vceq-tx/f1cba95d9f3321c82bff85fb55bb5c0f.png~tplv-1rzkm2vceq-default:0:0:q75.image","us_ttp2":"https://p16-ttark-useast8.tiktokcdn-us.com/tos-useast8-i-zr23xo8qx2-tx2/f1cba95d9f3321c82bff85fb55bb5c0f.png~tplv-zr23xo8qx2-default:0:0:q75.image","va":"https://p16-ttak-va.tiktokcdn.com/tos-maliva-i-m3rm1y8daf-us/f1cba95d9f3321c82bff85fb55bb5c0f.png~tplv-m3rm1y8daf-default:0:0:q75.image"}}}],"sys":{"id":"topic/enter-post-contests"}}]}]}]}},"articleData":{"article":{"title":"Creator Code of Conduct","content":"\u003cp\u003eIt's our priority to maintain a safe and welcoming environment for everyone on TikTok. We expect all creators to follow our Community Guidelines, Terms of Service, and any other agreed-upon creator terms or program terms, so we can all stay protected and keep fostering community on our platform.\u003c/p\u003e\u003ch1 level=\"1\" id=\"\" align=\"\"\u003eAccessing TikTok's Creator Programs\u003c/h1\u003e\u003cp\u003eAll creators must comply with the Creator Code of Conduct to participate in \"Creator Programs.\" TikTok offers \"Creator Programs\", features, events, and campaigns, like creator management and promotional activities, that support and reward you for posting high-quality content. This includes our \"Creator Programs,\" such as the Creator Rewards Program, TikTok One, Subscription, LIVE gifting, TikTok Shop, and more! Access to these programs is a privilege, not a right. Therefore, all users must comply with the Creator Code of Conduct (defined below) to participate in Creator Programs.\u003c/p\u003e\u003ch1 level=\"1\" id=\"\" align=\"\"\u003eCreator Code of Conduct\u003c/h1\u003e\u003cp\u003eAs a creator, your visibility can give you a lot of influence. So, we expect you to conduct yourself on and off our platform in a manner that does not create potential harm to others or jeopardize the safety of our users. This includes behavior that is likely to damage the integrity of TikTok, its affiliates, partners, suppliers, or customers.\u003c/p\u003e\u003cp\u003eProhibited behaviors under the Creator Code of Conduct, on and off-platform, include:\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eBullying or Harassment\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eBullying or harassing others, such as sexual harassment, stalking, doxxing, blackmail, or physical threats, or mocking victims of tragedies.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHarmful, Violent, or Criminal Behavior\u003c/strong\u003e\u003c/p\u003e\u003cp\u003ePromoting, encouraging, or engaging in behavior that could harm others, animals, or involve environmental destruction. This includes inciting violence, organizing dangerous activities or harmful imitable behaviors, animal cruelty, human exploitation, or risking the safety and well-being of minors, such as promoting or facilitating child labour, mistreatment or abuse. All such conduct must comply with applicable laws and regulations in local jurisdictions.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSexual Misconduct\u003c/strong\u003e\u003c/p\u003e\u003cp\u003ePromoting, encouraging, or engaging in sexual misconduct, including non-consensual sexual activity, solicitation of minors, and blackmail or threats to share non-consensual intimate imagery.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSelf Harm\u003c/strong\u003e\u003c/p\u003e\u003cp\u003ePromoting or encouraging self-harm, including self-injury, suicide hoaxes, disordered eating, or glamorising participation in life-threatening activities.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHate Speech and Hateful Behavior\u003c/strong\u003e\u003c/p\u003e\u003cp\u003ePromoting or encouraging hate speech or hateful ideologies, or membership of a hateful organization.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eCriminal Activities and Violent Extremist Organizations\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eMembership of a criminal or violent extremist organization, or participation in criminal or fraudulent activities, such as trade of illegal or counterfeit goods, bribery, illegal gambling, supplying of regulated substances to a minor, violations of intellectual property rights, or committing a serious crime.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eExploitation of a Tragic Event\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eExploiting a potentially traumatic ongoing tragedy or conflict, including making false claims, or presenting sensitive topics in an inflammatory or polarizing manner to incentivize users to send gifts.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMisinformation and Deceptive Behaviors\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eParticipating in activities involving spam, misinformation, frauds and scams, false representations, fake engagement, or misleading solicitation of engagement or gifts.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePlatform Manipulation and Circumvention\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eEngaging in activities intended to unfairly gain advantage or disadvantage others on TikTok. This includes activities such as collusion, cheating, DDoSing, multiple-account abuse, or use of VPNs to circumvent our systems.\u003c/p\u003e\u003cp\u003eViolations of the Creator Code of Conduct, can lead to you being restricted from our creator management program (where applicable) and participation in related promotional activities. For severe violations, we may temporarily restrict your access to our Creator Programs for three months, including monetization programs and activities. \u003cstrong\u003eFollowing a review, this restriction may be maintained or removed. For egregious behavior, the restriction may be permanent.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIf we find verifiable claims related to your conduct on or off our platform, like public records, such as criminal charges, convictions, credible news stories, social media posts, or self-admission of misconduct, we use that information to determine whether you have breached the Creator Code of Conduct.\u003c/p\u003e\u003cp\u003eAs outlined in our \u003ca href=\"https://www.tiktok.com/safety/en/policies-and-engagement\" target=\"_blank\" rel=\"nofollow noreferrer\" class=\"syl-link\" data-anchor-id=\"\"\u003eCommunity Guidelines\u003c/a\u003e and \u003ca href=\"https://www.tiktok.com/legal/page/us/terms-of-service/en\" target=\"_blank\" rel=\"nofollow noreferrer\" class=\"syl-link\" data-anchor-id=\"\"\u003eTerms of Service\u003c/a\u003e, we may also suspend or permanently restrict TikTok accounts for violating our policies. All enforcement actions taken under the Creator Code of Conduct will apply to future participation in Creator Programs and will not restrict contractual compensation from past engagements.\u003c/p\u003e\u003cp\u003eWe may exercise our judgment to determine whether a creator's behavior threatens the safety of our community or displays any of the behavior noted above. If we find a violation but are satisfied that the account no longer poses a danger or threat of damage to TikTok, we may choose not to suspend or remove their access to Creator Programs, or to reinstate access if it was previously removed. We reserve the right to periodically review accounts and content for adherence to these standards.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cspan style=\"font-size: 18px;\"\u003eIf you believe your account has been restricted in error, you can \u003ca href=\"https://www.tiktok.com/creator-academy/en/article/guidelines-moderation-status-and-appeals?enter_from=article_display_page\u0026amp;enter_method=article_link_click?enter_from=search_results_page\u0026amp;enter_method=search_result_click\u0026amp;previous_page=search_results_page\" target=\"_blank\" rel=\"nofollow noreferrer\" class=\"syl-link\" data-anchor-id=\"\"\u003eappeal the decision\u003c/a\u003e.\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e","creatorTier":2,"recommended":true,"sys":{"publishedAt":"2026-09-26T01:11:40.248Z"},"cover":{"urls":{"va":null,"sg":"https://p16-ttark-sg.tiktokcdn.com/tos-alisg-i-0twjg7x6w4-sg/14d77e9cfbbb73573f84b41fb83bf974.png~tplv-0twjg7x6w4-default:0:0:q75.image","ie":"https://p16-headlessx-image-no.tiktokcdn-eu.com/tos-no1a-i-tmgzy48pwj-no/14d77e9cfbbb73573f84b41fb83bf974.png~tplv-tmgzy48pwj-default:0:0:q75.image","ttp":"https://p16-ttark.tiktokcdn-us.com/tos-useast5-i-1rzkm2vceq-tx/14d77e9cfbbb73573f84b41fb83bf974.png~tplv-1rzkm2vceq-default:0:0:q75.image","ttp2":"https://p16-ttark-useast8.tiktokcdn-us.com/tos-useast8-i-zr23xo8qx2-tx2/14d77e9cfbbb73573f84b41fb83bf974.png~tplv-zr23xo8qx2-default:0:0:q75.image","gcp":"https://p16-ttark-useastred.tiktokcdn-eu.com/tos-useast2a-i-mysv9ld3jo-euttp/14d77e9cfbbb73573f84b41fb83bf974.png~tplv-mysv9ld3jo-default:0:0:q75.image"}},"category":{"sys":{"id":"category/community-guidelines"}}}},"footerDataFromServer":{"sys":{"publishedLanguages":["sq","ar","az","bn-IN","bg","my","ca","ceb","zh-Hans","zh-Hant","hr","cs","da","nl","en","en-GB","et","fil","fi","fr","fr-CA","de","el","he","hi","hu","is","id","ga","it","ja","jv","kk","km","ko","lv","lt","ms","nb","pl","pt","pt-BR","ro","ru","sk","sl","es","es-419","sw","sv","th","tr","uk","ur","uz","vi"]},"logo":{"logoCta":"https://www.tiktok.com","shouldS
