# Publish only what the shipped pages load, never the whole folder, so
# package.json, README.md, tests/, scripts/ and unverified configs are never
# uploaded. The build exits 1 - and this deploy fails - while a publish blocker
# stands (today: the accessibility contact placeholder). Never point this at
# _preview/ or add --preview: that tree ignores the blockers on purpose.
# Opening index.html locally still works - the source tree does not move.
[build]
  publish = "_site"
  command = "node scripts/build-site.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Optional Plausible/PostHog are the only third parties left, plus one
    # connect-src entry for api.gumroad.com: the licence check, and nothing else,
    # from the buyer's browser (research/measurements/gumroad-license-decision.md).
    # Paddle is gone: Gumroad replaced it, and the Gumroad checkout is a link to
    # their product page - no SDK, no overlay, no iframe - so script-src and
    # frame-src carry nothing of Gumroad's.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io https://*.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://plausible.io https://*.posthog.com https://api.gumroad.com; frame-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Never serve dev files.
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
